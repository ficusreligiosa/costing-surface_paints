<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surface Paints Pvt. Ltd. — Powder Coating Costing Software</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg: #f4f6fb;
            --bg2: #ffffff;
            --bg3: #eef1f8;
            --border: #e1e6f0;
            --border2: #c8d0e8;
            --accent: #2563eb;
            --accent2: #1d4ed8;
            --accent-light: #eff6ff;
            --red: #dc2626;
            --red-light: #fef2f2;
            --green: #16a34a;
            --green-light: #f0fdf4;
            --blue: #2563eb;
            --blue-light: #eff6ff;
            --purple: #7c3aed;
            --purple-light: #f5f3ff;
            --teal: #0891b2;
            --teal-light: #ecfeff;
            --orange: #ea580c;
            --orange-light: #fff7ed;
            --gold: #b45309;
            --gold-light: #fffbeb;
            --text: #1a1f36;
            --text2: #4b5675;
            --text3: #8b95b0;
            --card: #ffffff;
            --sidebar-w: 262px;
            --shadow: 0 1px 4px rgba(37, 99, 235, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 16px rgba(37, 99, 235, 0.10), 0 2px 4px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 12px 48px rgba(37, 99, 235, 0.14);
            --radius: 10px;
            --radius-lg: 14px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        code,
        pre,
        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg3);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border2);
            border-radius: 3px;
        }

        .icon-svg {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* LOGIN */
        #login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #eef4ff 0%, #f5f8ff 40%, #e8f0fe 100%);
            position: relative;
            overflow: hidden;
        }

        #login-screen::before {
            content: '';
            position: absolute;
            top: -20%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.10) 0%, transparent 70%);
            pointer-events: none;
        }

        #login-screen::after {
            content: '';
            position: absolute;
            bottom: -10%;
            left: -5%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.08) 0%, transparent 70%);
            pointer-events: none;
        }

        .login-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 44px 40px;
            width: 440px;
            position: relative;
            z-index: 1;
            box-shadow: 0 20px 60px rgba(37, 99, 235, 0.12), 0 4px 16px rgba(0, 0, 0, 0.06);
        }

        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-logo .logo-wrap {
            width: auto;
            height: 80px;
            background: transparent;
            border-radius: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }

        .login-logo h1 {
            font-size: 22px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.5px;
        }

        .login-logo p {
            color: var(--text2);
            font-size: 13px;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text2);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 7px;
        }

        .form-control {
            width: 100%;
            background: var(--bg);
            border: 1.5px solid var(--border);
            border-radius: 9px;
            padding: 11px 14px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        select.form-control option {
            background: #fff;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 10px 18px;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-family: inherit;
            transition: all 0.15s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
        }

        .btn-primary:hover {
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.35);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--bg);
            color: var(--text);
            border: 1.5px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-light);
        }

        .btn-danger {
            background: var(--red-light);
            color: var(--red);
            border: 1.5px solid #fca5a5;
        }

        .btn-danger:hover {
            background: #fecaca;
        }

        .btn-success {
            background: var(--green-light);
            color: var(--green);
            border: 1.5px solid #6ee7b7;
        }

        .btn-success:hover {
            background: #a7f3d0;
        }

        .btn-blue {
            background: var(--blue-light);
            color: var(--blue);
            border: 1.5px solid #93c5fd;
        }

        .btn-blue:hover {
            background: #bfdbfe;
        }

        .btn-teal {
            background: var(--teal-light);
            color: var(--teal);
            border: 1.5px solid #5eead4;
        }

        .btn-teal:hover {
            background: #99f6e4;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }

        .btn-full {
            width: 100%;
            justify-content: center;
            padding: 13px;
        }

        .demo-logins {
            margin-top: 20px;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
        }

        .demo-logins h4 {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text3);
            margin-bottom: 10px;
        }

        .demo-login-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            text-align: left;
            background: transparent;
            border: none;
            padding: 6px 4px;
            color: var(--text2);
            font-size: 12px;
            font-family: inherit;
            cursor: pointer;
            transition: color 0.2s;
            border-radius: 6px;
        }

        .demo-login-btn:hover {
            color: var(--text);
            background: var(--border);
        }

        .demo-login-btn span {
            color: var(--text3);
        }

        /* LAYOUT */
        #app {
            display: none;
            min-height: 100vh;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: var(--sidebar-w);
            background: var(--bg2);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .sidebar-header {
            padding: 20px 18px 16px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-logo .s-icon {
            width: 44px;
            height: 44px;
            background: transparent;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
        }

        .sidebar-logo span {
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.2px;
            line-height: 1.2;
        }

        .sidebar-user {
            margin: 12px 12px 0;
            background: linear-gradient(135deg, #eff6ff, #f0f7ff);
            border: 1px solid #bfdbfe;
            border-radius: 10px;
            padding: 12px 14px;
        }

        .sidebar-user .user-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
        }

        .sidebar-user .user-role {
            font-size: 11px;
            color: var(--accent);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-top: 2px;
        }

        .sidebar-nav {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
        }

        .nav-section {
            margin-bottom: 18px;
        }

        .nav-section-title {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text3);
            padding: 0 8px;
            margin-bottom: 4px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 9px 10px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text2);
            font-size: 13px;
            font-weight: 500;
            transition: all 0.15s;
            border: 1.5px solid transparent;
        }

        .nav-item:hover {
            background: var(--bg3);
            color: var(--text);
        }

        .nav-item.active {
            background: var(--accent-light);
            color: var(--accent);
            border-color: #bfdbfe;
            font-weight: 600;
        }

        .nav-item .nav-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .sidebar-footer {
            padding: 12px;
            border-top: 1px solid var(--border);
        }

        .main {
            margin-left: var(--sidebar-w);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            padding: 0 28px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: var(--shadow);
        }

        .topbar-title {
            font-size: 17px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.3px;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }

        .badge-admin {
            background: var(--accent-light);
            color: var(--accent2);
        }

        .badge-form {
            background: var(--green-light);
            color: #059669;
        }

        .badge-view {
            background: var(--blue-light);
            color: #2563eb;
        }

        .badge-report {
            background: var(--purple-light);
            color: #7c3aed;
        }

        .badge-inventory {
            background: var(--teal-light);
            color: #0d9488;
        }

        .page {
            padding: 28px;
            flex: 1;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .page-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.5px;
        }

        .page-subtitle {
            color: var(--text2);
            font-size: 13px;
            margin-top: 3px;
        }

        /* SEARCH BAR */
        .search-filter-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .search-input-wrap {
            position: relative;
            flex: 1;
            min-width: 200px;
        }

        .search-input-wrap svg {
            position: absolute;
            left: 11px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text3);
        }

        .search-input {
            width: 100%;
            background: var(--bg);
            border: 1.5px solid var(--border);
            border-radius: 9px;
            padding: 9px 14px 9px 36px;
            color: var(--text);
            font-size: 13px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        .filter-select {
            background: var(--bg);
            border: 1.5px solid var(--border);
            border-radius: 9px;
            padding: 9px 12px;
            color: var(--text);
            font-size: 13px;
            font-family: inherit;
            outline: none;
            cursor: pointer;
        }

        .filter-select:focus {
            border-color: var(--accent);
        }

        /* CARDS */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .card-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text2);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
            transition: box-shadow 0.2s, transform 0.2s;
        }

        .stat-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .stat-icon {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
        }

        .stat-icon.amber {
            background: var(--accent-light);
        }

        .stat-icon.green {
            background: var(--green-light);
        }

        .stat-icon.blue {
            background: var(--blue-light);
        }

        .stat-icon.purple {
            background: var(--purple-light);
        }

        .stat-icon.red {
            background: var(--red-light);
        }

        .stat-icon.teal {
            background: var(--teal-light);
        }

        .stat-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text2);
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 800;
            color: var(--text);
            margin: 4px 0 3px;
            letter-spacing: -1px;
        }

        .stat-sub {
            font-size: 12px;
            color: var(--text3);
        }

        /* TABLE */
        .table-wrap {
            overflow-x: auto;
            overflow-y: auto;
            max-height: 520px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            color: var(--text3);
            padding: 10px 14px;
            text-align: left;
            border-bottom: 1.5px solid var(--border);
            background: var(--bg3);
            position: sticky;
            top: 0;
            z-index: 2;
        }

        th:first-child {
            border-radius: 8px 0 0 0;
        }

        th:last-child {
            border-radius: 0 8px 0 0;
        }

        td {
            padding: 12px 14px;
            font-size: 13px;
            color: var(--text2);
            border-bottom: 1px solid var(--border);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: var(--bg3);
            color: var(--text);
        }

        .td-primary {
            color: var(--text);
            font-weight: 600;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }

        .status-ok {
            background: var(--green-light);
            color: #059669;
        }

        .status-low {
            background: var(--accent-light);
            color: var(--accent2);
        }

        .status-out {
            background: var(--red-light);
            color: var(--red);
        }

        /* MODALS */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 20, 35, 0.45);
            backdrop-filter: blur(4px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 18px;
            width: 100%;
            max-width: 560px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
        }

        .modal-lg {
            max-width: 800px;
        }

        .modal-header {
            padding: 22px 24px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-title {
            font-size: 17px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.3px;
        }

        .modal-body {
            padding: 20px 24px;
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            background: var(--bg3);
            border-radius: 0 0 18px 18px;
        }

        .close-btn {
            background: var(--bg3);
            border: 1px solid var(--border);
            color: var(--text2);
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            padding: 6px 8px;
            border-radius: 7px;
            transition: all 0.15s;
        }

        .close-btn:hover {
            background: var(--red-light);
            color: var(--red);
            border-color: #fca5a5;
        }

        /* FORM */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .form-row-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 14px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text2);
            text-transform: uppercase;
            letter-spacing: 0.7px;
            margin-bottom: 6px;
        }

        .form-hint {
            font-size: 11px;
            color: var(--text3);
            margin-top: 4px;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 80px;
        }

        /* FORMULATION ITEMS */
        .fi-row {
            display: grid;
            grid-template-columns: 1fr 100px 90px 90px 40px;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }

        .fi-row.no-cost {
            grid-template-columns: 1fr 120px 100px 40px;
        }

        .fi-unit {
            font-size: 11px;
            font-weight: 600;
            color: var(--text2);
            padding: 11px 10px;
            background: var(--bg3);
            border: 1.5px solid var(--border);
            border-radius: 7px;
            white-space: nowrap;
            text-align: center;
        }

        .fi-cost {
            font-size: 12px;
            font-weight: 700;
            color: #059669;
            font-family: 'JetBrains Mono', monospace;
            padding: 11px 6px;
            background: var(--green-light);
            border: 1.5px solid #a7f3d0;
            border-radius: 7px;
            text-align: right;
            min-width: 90px;
        }

        .fi-rate {
            font-size: 12px;
            font-weight: 600;
            color: var(--blue);
            font-family: 'JetBrains Mono', monospace;
            padding: 9px 8px;
            background: var(--blue-light);
            border: 1.5px solid #93c5fd;
            border-radius: 7px;
            text-align: right;
            width: 100%;
            outline: none;
            font-family: inherit;
        }

        .fi-rate:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
        }

        .fi-rate-changed {
            background: #fffbeb;
            border-color: #f59e0b;
            color: #92400e;
        }

        .add-item-btn {
            color: var(--accent2);
            background: var(--accent-light);
            border: 1.5px dashed #fcd34d;
            border-radius: 8px;
            padding: 9px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            width: 100%;
            font-family: inherit;
            transition: all 0.15s;
        }

        .add-item-btn:hover {
            background: #fef08a;
            border-color: var(--accent);
        }

        .remove-btn {
            background: var(--red-light);
            border: 1px solid #fca5a5;

        .machine-list-item {

            align-items: center;
            justify-content: space-between;

            background: var(--bg3);
            border: 1px solid var(--border);

        }

        .machine-list-item .machine-name {

            color: var(--text);

        .machine-list-item .machine-type {

        }

        .prod-report-filters {
            display: flex;
            align-items: center;

            flex-wrap: wrap;
            margin-bottom: 18px;

            background: var(--bg3);

        .prod-chart-wrap {
            background: var(--card);

        }

        .prod-chart-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;

            margin-bottom: 14px;
            display: flex;

            gap: 6px;
        }

        .bar-chart-horiz {
            display: flex;

            gap: 8px;
        }

        .bar-chart-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .bar-chart-label {
            width: 110px;
            font-size: 12px;
            color: var(--text2);
            font-weight: 500;
            flex-shrink: 0;
            text-align: right;
        }

        .bar-chart-track {
            flex: 1;
            height: 20px;
            background: var(--bg3);
            border-radius: 4px;

        .bar-chart-fill {

            transition: width .6s;
        }

        .bar-chart-val {
            width: 60px;
            font-size: 12px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text);
            flex-shrink: 0;
        }

        .modal-xl {
            max-width: 1000px;
        }

        .prod-form-section {
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 14px;
        }

        .prod-form-section-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .8px;
            color: var(--text3);
            margin-bottom: 12px;
        }

        /* Formulation live-search */
        .form-search-wrap {
            position: relative;
        }

        .form-search-wrap input {
            padding-right: 32px;
        }

        .form-search-clear {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text3);
            font-size: 16px;
            line-height: 1;
            display: none;
        }

        .form-search-clear.visible {
            display: block;
        }

        .form-search-dropdown {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: var(--card);
            border: 1.5px solid var(--accent);
            border-radius: 10px;
            box-shadow: var(--shadow-md);
            z-index: 9999;
            max-height: 260px;
            overflow-y: auto;
            display: none;
        }

        .form-search-dropdown.open {
            display: block;
        }

        .form-search-item {
            padding: 10px 14px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            transition: background 0.12s;
        }

        .form-search-item:last-child {
            border-bottom: none;
        }

        .form-search-item:hover,
        .form-search-item.selected {
            background: var(--accent-light);
        }

        .form-search-item-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
        }

        .form-search-item-meta {
            font-size: 11px;
            color: var(--text3);
            margin-top: 2px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .form-search-item-meta span {
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        .form-search-no-results {
            padding: 14px;
            text-align: center;
            color: var(--text3);
            font-size: 13px;
        }

        .form-linked-badge {
            display: none;
            align-items: center;
            gap: 8px;
            background: var(--green-light);
            border: 1px solid #6ee7b7;
            border-radius: 8px;
            padding: 8px 12px;
            margin-top: 8px;
            font-size: 12px;
            font-weight: 600;
            color: var(--green);
        }

        .form-linked-badge.visible {
            display: flex;
        }

        .form-linked-badge .badge-remove {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--green);
            font-size: 14px;
            margin-left: auto;
        }

        /* TOAST */
        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 13px;
            font-weight: 500;
            min-width: 260px;
            box-shadow: var(--shadow-lg);
            animation: slideIn 0.3s ease;
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .toast.success {
            border-left: 4px solid var(--green);
        }

        .toast.error {
            border-left: 4px solid var(--red);
        }

        .toast.info {
            border-left: 4px solid var(--accent);
        }

        @keyframes slideIn {
            from {
                transform: translateX(20px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(18px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.94);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes modalIn {
            from {
                transform: scale(0.92) translateY(16px);
                opacity: 0;
            }

            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        @keyframes overlayIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes pulseGlow {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.18);
            }

            50% {
                box-shadow: 0 0 0 6px rgba(37, 99, 235, 0);
            }
        }

        @keyframes loginDrop {
            from {
                transform: translateY(-28px) scale(0.97);
                opacity: 0;
            }

            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        @keyframes toastSlide {
            from {
                transform: translateX(60px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes toastOut {
            from {
                transform: translateX(0);
                opacity: 1;
                max-height: 60px;
                margin-bottom: 8px;
            }

            to {
                transform: translateX(60px);
                opacity: 0;
                max-height: 0;
                margin-bottom: 0;
            }
        }

        @keyframes rowFadeIn {
            from {
                opacity: 0;
                transform: translateX(-6px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes badgePop {
            0% {
                transform: scale(0.7);
            }

            60% {
                transform: scale(1.12);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes sidebarUserIn {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Login card entrance */
        .login-card {
            animation: loginDrop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        /* Modal entrance */
        .modal {
            animation: modalIn 0.28s cubic-bezier(0.34, 1.2, 0.64, 1) both;
        }

        .modal-overlay {
            animation: overlayIn 0.2s ease both;
        }

        /* Stat cards staggered */
        .stat-card {
            animation: slideUp 0.35s ease both;
        }

        .stat-card:nth-child(1) {
            animation-delay: 0.04s;
        }

        .stat-card:nth-child(2) {
            animation-delay: 0.09s;
        }

        .stat-card:nth-child(3) {
            animation-delay: 0.14s;
        }

        .stat-card:nth-child(4) {
            animation-delay: 0.19s;
        }

        .stat-card:nth-child(5) {
            animation-delay: 0.24s;
        }

        .stat-card:nth-child(6) {
            animation-delay: 0.29s;
        }

        /* KPI cards staggered */
        .prod-kpi {
            animation: slideUp 0.35s ease both;
        }

        .prod-kpi:nth-child(1) {
            animation-delay: 0.04s;
        }

        .prod-kpi:nth-child(2) {
            animation-delay: 0.09s;
        }

        .prod-kpi:nth-child(3) {
            animation-delay: 0.14s;
        }

        .prod-kpi:nth-child(4) {
            animation-delay: 0.19s;
        }

        .prod-kpi:nth-child(5) {
            animation-delay: 0.24s;
        }

        /* Batch cards staggered */
        .batch-card {
            animation: scaleIn 0.28s ease both;
        }

        .batch-card:nth-child(1) {
            animation-delay: 0.03s;
        }

        .batch-card:nth-child(2) {
            animation-delay: 0.07s;
        }

        .batch-card:nth-child(3) {
            animation-delay: 0.11s;
        }

        .batch-card:nth-child(4) {
            animation-delay: 0.15s;
        }

        .batch-card:nth-child(5) {
            animation-delay: 0.19s;
        }

        .batch-card:nth-child(6) {
            animation-delay: 0.23s;
        }

        .batch-card:nth-child(7) {
            animation-delay: 0.27s;
        }

        .batch-card:nth-child(8) {
            animation-delay: 0.31s;
        }

        /* Table rows staggered */
        tbody tr {
            animation: rowFadeIn 0.25s ease both;
        }

        tbody tr:nth-child(1) {
            animation-delay: 0.03s;
        }

        tbody tr:nth-child(2) {
            animation-delay: 0.06s;
        }

        tbody tr:nth-child(3) {
            animation-delay: 0.09s;
        }

        tbody tr:nth-child(4) {
            animation-delay: 0.12s;
        }

        tbody tr:nth-child(5) {
            animation-delay: 0.15s;
        }

        tbody tr:nth-child(6) {
            animation-delay: 0.18s;
        }

        tbody tr:nth-child(7) {
            animation-delay: 0.21s;
        }

        tbody tr:nth-child(8) {
            animation-delay: 0.24s;
        }

        tbody tr:nth-child(9) {
            animation-delay: 0.27s;
        }

        tbody tr:nth-child(10) {
            animation-delay: 0.30s;
        }

        /* Toast updated */
        .toast {
            animation: toastSlide 0.32s cubic-bezier(0.34, 1.3, 0.64, 1) both;
        }

        .toast.removing {
            animation: toastOut 0.28s ease forwards;
        }

        /* Enhanced hover lifts */
        .stat-card {
            transition: box-shadow 0.22s ease, transform 0.22s ease;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }

        .prod-kpi:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }

        .batch-card:hover {
            transform: translateY(-2px) scale(1.005);
        }

        .card {
            transition: box-shadow 0.22s ease, transform 0.22s ease;
        }

        /* Button active press */
        .btn {
            transition: all 0.15s cubic-bezier(0.34, 1.2, 0.64, 1);
        }

        .btn:active {
            transform: scale(0.96) !important;
        }

        .btn-primary:hover {
            transform: translateY(-2px) scale(1.02);
        }

        /* Nav item slide */
        .nav-item {
            transition: all 0.18s cubic-bezier(0.34, 1.1, 0.64, 1);
        }

        .nav-item:hover {
            transform: translateX(3px);
        }

        .nav-item.active {
            transform: translateX(3px);
        }

        /* Sidebar user badge entrance */
        .sidebar-user {
            animation: sidebarUserIn 0.4s ease 0.15s both;
        }

        /* Form controls focus lift */
        .form-control {
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
        }

        .form-control:focus {
            transform: translateY(-1px);
        }

        .search-input {
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
        }

        .search-input:focus {
            transform: translateY(-1px);
        }

        /* Status pill pop */
        .status-pill {
            animation: badgePop 0.3s ease both;
        }

        /* Machine list item hover slide */
        .machine-list-item {
            transition: all 0.18s ease;
        }

        .machine-list-item:hover {
            transform: translateX(4px);
            background: var(--accent-light);
            border-color: #bfdbfe;
        }

        /* Comparison / audit row hover */
        .comparison-row {
            transition: background 0.15s ease, padding-left 0.15s ease;
        }

        .comparison-row:hover {
            background: var(--bg3);
            padding-left: 6px;
        }

        .audit-row {
            transition: background 0.15s ease, padding-left 0.15s ease;
        }

        .audit-row:hover {
            background: var(--bg3);
            padding-left: 8px;
            border-radius: 6px;
        }

        /* Bar chart animated fill */
        .bar-chart-fill {
            transition: width 0.8s cubic-bezier(0.34, 1.1, 0.64, 1);
        }

        .stock-bar-fill {
            transition: width 0.7s cubic-bezier(0.34, 1.1, 0.64, 1);
        }

        .prod-kpi-bar-fill {
            transition: width 0.8s cubic-bezier(0.34, 1.1, 0.64, 1);
        }

        /* Close button rotate on hover */
        .close-btn {
            transition: all 0.18s cubic-bezier(0.34, 1.3, 0.64, 1);
        }

        .close-btn:hover {
            transform: rotate(8deg) scale(1.1);
        }

        /* Saving indicator pulse */
        #saving-indicator {
            animation: pulseGlow 1.6s ease infinite;
        }

        /* Tab active pop */
        .tab {
            transition: all 0.18s ease;
        }

        .tab.active {
            animation: badgePop 0.25s ease both;
        }

        /* RAW MATERIAL SEARCH DROPDOWN */
        .rm-search-wrap {
            position: relative;
        }

        .rm-search-input {
            width: 100%;
            background: var(--bg);
            border: 1.5px solid var(--border);
            border-radius: 7px;
            padding: 10px 36px 10px 10px;
            color: var(--text);
            font-size: 13px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
            cursor: pointer;
        }

        .rm-search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.10);
        }

        .rm-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--bg2);
            border: 1.5px solid var(--accent);
            border-radius: 8px;
            box-shadow: var(--shadow-lg);
            z-index: 1000;
            max-height: 220px;
            overflow-y: auto;
            margin-top: 3px;
            display: none;
        }

        .rm-dropdown.open {
            display: block;
        }

        .rm-dropdown-item {
            padding: 9px 12px;
            font-size: 13px;
            cursor: pointer;
            color: var(--text);
            transition: background 0.1s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .rm-dropdown-item:hover,
        .rm-dropdown-item.highlighted {
            background: var(--accent-light);
            color: var(--accent2);
        }

        .rm-dropdown-item .rm-code {
            font-size: 11px;
            color: var(--text3);
            font-family: 'JetBrains Mono', monospace;
        }

        .rm-dropdown-empty {
            padding: 12px;
            font-size: 12px;
            color: var(--text3);
            text-align: center;
        }

        .batch-card {
            background: var(--card);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 18px;
            margin-bottom: 10px;
            transition: all 0.2s;
            box-shadow: var(--shadow);
        }

        .batch-card:hover {
            border-color: var(--border2);
            box-shadow: var(--shadow-md);
        }

        .batch-card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .batch-card-title {
            font-weight: 700;
            color: var(--text);
            font-size: 15px;
        }

        .batch-card-code {
            font-size: 12px;
            color: var(--text3);
            font-family: 'JetBrains Mono', monospace;
            margin-top: 2px;
        }

        .batch-card-meta {
            display: flex;
            gap: 14px;
            font-size: 12px;
            color: var(--text3);
            flex-wrap: wrap;
        }

        .batch-card-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* AUDIT */
        .audit-row {
            display: flex;
            gap: 14px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }

        .audit-row:last-child {
            border-bottom: none;
        }

        .audit-time {
            font-size: 11px;
            color: var(--text3);
            font-family: 'JetBrains Mono', monospace;
            white-space: nowrap;
            padding-top: 2px;
        }

        .audit-content {
            font-size: 13px;
            color: var(--text2);
        }

        .audit-content strong {
            color: var(--text);
        }

        .audit-tag {
            color: var(--accent2);
            font-size: 11px;
            font-weight: 600;
            background: var(--accent-light);
            padding: 1px 7px;
            border-radius: 20px;
            margin-left: 4px;
        }

        /* REPORT SECTION */
        .report-section {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 22px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }

        .report-card {
            background: var(--card);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 22px;
            box-shadow: var(--shadow);
            transition: all 0.2s;
        }

        .report-card:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--border2);
            transform: translateY(-2px);
        }

        .report-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
            font-size: 22px;
        }


        /* ═══════════════════════════════════════════════════════════════════
   RAW MATERIAL FORECASTING MODULE — styles  v3.6
═══════════════════════════════════════════════════════════════════ */
        .forecast-hero {
            background: linear-gradient(135deg, #0f172a, #1e3a5f);
            border-radius: 16px;
            padding: 22px 28px;
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 14px;
        }

        .forecast-hero-left h2 {
            font-size: 20px;
            font-weight: 800;
            color: #f1f5f9;
            letter-spacing: -0.4px;
        }

        .forecast-hero-left p {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 4px;
        }

        .forecast-hero-right {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .forecast-kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
            gap: 14px;
            margin-bottom: 22px;
        }

        .forecast-kpi {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 18px;
            box-shadow: var(--shadow);
            transition: all 0.2s;
        }

        .forecast-kpi:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .forecast-kpi-icon {
            width: 38px;
            height: 38px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }

        .forecast-kpi-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .7px;
            color: var(--text3);
        }

        .forecast-kpi-value {
            font-size: 26px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -1px;
            margin: 3px 0 2px;
        }

        .forecast-kpi-sub {
            font-size: 11px;
            color: var(--text3);
        }

        .forecast-input-card {
            background: var(--card);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .forecast-input-card .card-title {
            margin-bottom: 18px;
        }

        .forecast-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 100px;
            gap: 14px;
            align-items: end;
        }

        @media(max-width:900px) {
            .forecast-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media(max-width:600px) {
            .forecast-grid {
                grid-template-columns: 1fr;
            }
        }

        .forecast-loaded-badge {
            display: none;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #f0fdf4, #dcfce7);
            border: 1.5px solid #6ee7b7;
            border-radius: 10px;
            padding: 12px 16px;
            margin-top: 14px;
        }

        .forecast-loaded-badge.visible {
            display: flex;
        }

        .forecast-loaded-badge .flb-name {
            font-size: 14px;
            font-weight: 700;
            color: #065f46;
        }

        .forecast-loaded-badge .flb-meta {
            font-size: 12px;
            color: #047857;
            margin-top: 2px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .forecast-loaded-badge .flb-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .forecast-results {
            display: none;
        }

        .forecast-results.visible {
            display: block;
        }

        .forecast-table-wrap {
            overflow-x: auto;
            overflow-y: auto;
            max-height: 520px;
            border-radius: var(--radius-lg);
        }

        .forecast-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .forecast-table th {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #94a3b8;
            padding: 10px 14px;
            text-align: left;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .7px;
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 2;
        }

        .forecast-table th:first-child {
            border-radius: 10px 0 0 0;
        }

        .forecast-table th:last-child {
            border-radius: 0 10px 0 0;
        }

        .forecast-table td {
            padding: 11px 14px;
            border-bottom: 1px solid var(--border);
            color: var(--text2);
            vertical-align: middle;
        }

        .forecast-table tr:last-child td {
            border-bottom: none;
        }

        .forecast-table tr:hover td {
            background: var(--bg3);
        }

        .forecast-table .td-rm {
            font-weight: 600;
            color: var(--text);
        }

        .forecast-table .td-rm-code {
            font-size: 10px;
            color: var(--text3);
            font-family: 'JetBrains Mono', monospace;
            margin-top: 2px;
        }

        .forecast-table .td-num {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            text-align: right;
        }

        .forecast-table .td-short {
            color: var(--red);
            font-weight: 800;
            font-family: 'JetBrains Mono', monospace;
            text-align: right;
        }

        .forecast-table .td-excess {
            color: var(--green);
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            text-align: right;
        }

        .forecast-table .td-zero {
            color: var(--text3);
            font-family: 'JetBrains Mono', monospace;
            text-align: right;
        }

        .forecast-status-ok {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: var(--green-light);
            color: #065f46;
            border: 1px solid #6ee7b7;
            border-radius: 20px;
            padding: 3px 10px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }

        .forecast-status-short {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: var(--red-light);
            color: var(--red);
            border: 1px solid #fca5a5;
            border-radius: 20px;
            padding: 3px 10px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
            animation: pulseRed 2s ease infinite;
        }

        @keyframes pulseRed {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.18);
            }

            50% {
                box-shadow: 0 0 0 5px rgba(220, 38, 38, 0);
            }
        }

        .forecast-short-row td {
            background: #fff8f8 !important;
        }

        .forecast-summary-bar {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            border-radius: 10px;
            padding: 14px 18px;
            margin-top: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
        }

        .forecast-summary-bar .fsb-item {
            text-align: center;
        }

        .forecast-summary-bar .fsb-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .7px;
            color: #94a3b8;
        }

        .forecast-summary-bar .fsb-value {
            font-size: 16px;
            font-weight: 800;
            color: #f1f5f9;
            font-family: 'JetBrains Mono', monospace;
            margin-top: 2px;
        }

        .forecast-summary-bar .fsb-value.red {
            color: #f87171;
        }

        .forecast-summary-bar .fsb-value.green {
            color: #34d399;
        }

        .forecast-empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--text3);
        }

        .forecast-empty svg {
            opacity: .4;
            margin-bottom: 14px;
        }

        .forecast-empty h3 {
            font-size: 15px;
            font-weight: 700;
            color: var(--text2);
            margin-bottom: 6px;
        }

        .forecast-empty p {
            font-size: 13px;
        }

        .forecast-ref-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--blue-light);
            border: 1px solid #93c5fd;
            border-radius: 20px;
            padding: 3px 12px;
            font-size: 12px;
            font-weight: 600;
            color: var(--blue);
            margin-left: 10px;
        }

        /* KITTING TABLE */
        .kitting-shortage {
            color: var(--red);
            font-weight: 700;
        }

        .kitting-ok {
            color: var(--green);
            font-weight: 700;
        }

        /* BULK UPLOAD */
        .upload-zone {
            border: 2px dashed var(--border2);
            border-radius: 12px;
            padding: 28px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--bg3);
        }

        .upload-zone:hover {
            border-color: var(--accent);
            background: var(--accent-light);
        }

        .upload-zone input {
            display: none;
        }

        /* SPINNER */
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px;
            gap: 14px;
            color: var(--text2);
        }

        /* GAS SETUP BANNER */
        .setup-banner {
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            border: 1.5px solid #fcd34d;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .setup-banner .sb-icon {
            font-size: 24px;
        }

        .setup-banner h3 {
            font-size: 14px;
            font-weight: 700;
            color: #92400e;
        }

        .setup-banner p {
            font-size: 12px;
            color: #a16207;
            margin-top: 2px;
        }

        /* LOT MULTIPLIER */
        .lot-box {
            background: linear-gradient(135deg, var(--blue-light), #eff6ff);
            border: 1.5px solid #93c5fd;
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .lot-box label {
            font-size: 13px;
            font-weight: 700;
            color: #1e40af;
            white-space: nowrap;
        }

        .lot-input {
            width: 80px;
            background: #fff;
            border: 1.5px solid #93c5fd;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 14px;
            font-weight: 700;
            color: #1e40af;
            outline: none;
            text-align: center;
        }

        @media(max-width:768px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .main {
                margin-left: 0;
            }

            .form-row,
            .form-row-3 {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* RIPPLE EFFECT */
        .btn {
            position: relative;
            overflow: hidden;
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            animation: rippleAnim 0.55s ease-out;
            background: rgba(255, 255, 255, 0.35);
            pointer-events: none;
        }

        .btn-secondary .ripple,
        .btn-danger .ripple,
        .btn-success .ripple,
        .btn-blue .ripple,
        .btn-teal .ripple {
            background: rgba(37, 99, 235, 0.15);
        }

        @keyframes rippleAnim {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* SKELETON SHIMMER */
        .skeleton {
            background: linear-gradient(90deg, var(--bg3) 25%, var(--border) 50%, var(--bg3) 75%);
            background-size: 200% 100%;
            animation: skeletonShimmer 1.4s ease infinite;
            border-radius: 6px;
        }

        @keyframes skeletonShimmer {
            0% {
                background-position: 200% center;
            }

            100% {
                background-position: -200% center;
            }
        }

        /* FLOATING LABEL on focus */
        .form-group:focus-within label {
            color: var(--accent);
            transition: color 0.2s ease;
        }

        .form-group:focus-within label svg {
            stroke: var(--accent);
        }

        /* ═══════════════════════════════════════════════════════
   FORMULATION SAVE OVERLAY  v3.4
═══════════════════════════════════════════════════════ */
        #save-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(10, 15, 30, 0.72);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        #save-overlay.visible {
            display: flex;
            animation: sovIn 0.22s ease both;
        }

        #save-overlay.dismissing {
            animation: sovOut 0.38s ease forwards;
        }

        @keyframes sovIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes sovOut {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }

        .sov-card {
            background: #ffffff;
            border-radius: 22px;
            padding: 40px 44px 36px;
            width: 320px;
            text-align: center;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.22), 0 4px 16px rgba(37, 99, 235, 0.12);
            position: relative;
            overflow: hidden;
        }

        @keyframes sovCardIn {
            from {
                transform: scale(0.88) translateY(18px);
                opacity: 0;
            }

            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        @keyframes sovBounce {
            0% {
                transform: scale(1);
            }

            40% {
                transform: scale(1.04);
            }

            100% {
                transform: scale(1);
            }
        }

        .sov-card.entering {
            animation: sovCardIn 0.32s cubic-bezier(0.34, 1.4, 0.64, 1) both;
        }

        .sov-card.success-bounce {
            animation: sovBounce 0.45s cubic-bezier(0.34, 1.5, 0.64, 1) both;
        }

        .sov-shimmer {
            position: absolute;
            top: 0;
            left: -60%;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(37, 99, 235, 0.07), transparent);
            pointer-events: none;
        }

        @keyframes sovShimmer {
            0% {
                left: -60%;
            }

            100% {
                left: 110%;
            }
        }

        .sov-shimmer.active {
            animation: sovShimmer 1.6s ease-in-out infinite;
        }

        .sov-ring {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: background 0.3s;
        }

        .sov-ring-saving {
            background: linear-gradient(135deg, #eff6ff, #dbeafe);
        }

        .sov-ring-success {
            background: linear-gradient(135deg, #f0fdf4, #dcfce7);
        }

        .sov-ring-error {
            background: linear-gradient(135deg, #fef2f2, #fee2e2);
        }

        .sov-arc {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #2563eb;
            border-right-color: #93c5fd;
        }

        @keyframes sovSpin {
            to {
                transform: rotate(360deg);
            }
        }

        .sov-arc.spinning {
            animation: sovSpin 0.9s linear infinite;
        }

        .sov-arc.done {
            display: none;
        }

        @keyframes sovCheck {
            0% {
                stroke-dashoffset: 40;
            }

            100% {
                stroke-dashoffset: 0;
            }
        }

        .sov-check {
            stroke-dasharray: 40;
            stroke-dashoffset: 40;
        }

        .sov-check.draw {
            animation: sovCheck 0.42s cubic-bezier(0.4, 0, 0.2, 1) 0.05s forwards;
        }

        .sov-steps {
            text-align: left;
            margin: 18px 0 0;
            list-style: none;
            padding: 0;
        }

        .sov-step {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 0;
            font-size: 13px;
            color: #6b7280;
            font-weight: 500;
            border-bottom: 1px solid #f3f4f6;
            transition: color 0.25s;
        }

        .sov-step:last-child {
            border-bottom: none;
        }

        .sov-step-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f4f6;
            transition: background 0.25s, transform 0.25s;
        }

        .sov-step.active .sov-step-icon {
            background: #dbeafe;
            transform: scale(1.12);
        }

        .sov-step.done .sov-step-icon {
            background: #dcfce7;
        }

        .sov-step.active {
            color: #1d4ed8;
        }

        .sov-step.done {
            color: #15803d;
        }

        .sov-bar-track {
            height: 4px;
            background: #f3f4f6;
            border-radius: 4px;
            margin: 18px 0 0;
            overflow: hidden;
        }

        .sov-bar-fill {
            height: 100%;
            border-radius: 4px;
            width: 0%;
            background: linear-gradient(90deg, #2563eb, #60a5fa);
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sov-head {
            font-size: 17px;
            font-weight: 800;
            color: #111827;
            margin: 0 0 4px;
            letter-spacing: -0.3px;
        }

        .sov-sub {
            font-size: 13px;
            color: #6b7280;
            margin: 0;
        }

        .sov-pill {
            display: inline-block;
            margin-top: 14px;
            background: #f0fdf4;
            border: 1.5px solid #86efac;
            color: #15803d;
            border-radius: 20px;
            padding: 5px 14px;
            font-size: 13px;
            font-weight: 700;
            transform: scale(0.8);
            opacity: 0;
            transition: transform 0.35s cubic-bezier(0.34, 1.5, 0.64, 1), opacity 0.25s;
        }

        .sov-pill.pop {
            transform: scale(1);
            opacity: 1;
        }
    </style>
</head>

        // ════════════════════════════════════════════════════════

        // ════════════════════════════════════════════════════════
        function gasCall(action, payload = {}) {
            if (!GAS_URL) return Promise.resolve(null);
            const body = JSON.stringify({ action, token: authToken, ...payload });
            // Use GET for read-only loadAll (safe, cacheable), POST for all writes.
            // POST avoids the ~2 KB URL limit that silently truncates large payloads on GET.
            const isRead = (action === 'loadAll');
            const fetchOpts = isRead
                ? { method: 'GET', redirect: 'follow' }
                : { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain' }, body };
            const url = isRead
                ? GAS_URL + '?data=' + encodeURIComponent(body)
                : GAS_URL;
            return fetch(url, fetchOpts)
                .then(r => {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                })
                .then(data => {
                    if (data && data.success === false) {
                        console.error('GAS returned error for action "' + action + '":', data.error);
                        throw new Error(data.error || 'Server error');
                    }
                    return data;
                })
                .catch(e => {
                    console.error('GAS error [' + action + ']:', e);
                    throw e; // re-throw so callers can .catch and show UI error
                });
        }

        async function loadFromGAS() {
            if (!GAS_URL) return;

                const result = await gasCall('loadAll');
                if (result && result.success && result.data) {

                        category: r.category || '',  // v3.7: ensure category always present even on older sheets

                    }));

                    if (d.formulations) DB.formulations = d.formulations.map(f => ({
                        ...f,
                        productName: f.productName || 'Unnamed',
                        productCode: f.productCode || '',
                        productType: f.productType || '',
                        productFinish: f.productFinish || '',
                        batchNo: f.batchNo || '',
                        // mfgDate/createdAt/debitDate now normalized in the main loadAll mapper
                        byName: f.byName || f.by || '',
                        remarks: f.remarks || '',
                        refNo: f.refNo || '',
                        partyId: f.partyId || '',
                        partyName: f.partyName || '',
                        lots: Number(f.lots) || 1,
                        // v3.3-FIX4: inverted check — blank cell must default to false (not debited), not true
                        inventoryDebited: f.inventoryDebited === true || f.inventoryDebited === 'true' || f.inventoryDebited === 'TRUE' ? true : false,
                        inventoryPartialDebit: f.inventoryPartialDebit === true || f.inventoryPartialDebit === 'true' ? true : false,
                        skippedDebitRmIds: Array.isArray(f.skippedDebitRmIds) ? f.skippedDebitRmIds.map(Number) : [],
                        debitLots: Number(f.debitLots) || 0,
                        debitDate: f.debitDate || '',
                        debitRemarks: f.debitRemarks || '',
                        // v3.5 FIX-DATE: normalize all dates before storing in DB
                        mfgDate: normalizeDate(f.mfgDate) || '',
                        createdAt: normalizeDate(f.createdAt) || '',
                        debitDate: normalizeDate(f.debitDate) || '',
                        items: Array.isArray(f.items) ? f.items.map(i => ({ rmId: Number(i.rmId), qty: Number(i.qty) || 0, unit: i.unit || 'KG', rate: (i.rate !== undefined && i.rate !== '' && i.rate !== null) ? Number(i.rate) : undefined })).filter(i => i.rmId && i.qty > 0) : [],
                    }));
                    // ── v2.3: Patch item rates from basePrices if available ──────────────
                    if (d.basePrices && Array.isArray(d.basePrices) && d.basePrices.length > 0) {
                        DB.formulations.forEach(function (f) {
                            f.items.forEach(function (item) {
                                if (item.rate === undefined || item.rate === null) {
                                    const bp = d.basePrices.find(b => b.formulationId === f.id && b.rmId === item.rmId);
                                    if (bp) item.rate = bp.enteredRate;
                                }
                            });
                        });
                    }
                    if (d.stockTransactions) DB.stockTransactions = d.stockTransactions;
                    if (d.auditLog) DB.auditLog = d.auditLog;
                    if (d.packagingCost !== undefined) DB.packagingCost = Number(d.packagingCost) || 26;
                    if (d.settings) DB.settings = Object.assign({ debitInventoryOnSave: true }, d.settings);
                    if (d.nextId) DB.nextId = d.nextId;
                    DB.nextId.comment = DB.nextId.comment || 1;
                    // ── FIX: always recompute formulation nextId from actual max id in sheet
                    // This prevents ID collisions where new formulations overwrite row 2
                    if (d.formulations && Array.isArray(d.formulations) && d.formulations.length) {
                        const maxFormId = d.formulations.reduce((mx, f) => Math.max(mx, Number(f.id) || 0), 0);
                        if (maxFormId >= DB.nextId.formulation) DB.nextId.formulation = maxFormId + 1;
                    }
                    DB.formulationComments = DB.formulationComments || [];
                    if (d.formulationComments && Array.isArray(d.formulationComments)) DB.formulationComments = d.formulationComments;
                    if (d.basePrices && Array.isArray(d.basePrices)) DB.basePrices = d.basePrices;
                    if (d.machines && Array.isArray(d.machines) && d.machines.length) DB.machines = d.machines.map(m => ({ ...m, id: Number(m.id), hourlyMachineCost: Number(m.hourlyMachineCost) || 0, stdKgHr: Number(m.stdKgHr) || 0, active: m.active !== false && m.active !== "false" }));
                    if (d.productionLogs && Array.isArray(d.productionLogs)) {
                        DB.productionLogs = d.productionLogs.map(l => ({
                            ...l,
                            id: Number(l.id),
                            machineId: Number(l.machineId),
                            breakMins: Number(l.breakMins) || 0,
                            rmInput: Number(l.rmInput) || 0,
                            fgOutput: Number(l.fgOutput) || 0,
                            formulationId: l.formulationId ? Number(l.formulationId) : null,
                            startTime: normalizeGASTime(l.startTime),
                            endTime: normalizeGASTime(l.endTime),
                        }));
                        DB.nextId_prodlog = DB.productionLogs.reduce((mx, l) => Math.max(mx, l.id), 0) + 1;
                    }
                    if (d.labourRate !== undefined) DB.labourRate = Number(d.labourRate) || 60;
                    // v3.6b: ForecastInput rows arrive with loadAll — no separate action needed
                    if (d.forecastInputRows && Array.isArray(d.forecastInputRows))
                        DB.forecastInputRows = d.forecastInputRows.map(r => ({
                            ...r,
                            orderDate: normalizeDate(r.orderDate) || '',
                            createdAt: normalizeDate(r.createdAt) || ''
                        }));
                    if (d.partyLookup && Array.isArray(d.partyLookup)) DB.partyLookup = d.partyLookup;

                    // v3.9-FIX: Retroactively enrich formulations that have a refNo but
                    // blank partyId / partyName (happens for all Sudhir Ji recipes saved
                    // before v3.8 introduced the Sheet2 lookup, or when Sheet2 wasn't ready
                    // yet at save time).  We do this client-side immediately after partyLookup
                    // lands so the UI shows correct data, and then fire a silent GAS patch to
                    // persist the resolved values back into the Formulations sheet.
                    if (DB.partyLookup && DB.partyLookup.length) {
                        const _patchQueue = [];
                        DB.formulations.forEach(f => {
                            if (!f.refNo) return;                        // no refNo — nothing to look up
                            if (f.partyId || f.partyName) return;       // already has party data — skip
                            const _match = DB.partyLookup.find(p =>
                                String(p.refNo || '').trim().toLowerCase() === f.refNo.trim().toLowerCase()
                            );
                            if (_match) {
                                f.partyId = String(_match.partyId || '').trim();
                                f.partyName = String(_match.partyName || '').trim();
                                if (f.id) _patchQueue.push({ id: f.id, partyId: f.partyId, partyName: f.partyName });
                            }
                        });
                        // Silently write the resolved values back to the Formulations sheet
                        // so next load already has them (one batched call, non-blocking).
                        if (_patchQueue.length) {
                            gasCall('patchFormulationParties', { patches: _patchQueue })
                                .catch(() => { }); // best-effort — ignore errors
                        }
                    }

                    _biCache = null; _biCacheKey = ''; // clear BI cache on data reload
                    toast('Data loaded from database ✓', 'success');
                } else {
                    toast('Could not load from database — using cached local data', 'info');
                }
            } catch (e) { toast('Database connection error — using cached local data', 'info'); }
            hideSaving();
        }
