        function fillLogin(u, p) { document.getElementById('login-user').value = u; document.getElementById('login-pass').value = p; }
        async function doLogin() {
            const u = document.getElementById('login-user').value.trim();
            const p = document.getElementById('login-pass').value.trim();
            if (!u || !p) {
                document.getElementById('login-error').innerHTML = 'Please enter username and password.';
                document.getElementById('login-error').style.display = 'flex';
                return;
            }
            const btn = document.querySelector('#login-screen .btn-primary');
            btn.innerHTML = '<div class="spinner" style="width:16px;height:16px;border-color:#fff3;border-top-color:#fff"></div> Signing in...';
            btn.disabled = true;

            if (GAS_URL) {
                try {
                    const result = await gasCall('login', { username: u, password: p });
                    if (result && result.success) {
                        authToken = result.token;
                        currentUser = result.user;
                        localStorage.setItem('surface_paint_token', authToken);
                        localStorage.setItem('surface_paint_user', JSON.stringify(currentUser));
                        document.getElementById('login-error').style.display = 'none';
                        await loadFromGAS();
                        initApp();
                    } else {
                        throw new Error(result ? result.error : 'Invalid credentials. Please try again.');
                    }
                } catch (err) {
                    document.getElementById('login-error').innerHTML = err.message || 'Login failed. Please try again.';
                    document.getElementById('login-error').style.display = 'flex';
                    btn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg> Sign In';
                    btn.disabled = false;
                    return;
                }
            } else {
                // Demo mode local check
                await loadFromGAS();
                const user = DB.users.find(x => x.username === u && x.password === p);
                if (!user) {
                    document.getElementById('login-error').innerHTML = 'Invalid credentials. Please try again.';
                    document.getElementById('login-error').style.display = 'flex';
                    btn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg> Sign In';
                    btn.disabled = false;
                    return;
                }
                document.getElementById('login-error').style.display = 'none';
                currentUser = user;
                initApp();
            }
        }

            currentPage = page;

            const ni = document.getElementById('nav-' + page);
            if (ni) ni.classList.add('active');
            const titles = { dashboard: 'Dashboard', formulations: 'Formulations', costing: 'Costing Engine', costanalysis: 'Cost Analysis', rawmaterials: 'Raw Materials', inventory: 'Inventory', reports: 'Reports & Export', users: 'User Management', settings: 'System Settings', kitting: 'Full Kitting', debitstatus: 'Inventory Debit Status', production: 'Production Entry', prodreports: 'Production Reports & Analytics', machines: 'Machine Setup', shiftmaster: 'Shift Master', forecasting: 'Raw Material Forecasting' };
            document.getElementById('page-heading').textContent = titles[page] || page;
            const content = document.getElementById('page-content');
            content.style.cssText = 'opacity:0;transform:translateY(12px);transition:none;';
            content.innerHTML = `<div class="loading-page"><div class="spinner"></div><span>Loading...</span></div>`;
            const _heavyPages = ['analytics', 'prodreports', 'reports', 'kitting', 'costanalysis', 'forecasting'];
            const _delay = _heavyPages.includes(page) ? 150 : 40;
            setTimeout(() => {
                renderPage(page, content);
                requestAnimationFrame(() => requestAnimationFrame(() => {

        // ════════════════════════════════════════════════════════
        //  HELPERS
        // ════════════════════════════════════════════════════════
        function getRMById(id) { return DB.rawMaterials.find(r => r.id === id); }
        function getInvByRMId(id) { return DB.inventory.find(i => i.rmId === id) || { quantity: 0 }; }
        function getStockStatus(rm) {
            const inv = getInvByRMId(rm.id);
            if (inv.quantity <= 0) return 'out';
            if (inv.quantity < rm.minStock) return 'low';
            return 'ok';
        }
        function calcBatchCost(f) {
            let rmCost = 0;
            (f.items || []).forEach(item => {
                const rm = getRMById(item.rmId); if (!rm) return;
                // Use per-item saved rate if available, else use current RM rate
                const rate = item.rate !== undefined && item.rate !== null ? item.rate : (rm.rate || 0);
                // Convert G/ML to KG before multiplying (rate is always per KG equivalent)
                const u = (item.unit || rm.unit || 'KG').toUpperCase();
                const qtyKg = (u === 'G' || u === 'ML') ? item.qty / 1000 : item.qty;
                rmCost += qtyKg * rate;
            });
            const totalQty = calcTotalQty(f);
            const packagingPerKg = DB.packagingCost || 0;
            const totalPackaging = packagingPerKg * totalQty;
            return { rmCost, packaging: totalPackaging, packagingPerKg, total: rmCost + totalPackaging };
        }
        // Returns total in KG-equivalent (G and ML items are divided by 1000)
        function calcTotalQty(f) {
            return (f.items || []).reduce((s, i) => {
                const u = (i.unit || 'KG').toUpperCase();
                const qty = i.qty || 0;
                if (u === 'G' || u === 'ML') return s + (qty / 1000);
                return s + qty;
            }, 0);
        }
        // Returns unified KG total string — grams and ML converted to KG
        function calcTotalQtyDisplay(f) {
            const totalKg = calcTotalQty(f);
            return totalKg.toFixed(3) + ' KG';
        }

        function nowDateTime() {
            const now = new Date();
            const pad = n => String(n).padStart(2, '0');
            // v3.5 FIX-DATE: include seconds → YYYY-MM-DD HH:MM:SS
            return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
        }

        // v3.5 FIX-DATE: Normalize any incoming date value from GAS to YYYY-MM-DD HH:MM:SS.
        // Handles: Excel/Sheets serial floats (46098.49…), locale strings
        // ("Tue Mar 17 2026 11:45:00 GMT+0530…"), partial ISO ("2026-03-17 14:12"),
        // and Indian/European formats with / or - separators ("06-01-2026", "24/04/2026").
        function normalizeDate(val) {
            if (val === null || val === undefined || val === '') return '';
            const s = String(val).trim();
            if (!s) return '';
            // Excel/Sheets serial number (float 40000–60000 = years 2009–2064)
            const num = Number(s);
            if (!isNaN(num) && num > 40000 && num < 60000) {
                const msPerDay = 86400000;
                const epoch = new Date(Date.UTC(1899, 11, 30)); // Excel epoch 1899-12-30
                const d = new Date(epoch.getTime() + num * msPerDay);
                // Adjust to IST (+5:30 = +19800 seconds)
                const ist = new Date(d.getTime() + 19800000);
                const pad = n => String(n).padStart(2, '0');
                return `${ist.getUTCFullYear()}-${pad(ist.getUTCMonth() + 1)}-${pad(ist.getUTCDate())} ${pad(ist.getUTCHours())}:${pad(ist.getUTCMinutes())}:${pad(ist.getUTCSeconds())}`;
            }
            // Indian / European text: DD/MM/YYYY or DD-MM-YYYY (with optional HH:MM or HH:MM:SS)
            // new Date("06-01-2026") → Invalid Date in most browsers, so parse manually.
            const indM = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})(?:[T\s]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
            if (indM) {
                const dd = Number(indM[1]), mm = Number(indM[2]), yyyy = Number(indM[3]);
                const hh = Number(indM[4] || 0), mn = Number(indM[5] || 0), ss = Number(indM[6] || 0);
                if (mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31) {
                    const pad = n => String(n).padStart(2, '0');
                    const rebuilt = new Date(yyyy, mm - 1, dd, hh, mn, ss);
                    if (!isNaN(rebuilt.getTime()))
                        return `${yyyy}-${pad(mm)}-${pad(dd)} ${pad(hh)}:${pad(mn)}:${pad(ss)}`;
                }
            }
            // Try parsing as any string date (locale string, ISO variant, etc.)
            const parsed = new Date(s);
            if (!isNaN(parsed.getTime())) {
                const pad = n => String(n).padStart(2, '0');
                return `${parsed.getFullYear()}-${pad(parsed.getMonth() + 1)}-${pad(parsed.getDate())} ${pad(parsed.getHours())}:${pad(parsed.getMinutes())}:${pad(parsed.getSeconds())}`;
            }
            return s; // unknown format — return as-is rather than corrupt
        }
        function nowDate() { return nowDateTime().slice(0, 10); }

        function toast(msg, type = 'info') {
            const icons = { success: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>', error: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>', info: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>', warning: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>' };
            const t = document.createElement('div');
            t.className = 'toast ' + type;
            t.style.color = type === 'success' ? 'var(--green)' : type === 'error' ? 'var(--red)' : type === 'warning' ? 'var(--orange)' : 'var(--accent2)';
            t.innerHTML = (icons[type] || '') + msg;
            document.getElementById('toast-container').appendChild(t);
            setTimeout(() => {
                t.classList.add('removing');
                setTimeout(() => t.remove(), 280);
            }, 3200);
        }
        function fmtCurrency(n) { return '₹' + Number(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
        function addAudit(action, detail) {
            DB.auditLog.unshift({ time: nowDateTime(), user: currentUser.name, action, detail });

        function _fmLoadMore() {
            if (!window._fmAllForms) return;

            if (!next.length) return;
            const list = document.getElementById('formulations-list');

            if (sentinel) sentinel.remove();
            let xhtml = '';
            next.forEach(f => { xhtml += buildFormCardHTML(f); });

                s.id = 'fm-loadmore'; s.style.cssText = 'padding:20px;text-align:center;';

        function _fmLoadAllRemaining() {

            if (window._fmLoaded >= window._fmAllForms.length) return;
            const list = document.getElementById('formulations-list');
            const sentinel = document.getElementById('fm-loadmore');
            if (sentinel) sentinel.remove();
            const rest = window._fmAllForms.slice(window._fmLoaded);
            let xhtml = '';
            rest.forEach(f => { xhtml += buildFormCardHTML(f); });
            if (list) list.insertAdjacentHTML('beforeend', xhtml);
            window._fmLoaded = window._fmAllForms.length;
        }

        function filterFormulations() {

            // formulations are on the page first — otherwise matches that live

            if ((q || dateFilter) && window._fmAllForms && window._fmLoaded < window._fmAllForms.length) {

            }

            const today = nowDate();
            const weekStart = new Date(); weekStart.setDate(weekStart.getDate() - 7);

                const batch = card.dataset.batch || '';
                const date = card.dataset.date || '';
                const remarks = card.dataset.remarks || '';
                const by = card.dataset.by || '';
                let show = (!q || [name, code, batch, remarks, by].join(' ').includes(q));
                if (show && dateFilter) {
                    const d = new Date(date.slice(0, 10));
                    if (dateFilter === 'today') show = date.startsWith(today);
                    else if (dateFilter === 'week') show = d >= weekStart;
                    else if (dateFilter === 'month') show = d >= monthStart;
                }
                card.style.display = show ? '' : 'none';
            });
        }

        function saveLabGloss(id) {
            const f = DB.formulations.find(x => x.id === id);

            const L = parseFloat(document.getElementById('lab-L').value) || null;
            const A = parseFloat(document.getElementById('lab-A').value) || null;
            const B = parseFloat(document.getElementById('lab-B').value) || null;

            const angle = document.getElementById('lab-angle').value;
            const notes = document.getElementById('lab-notes').value.trim();
            if (L !== null || A !== null || B !== null) f.labValues = { L, A, B, recordedAt: nowDateTime(), recordedBy: currentUser.name };
            if (gloss !== null) { f.glossValue = gloss; f.glossAngle = angle; }
            f.labNotes = notes;
            addAudit('Saved LAB/Gloss values', `${f.productCode || f.productName} — L:${L} a:${A} b:${B} Gloss:${gloss}`);

        // ════════════════════════════════════════════════════════

        function exportWorkerPDF(id) {

            const totalAllKg = totalKg + (totalG / 1000);
            const totalLabel = `${totalAllKg.toFixed(3)} KG`;

            const refPartyRow = (f.refNo || f.partyId || f.partyName) ? `
    <div class="ref-bar">

    </div>`: '';

            const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Worker Recipe — ${f.productName}</title>
<style>

            const blob = new Blob([html], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const old = document.getElementById('pdf-overlay'); if (old) old.remove();
            const overlay = document.createElement('div');
            overlay.id = 'pdf-overlay';
            overlay.style.cssText = 'position:fixed;inset:0;background:#1a1a1a;z-index:9999;display:flex;flex-direction:column;';
            const toolbar = document.createElement('div');
            toolbar.style.cssText = 'background:#111827;padding:12px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #374151;flex-shrink:0;';
            toolbar.innerHTML = `
    <span style="color:#10b981;font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:700;">👷 Worker Recipe — ${f.productName}</span>

    <button onclick="document.getElementById('pdf-overlay').remove();URL.revokeObjectURL('${url}')" style="background:#374151;color:#fff;border:1px solid #4b5563;padding:9px 16px;font-size:13px;cursor:pointer;border-radius:8px;">✕ Close</button>`;

        // ════════════════════════════════════════════════════════
        //  SUDHIR JI — Debit Inventory (separate from PDF)
        // ════════════════════════════════════════════════════════
        function openSudhirDebitModal(id) {
            const f = DB.formulations.find(x => x.id === id);
            if (!f) return;

            // Already fully debited
            if (f.inventoryDebited === true || f.inventoryDebited === 'true') {
                // Build skipped list for display
                const skipped = (f.skippedDebitRmIds || []).map(rid => { const rm = getRMById(rid); return rm ? rm.name : '#' + rid; });
                const modal = `<div class="modal-overlay" id="sudhir-debit-modal" onclick="if(event.target.id==='sudhir-debit-modal')closeModal('sudhir-debit-modal')">
    <div class="modal">
      <div class="modal-header">
        <div><div class="modal-title">📦 Inventory Debit Status</div></div>
        <button class="close-btn" onclick="closeModal('sudhir-debit-modal')">✕</button>
      </div>
      <div class="modal-body">
        <div class="alert" style="background:#f0fdf4;border:1.5px solid #6ee7b7;color:#065f46;font-size:13px;border-radius:10px;padding:14px 16px;margin-bottom:12px;">
          <strong>✅ Inventory already debited</strong> for this formulation (${f.debitLots || 1} lot${(f.debitLots || 1) > 1 ? 's' : ''} on ${f.debitDate || f.mfgDate}).
        </div>
        ${skipped.length ? `<div class="alert" style="background:var(--orange-light);border:1.5px solid #fdba74;color:#9a3412;font-size:12px;border-radius:10px;padding:12px 14px;">
          <strong>⚠️ These materials were NOT debited</strong> (zero/insufficient stock at time of debit):<br>
          <span style="margin-top:6px;display:block;font-weight:700;">${skipped.join(', ')}</span>
          <span style="margin-top:4px;display:block;font-size:11px;">Recipe was saved, but these materials had zero inventory so their stock was not reduced.</span>
        </div>`: ''}
        ${f.debitRemarks ? `<div style="margin-top:12px;font-size:12px;color:var(--text2);background:var(--bg3);border-radius:8px;padding:10px 14px;">💬 Remark: ${f.debitRemarks}</div>` : ''}
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('sudhir-debit-modal')">Close</button>
        <button class="btn btn-primary btn-sm" onclick="closeModal('sudhir-debit-modal');openSudhirPDFModal(${id})">📋 Print PDF</button>
      </div>
    </div></div>`;
                document.body.insertAdjacentHTML('beforeend', modal);
                return;
            }

            // Partial debit — some items were skipped last time
            const partialSkipped = (f.skippedDebitRmIds || []).map(rid => { const rm = getRMById(rid); return rm ? rm.name : '#' + rid; });

            const modal = `<div class="modal-overlay" id="sudhir-debit-modal" onclick="if(event.target.id==='sudhir-debit-modal')closeModal('sudhir-debit-modal')">
  <div class="modal modal-lg">
    <div class="modal-header">
      <div>
        <div class="modal-title">📦 Debit Inventory</div>
        <div style="font-size:12px;color:var(--text3);margin-top:2px;">${f.productName}${f.batchNo ? ' — Batch: ' + f.batchNo : ''}</div>
      </div>
      <button class="close-btn" onclick="closeModal('sudhir-debit-modal')">✕</button>
    </div>
    <div class="modal-body">

      ${f.inventoryPartialDebit ? `<div class="alert" style="background:var(--orange-light);border:1.5px solid #fdba74;color:#9a3412;font-size:12px;border-radius:8px;padding:10px 14px;margin-bottom:14px;">
        <strong>⚠️ Previous partial debit on record.</strong> Materials skipped: <strong>${partialSkipped.join(', ')}</strong>.<br>
        Clicking Confirm Debit will debit ALL materials now (those with stock available).
      </div>`: ''}

      <div class="alert" style="background:var(--accent-light);border:1.5px solid #bfdbfe;color:#1e40af;font-size:12px;border-radius:8px;padding:10px 14px;margin-bottom:16px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle;margin-right:6px;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        This debit is <strong>one-time and permanent</strong>. Once done it cannot be undone.
        Materials with zero/insufficient stock will be <strong>skipped but noted</strong>.
      </div>

      <div class="form-group" style="max-width:280px;">
        <label style="font-weight:700;">Number of Lots ✱</label>
        <input class="form-control" id="sdb-lots" type="number" min="1" value="1"
          oninput="updateDebitPreview(${id})" style="font-size:16px;font-weight:700;">
        <div class="form-hint">How many lots were actually produced?</div>
      </div>

      <div class="form-group" style="max-width:400px;">
        <label>Remark (optional)</label>
        <input class="form-control" id="sdb-remark" placeholder="e.g. Made for Sudhir Ji batch, some materials were zero...">
      </div>

      <div id="sdb-preview" style="margin-top:4px;"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('sudhir-debit-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="confirmSudhirDebit(${id})" style="background:linear-gradient(135deg,#16a34a,#15803d);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        Confirm Debit Inventory
      </button>
    </div>
  </div></div>`;
            document.body.insertAdjacentHTML('beforeend', modal);
            document.getElementById('sdb-lots')?.focus();
            updateDebitPreview(id);
        }

        function updateDebitPreview(id) {
            const f = DB.formulations.find(x => x.id === id);
            const lots = parseInt(document.getElementById('sdb-lots')?.value) || 1;
            if (!f) return;
            const perLot = f.lots || 1;
            let rows = ''; let hasShortage = false; let skippedNames = [];
            f.items.forEach(item => {
                const rm = getRMById(item.rmId); if (!rm) return;
                // v3.6b-FIX: convert G/ML → KG before comparing against KG inventory
                const u = (item.unit || rm.unit || 'KG').toUpperCase();
                const qtyKg = (u === 'G' || u === 'ML') ? item.qty / 1000 : item.qty;
                const qtyPerLot = qtyKg / perLot;
                const totalNeeded = qtyPerLot * lots;
                const available = getInvByRMId(rm.id).quantity;
                const ok = available >= totalNeeded;
                if (!ok) { hasShortage = true; skippedNames.push(rm.name); }
                rows += `<tr>
      <td class="td-primary">${rm.name}</td>
      <td style="font-weight:700;">${totalNeeded.toFixed(3)} KG</td>
      <td>${available.toFixed(3)}</td>
      <td><span class="status-pill ${ok ? 'status-ok' : 'status-out'}">${ok ? '✓ Will Debit' : '⚠ Skip (zero)'}</span></td>
    </tr>`;
            });
            const previewEl = document.getElementById('sdb-preview');
            if (!previewEl) return;
            previewEl.innerHTML = `
    <div style="background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:14px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
        <div style="font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;">${f.productName} × ${lots} Lots</div>
        ${hasShortage ? `<span class="status-pill status-out">⚠ Some materials zero — will be skipped</span>` : `<span class="status-pill status-ok">✓ All stock available</span>`}
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>Raw Material</th><th>Required</th><th>In Stock</th><th>Status</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
      ${hasShortage ? `<div style="margin-top:10px;background:var(--orange-light);border:1px solid #fdba74;border-radius:8px;padding:10px 14px;font-size:12px;color:#9a3412;">
        <strong>⚠️ Skipped (zero/insufficient stock):</strong> ${skippedNames.join(', ')}<br>
        <span style="font-size:11px;">Recipe will be saved. These materials will be noted as "not debited — zero stock" in remarks.</span>
      </div>`: ''}
    </div>`;
        }

        function confirmSudhirDebit(id) {
            const f = DB.formulations.find(x => x.id === id);
            if (!f) return;
            if (f.inventoryDebited === true || f.inventoryDebited === 'true') {
                toast('Inventory already debited for this formulation', 'info');
                closeModal('sudhir-debit-modal');
                return;
            }
            const lots = parseInt(document.getElementById('sdb-lots')?.value);
            if (!lots || lots < 1) { toast('Please enter number of lots', 'error'); return; }
            const remark = (document.getElementById('sdb-remark')?.value || '').trim();

            const debitBtn = document.querySelector('#sudhir-debit-modal .btn-success, #sudhir-debit-modal .btn-primary');
            if (debitBtn) {
                debitBtn.disabled = true;
                debitBtn.innerHTML = '<div class="spinner" style="width:14px;height:14px;border-color:#0005;border-top-color:#fff;display:inline-block;vertical-align:middle;margin-right:6px;"></div>Saving...';
            }
            showSaving();

            if (GAS_URL) {
                // Real PostgreSQL + FastAPI backend flow
                gasCall('debitInventory', { formulationId: id, lots: lots, remark: remark })
                    .then(res => {
                        if (res && res.success === false) {
                            throw new Error(res.error || 'Server error');
                        }
                        // Refresh in-memory database to get updated stocks, transactions, etc.
                        return loadFromGAS();
                    })
                    .then(() => {
                        closeModal('sudhir-debit-modal');
                        toast(`📦 Inventory debited successfully for ${lots} lot${lots > 1 ? 's' : ''}!`, 'success');
                        navigate('formulations');
                    })
                    .catch(err => {
                        toast('❌ DEBIT SAVE FAILED — ' + err.message, 'error');
                        if (debitBtn) {
                            debitBtn.disabled = false;
                            debitBtn.innerHTML = '📦 Confirm Debit';
                        }
                    })
                    .finally(() => hideSaving());
            } else {
                // Demo mode in-memory only flow
                const perLot = f.lots || 1;
                const debitDateTime = nowDateTime();
                const skippedRmIds = [];
                const skippedNames = [];
                const debitLog = [];

                f.items.forEach(item => {
                    const rm = getRMById(item.rmId); if (!rm) return;
                    const u = (item.unit || rm.unit || 'KG').toUpperCase();
                    const qtyKg = (u === 'G' || u === 'ML') ? item.qty / 1000 : item.qty;
                    const qtyPerLot = qtyKg / perLot;
                    const totalDebit = qtyPerLot * lots;
                    const inv = DB.inventory.find(i => i.rmId === item.rmId);
                    const available = inv ? inv.quantity : 0;
                    if (available < totalDebit) {
                        skippedRmIds.push(item.rmId);
                        skippedNames.push(rm.name);
                        return;
                    }
                    if (inv) inv.quantity = Math.max(0, inv.quantity - totalDebit);
                    DB.stockTransactions.push({ id: DB.nextId.txn++, rmId: item.rmId, type: 'consumption', qty: -totalDebit, date: debitDateTime.slice(0, 10), remarks: `Inventory Debit — ${f.batchNo || f.productName} (${lots} lots)`, by: currentUser.username });
                    debitLog.push({ rmId: item.rmId, name: rm.name, qty: totalDebit });
                });

                let autoRemark = remark ? remark + '. ' : '';
                if (skippedNames.length > 0) {
                    autoRemark += `Recipe saved but these materials were NOT debited (zero/insufficient stock): ${skippedNames.join(', ')}.`;
                }

                f.inventoryDebited = true;
                f.inventoryPartialDebit = skippedNames.length > 0;
                f.skippedDebitRmIds = skippedRmIds;
                f.debitLots = lots;
                f.debitDate = debitDateTime.slice(0, 10);
                f.debitRemarks = autoRemark || 'Inventory debited successfully.';

                const auditEntry = {
                    time: debitDateTime, user: currentUser.name, action: 'Inventory debited',
                    detail: `${f.productName} — ${lots} lot${lots > 1 ? 's' : ''} — Batch: ${f.batchNo || '—'}${skippedNames.length ? ' | Skipped (zero stock): ' + skippedNames.join(', ') : ''}`
                };
                DB.auditLog.unshift(auditEntry);

                closeModal('sudhir-debit-modal');

                if (skippedNames.length > 0) {
                    toast(`📦 Inventory debited ✓ — NOT debited (zero stock): ${skippedNames.join(', ')}`, 'warning');
                } else {
                    toast(`📦 Inventory debited successfully for ${lots} lot${lots > 1 ? 's' : ''}!`, 'success');
                }
                hideSaving();
                navigate('formulations');
            }
        }

        // ════════════════════════════════════════════════════════

        function selectLotOption(type) {
            const asisCard = document.getElementById('opt-asis');
            const customCard = document.getElementById('opt-custom');
            const customRow = document.getElementById('custom-lot-row');
            if (!asisCard) return;
            if (type === 'asis') {

        function updateSudhirPreview(id) {
            const f = DB.formulations.find(x => x.id === id);
            const lots = parseInt(document.getElementById('sudhir-lots')?.value) || 1;
            if (!f) return;
            const perLot = f.lots || 1;
            let rows = ''; let hasShortage = false;
            const cost = calcBatchCost(f);
            // v3.6b-FIX: baseQty must sum KG-equivalent of each item for correct total weight display
            const baseQty = f.items.reduce((s, i) => {
                const rm2 = getRMById(i.rmId);
                const u2 = ((i.unit || (rm2 && rm2.unit) || 'KG')).toUpperCase();
                const kgEq = (u2 === 'G' || u2 === 'ML') ? i.qty / 1000 : i.qty;
                return s + (kgEq / perLot);
            }, 0);
            const totalQty = baseQty * lots;
            f.items.forEach(item => {
                const rm = getRMById(item.rmId); if (!rm) return;
                // v3.6b-FIX: convert G/ML → KG before comparing against KG inventory
                const u = (item.unit || rm.unit || 'KG').toUpperCase();
                const qtyKg = (u === 'G' || u === 'ML') ? item.qty / 1000 : item.qty;
                const qtyPerLot = qtyKg / perLot;
                const totalNeeded = qtyPerLot * lots;
                const available = getInvByRMId(rm.id).quantity;
                const ok = available >= totalNeeded;

            const perLot = f.lots || 1;

            // PDF only — inventory debit happens separately via Debit Inventory button

            closeModal('sudhir-modal');

            toolbar.innerHTML = `
    <span style="color:#f59e0b;font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:700;">📋 ${f.productName} — ${lots} Lots${alreadyDebited ? ' — ✅ Inventory Debited' : ' — ⚠️ Inventory Not Yet Debited'}</span>
    <span style="flex:1"></span>

        // Copy formulation as new (template)
        function copyFormulationAsNew(id) {

            if (!src) return;

        function openEditFormModal(id) {

            if (!f) { toast('Formulation not found', 'error'); return; }
            const modal = `<div class="modal-overlay" id="edit-form-modal" onclick="if(event.target.id==='edit-form-modal')closeModal('edit-form-modal')">
  <div class="modal modal-lg">
    <div class="modal-header">

            document.body.insertAdjacentHTML('beforeend', modal);

        let _efCount = 0;

      <button class="remove-btn" onclick="document.getElementById('${id}').remove();updateEfLiveTotal()">−</button>

            if (!preRmId) openRMDropdownEF(id);

        function onEfRateInput(id) {
            const rateEl = document.getElementById('efrate-' + id);
            const baseRate = parseFloat(document.getElementById('efbaserate-' + id)?.value) || 0;
            if (!rateEl) return;
            const currentRate = parseFloat(rateEl.value) || 0;
            if (currentRate !== baseRate) {
                rateEl.classList.add('fi-rate-changed');
                rateEl.title = '⚠ Rate changed from default ₹' + baseRate;
            } else {
                rateEl.classList.remove('fi-rate-changed');
                rateEl.title = 'Edit rate for this batch';

        }

        function openRMDropdownEF(id) {
            const q = (document.getElementById('rmsearch-' + id)?.value || '').toLowerCase();
            renderRMDropdownEF(id, q);
            document.getElementById('rmdrop-' + id)?.classList.add('open');
            document.querySelectorAll('.rm-dropdown.open').forEach(d => { if (d.id !== 'rmdrop-' + id) d.classList.remove('open'); });
        }
        function filterRMDropdownEF(id) {
            const q = (document.getElementById('rmsearch-' + id)?.value || '').toLowerCase();
            renderRMDropdownEF(id, q);
            document.getElementById('rmdrop-' + id)?.classList.add('open');
        }
        function renderRMDropdownEF(id, q) {
            const drop = document.getElementById('rmdrop-' + id); if (!drop) return;
            const filtered = DB.rawMaterials.filter(r => r.name.toLowerCase().includes(q) || r.code.toLowerCase().includes(q));
            if (filtered.length === 0) { drop.innerHTML = `<div class="rm-dropdown-empty">No materials found</div>`; return; }
            drop.innerHTML = filtered.map(r => `<div class="rm-dropdown-item" onclick="selectRMEF('${id}',${r.id},'${r.name.replace(/'/g, "\\'")}','${r.code}','${r.unit}')"><span>${r.name}</span><span class="rm-code">${r.code} · ${r.unit}${can('viewCost') && r.rate ? ' · <strong style="color:var(--accent2)">₹' + r.rate + '</strong>' : ''}</span></div>`).join('');
        }
        function handleRMDropdownKeyEF(e, id) { handleRMDropdownKey(e, id); }
        function selectRMEF(id, rmId, rmName, rmCode, rmUnit) {
            document.getElementById('efsel-' + id).value = rmId;
            document.getElementById('rmsearch-' + id).value = `${rmName} (${rmCode})`;
            const unitSel = document.getElementById('efunit-' + id);
            if (unitSel) unitSel.value = rmUnit;
            // Populate rate field
            const rm = getRMById(rmId);
            const rateEl = document.getElementById('efrate-' + id);
            const baseRateEl = document.getElementById('efbaserate-' + id);
            if (rateEl && rm) { rateEl.value = rm.rate || 0; rateEl.classList.remove('fi-rate-changed'); }
            if (baseRateEl && rm) baseRateEl.value = rm.rate || 0;
            document.getElementById('rmdrop-' + id)?.classList.remove('open');
            document.getElementById('efqty-' + id)?.focus();
            updateEfLiveTotal();
        }
        function updateEfLiveTotal() {
            let totalKg = 0, totalG = 0, totalCost = 0, lineCount = 0;
            document.querySelectorAll('[id^="efitem-"]').forEach(row => {
                const id = row.id;
                const rmId = parseInt(document.getElementById('efsel-' + id)?.value) || 0;
                const qty = parseFloat(document.getElementById('efqty-' + id)?.value) || 0;
                const unit = (document.getElementById('efunit-' + id)?.value || 'KG').toUpperCase();
                const rm = getRMById(rmId);
                const rateEl = document.getElementById('efrate-' + id);
                const rate = rateEl ? parseFloat(rateEl.value) || 0 : (rm ? rm.rate || 0 : 0);
                if (unit === 'G' || unit === 'ML') totalG += qty; else totalKg += qty;
                lineCount++;
                if (rm && can('viewCost')) {
                    const qtyKg = (unit === 'G' || unit === 'ML') ? qty / 1000 : qty;
                    const lineCost = qtyKg * rate;
                    totalCost += lineCost;
                    const costEl = document.getElementById('efcost-' + id);
                    if (costEl) costEl.textContent = qty > 0 ? fmtCurrency(lineCost) : '—';
                }
            });
            const totalQtyKg = totalKg + (totalG / 1000);
            const panel = document.getElementById('ef-live-total'); if (!panel) return;
            if (can('viewCost')) {
                const totalWithPkgEf = totalCost + (DB.packagingCost || 0) * totalQtyKg;
                const costPerKgEf = totalQtyKg > 0 ? totalWithPkgEf / totalQtyKg : 0;
                panel.innerHTML = `
      <div class="fm-lt-item"><div class="fm-lt-label">Materials</div><div class="fm-lt-value">${lineCount}</div></div>
      <div class="fm-lt-item"><div class="fm-lt-label">Total Qty</div><div class="fm-lt-value amber">${totalQtyKg.toFixed(3)} KG</div></div>
      <div class="fm-lt-item"><div class="fm-lt-label">RM Cost</div><div class="fm-lt-value green">${fmtCurrency(totalCost)}</div></div>
      <div class="fm-lt-item"><div class="fm-lt-label">+Packaging</div><div class="fm-lt-value green">${fmtCurrency(totalWithPkgEf)}</div></div>
      <div class="fm-lt-item" style="border-left:2px solid #fbbf24;padding-left:14px;"><div class="fm-lt-label" style="color:#fbbf24;font-size:11px;font-weight:800;">COST / KG</div><div style="font-size:30px;font-weight:900;color:#fbbf24;font-family:'JetBrains Mono',monospace;letter-spacing:-1px;line-height:1;">${totalQtyKg > 0 ? fmtCurrency(costPerKgEf) : '—'}</div></div>`;
            } else {
                panel.innerHTML = `
      <div class="fm-lt-item"><div class="fm-lt-label">Materials</div><div class="fm-lt-value">${lineCount}</div></div>
      <div class="fm-lt-item"><div class="fm-lt-label">Total Qty</div><div class="fm-lt-value amber">${totalQtyKg.toFixed(3)} KG</div></div>`;
            }
        }

        function saveEditFormulation(id) {
            const f = DB.formulations.find(x => x.id === id);
            if (!f) { toast('Formulation not found', 'error'); return; }
            const pname = document.getElementById('ef-pname').value.trim();
            const pcode = document.getElementById('ef-pcode').value.trim();
            const batch = document.getElementById('ef-batch').value.trim();
            const remarks = document.getElementById('ef-remarks').value.trim();
            if (!pname) { toast('Product Name is required', 'error'); return; }

            // v3.5 FIX-RATE: Build a map of previously saved rates by rmId.
            // The edit form renders inputs with 0 when item.rate was undefined on load.
            // We must NEVER overwrite a real saved rate with 0 — that deletes costing data.
            const savedRateByRmId = {};
            (f.items || []).forEach(item => {
                if (item.rate !== undefined && item.rate !== null && Number(item.rate) > 0) {
                    savedRateByRmId[item.rmId] = Number(item.rate);
                }
            });

            const items = [];
            document.querySelectorAll('[id^="efitem-"]').forEach(row => {
                const rowId = row.id;
                const rmId = parseInt(document.getElementById('efsel-' + rowId)?.value) || 0;
                const qty = parseFloat(document.getElementById('efqty-' + rowId)?.value) || 0;
                const unit = document.getElementById('efunit-' + rowId)?.value || 'KG';
                const rm = getRMById(rmId);
                const rateEl = document.getElementById('efrate-' + rowId);
                // v3.5 FIX-RATE: 3-tier rate resolution
                //   1. User explicitly typed a positive number → use it
                //   2. Previously saved rate for this rm exists → preserve it
                //   3. Catalog rate for this rm → fall back
                const parsedInput = rateEl ? parseFloat(rateEl.value) : NaN;
                let rate;
                if (!isNaN(parsedInput) && parsedInput > 0) {
                    rate = parsedInput;
                } else if (savedRateByRmId[rmId] !== undefined) {
                    rate = savedRateByRmId[rmId];   // preserve Sudhir Ji's costing rate
                } else {
                    rate = (rm && rm.rate > 0) ? rm.rate : 0;
                }
                if (rmId && qty > 0) items.push({ rmId, qty, unit, rate });
            });
            if (items.length === 0) { toast('Add at least one ingredient', 'error'); return; }

            // Snapshot for rollback on failure
            const originalItems = [...f.items];
            const originalName = f.productName, originalCode = f.productCode;
            const originalBatch = f.batchNo, originalRemarks = f.remarks;
            const originalPartyId = f.partyId, originalPartyName = f.partyName;
            f.productName = pname;
            f.productCode = pcode;
            f.batchNo = batch;
            f.remarks = remarks;
            f.items = items;
            // v3.9-FIX: Re-run Sheet2 party lookup for edits too — covers recipes that
            // had refNo but blank partyId/partyName when first saved (pre-v3.8 entries).
            if (f.refNo && DB.partyLookup && DB.partyLookup.length && (!f.partyId && !f.partyName)) {
                const _em = DB.partyLookup.find(p => String(p.refNo || '').trim().toLowerCase() === f.refNo.trim().toLowerCase());
                if (_em) { f.partyId = String(_em.partyId || '').trim(); f.partyName = String(_em.partyName || '').trim(); }
            }
            addAudit('Edited formulation recipe', `${pcode} — Batch ${batch}`);
            const editSaveBtn = document.querySelector('#edit-form-modal .btn-primary');
            if (editSaveBtn) { editSaveBtn.disabled = true; editSaveBtn.innerHTML = '<div class="spinner" style="width:14px;height:14px;border-color:#fff3;border-top-color:#fff;display:inline-block;vertical-align:middle;margin-right:6px;"></div>Saving…'; }
            showSaving();
            gasCall('saveFormulation', { formulation: f, items, inventoryUpdates: [], transactions: [], debitInventory: false })
                .then(() => { toast('Recipe updated in database ✓', 'success'); closeModal('edit-form-modal'); navigate('formulations'); })
                .catch(err => {
                    // v3.5 FIX-RATE: roll back in-memory on failure so local state stays consistent
                    f.productName = originalName; f.productCode = originalCode;
                    f.batchNo = originalBatch; f.remarks = originalRemarks; f.items = originalItems;
                    f.partyId = originalPartyId; f.partyName = originalPartyName;
                    toast('❌ Edit save failed — ' + err.message, 'error');
                    if (editSaveBtn) { editSaveBtn.disabled = false; editSaveBtn.innerHTML = 'Save Changes'; }
                })
                .finally(() => hideSaving());
        }

        <span style="text-align:center;">Unit</span>
        ${can('viewCost') ? '<span style="text-align:right;">Rate ₹/unit</span>' : ''}
        ${can('viewCost') ? '<span style="text-align:right;">Line Cost</span>' : ''}
        <span></span>
      </div>
      <div id="fm-items"></div>
      <button class="add-item-btn" onclick="addFormItem();_saveFormDraft()">＋ Add Raw Material</button>
      <!-- Live total panel -->
      <div class="fm-live-total" id="fm-live-total" style="margin-top:12px;"></div>

      <!-- ══ BATCH SCALER ══ -->
      <div style="margin-top:20px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
          <div style="font-size:13px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:8px;">
            <span style="font-size:18px;">⚖️</span> Batch Scaler
            <span style="font-size:11px;font-weight:500;color:var(--text3);font-style:italic;">— scale quantities to any target batch size, or add multiple products</span>
          </div>
          <button class="btn btn-sm" style="background:var(--accent-light);color:var(--accent2);border:1.5px solid #bfdbfe;" onclick="toggleScaler()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
            <span id="scaler-toggle-lbl">Show Scaler</span>
          </button>
        </div>
        <div id="fm-scaler-wrap" style="display:none;">
          <div class="scaler-card">
            <div style="font-size:12px;font-weight:700;color:#1e40af;margin-bottom:12px;text-transform:uppercase;letter-spacing:.7px;">📦 Products to Scale</div>
            <div id="scaler-products"></div>
            <button class="btn btn-sm" style="background:#dbeafe;color:#1e40af;border:1.5px dashed #93c5fd;width:100%;justify-content:center;margin-top:6px;" onclick="addScalerProduct()">
              ＋ Add Another Product
            </button>
            <div style="margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
              <button class="btn btn-primary btn-sm" onclick="runScaler()">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                Calculate Scaled Requirements
              </button>
              <span style="font-size:11px;color:var(--text3);">Inventory is NOT debited by this tool</span>
            </div>
            <div id="scaler-result" style="margin-top:14px;"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('form-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveFormulation()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Save Formulation
      </button>
    </div>
  </div></div>`;
            document.body.insertAdjacentHTML('beforeend', modal);

            if (template && template.items && template.items.length) {
                template.items.forEach(item => addFormItem(item.rmId, item.qty, item.unit, item.rate));
                // Pad to at least 10 rows
                const needed = 10 - template.items.length;
                for (let i = 0; i < needed; i++) addFormItem();
            } else if (draft && draft.items && draft.items.length) {
                // Restore draft items (including filled and empty rows)
                draft.items.forEach(item => {
                    addFormItem(item.rmId || null, item.qty || null, item.unit || null, item.rate || null);
                    // Restore typed-but-unselected search label if any
                    if (!item.rmId && item.label) {
                        const lastId = 'fitem-' + formItemCount;
                        const searchEl = document.getElementById('rmsearch-' + lastId);
                        if (searchEl) searchEl.value = item.label;
                    }
                });
                // Always ensure at least 10 rows
                const needed = 10 - draft.items.length;
                for (let i = 0; i < needed; i++) addFormItem();
            } else {
                // Fresh form: show 10 empty rows
                for (let i = 0; i < 10; i++) addFormItem();
            }
        }

        // ════════════════════════════════════════════════════════
        //  TEMPLATE AUTO-FILL — scale saved formulation to any FG qty
        // ════════════════════════════════════════════════════════
        // ── Template search helpers ──────────────────────────────────────────────────
        function _renderTemplateDropdown(list) {
            const cont = document.getElementById('fm-template-dropdown-list');
            const drop = document.getElementById('fm-template-dropdown');
            if (!cont || !drop) return;
            if (!list.length) {
                cont.innerHTML = `<div style="padding:12px 16px;font-size:13px;color:var(--text3);text-align:center;">No matching formulations</div>`;
                drop.style.display = 'block'; return;
            }
            cont.innerHTML = list.map(f => {
                const baseKg = calcTotalQty(f).toFixed(2);
                const dateStr = (() => {
                    const raw = f.createdAt || f.mfgDate || '';
                    if (!raw) return '—';
                    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                    const own = raw.match(/^(\d{4})-(\d{2})-(\d{2})(?:\s+(\d{2}:\d{2}))?/);
                    if (own) { const [, y, m, d, t] = own; return `${parseInt(d)} ${months[parseInt(m) - 1]} ${y}${t ? ' · ' + t : ''}`; }
                    const dt = new Date(raw);
                    if (!isNaN(dt)) { const t = String(dt.getHours()).padStart(2, '0') + ':' + String(dt.getMinutes()).padStart(2, '0'); return `${dt.getDate()} ${months[dt.getMonth()]} ${dt.getFullYear()} · ${t}`; }
                    return raw;
                })();
                return `<div class="fm-tpl-opt" data-id="${f.id}"
      style="padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:background 0.12s;"
      onmouseenter="this.style.background='#f0fdf4'"
      onmouseleave="this.style.background=''"
      onclick="selectTemplateOption(${f.id})">
      <div style="font-size:13px;font-weight:700;color:var(--text);">${f.productName}${f.productCode ? ' <span style=\'font-size:11px;color:var(--text3);font-weight:500;\'>(' + f.productCode + ')</span>' : ''}</div>
      <div style="display:flex;gap:12px;margin-top:3px;align-items:center;flex-wrap:wrap;">
        <span style="font-size:11px;color:#059669;font-weight:600;">⚖ ${baseKg} KG base · ${f.items ? f.items.length : 0} materials</span>
        <span style="font-size:11px;color:var(--text3);">🗓 Last made: <b style="color:var(--text2);">${dateStr}</b></span>
        ${f.productType ? `<span style="font-size:10px;background:var(--accent-light);color:var(--accent2);padding:1px 7px;border-radius:20px;font-weight:700;">${f.productType}</span>` : ''}
      </div>
    </div>`;
            }).join('');
            drop.style.display = 'block';
        }

        function showTemplateDropdown() {
            const q = document.getElementById('fm-template-search')?.value || '';
            if (!q.trim()) {
                // Show all, sorted newest first
                const sorted = [...DB.formulations].sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
                _renderTemplateDropdown(sorted);
            } else {
                onTemplateSearchInput(q);
            }
        }

        function hideTemplateDropdown() {
            const drop = document.getElementById('fm-template-dropdown');
            if (drop) drop.style.display = 'none';
        }

        function onTemplateSearchInput(q) {
            const lower = q.toLowerCase().trim();
            let results;
            if (!lower) {
                results = [...DB.formulations].sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
            } else {
                results = DB.formulations
                    .filter(f => {
                        const name = (f.productName || '').toLowerCase();
                        const code = (f.productCode || '').toLowerCase();
                        const type = (f.productType || '').toLowerCase();
                        const finish = (f.productFinish || '').toLowerCase();
                        return name.includes(lower) || code.includes(lower) || type.includes(lower) || finish.includes(lower);
                    })
                    .sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
            }
            _renderTemplateDropdown(results);
            const drop = document.getElementById('fm-template-dropdown');
            if (drop) drop.style.display = 'block';
        }

        function selectTemplateOption(fId) {
            const f = DB.formulations.find(x => x.id === fId);
            if (!f) return;
            // Set hidden value and search display
            const hiddenSel = document.getElementById('fm-template-sel');
            if (hiddenSel) hiddenSel.value = String(fId);
            const searchEl = document.getElementById('fm-template-search');
            const dateStr = f.createdAt ? f.createdAt.split(' ')[0] : '—';
            if (searchEl) searchEl.value = `${f.productName}${f.productCode ? ' (' + f.productCode + ')' : ''}`;
            hideTemplateDropdown();
            // Update info + apply button
            onTemplateSelect();
        }

        function onTemplateSelect() {
            const fId = parseInt(document.getElementById('fm-template-sel')?.value) || 0;
            const infoEl = document.getElementById('fm-template-info');
            const applyBtn = document.getElementById('fm-template-apply-btn');
            const qtyEl = document.getElementById('fm-template-qty');
            if (!fId) {
                if (infoEl) infoEl.textContent = '';
                if (applyBtn) applyBtn.style.display = 'none';
                return;
            }
            const f = DB.formulations.find(x => x.id === fId);
            if (!f) { if (infoEl) infoEl.textContent = ''; return; }
            const baseKg = calcTotalQty(f);
            const dateStr = (() => {
                const raw = f.createdAt || f.mfgDate || '';
                if (!raw) return '—';
                const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                const own = raw.match(/^(\d{4})-(\d{2})-(\d{2})(?:\s+(\d{2}:\d{2}))?/);
                if (own) { const [, y, m, d, t] = own; return `${parseInt(d)} ${months[parseInt(m) - 1]} ${y}${t ? ' · ' + t : ''}`; }
                const dt = new Date(raw);
                if (!isNaN(dt)) { const t = String(dt.getHours()).padStart(2, '0') + ':' + String(dt.getMinutes()).padStart(2, '0'); return `${dt.getDate()} ${months[dt.getMonth()]} ${dt.getFullYear()} · ${t}`; }
                return raw;
            })();
            if (infoEl) infoEl.innerHTML = `Template base: <b>${baseKg.toFixed(3)} KG</b> · <b>${f.items.length}</b> raw materials · Last made: <b>${dateStr}</b> — Enter your target quantity and click Apply.`;
            const qty = parseFloat(qtyEl?.value) || 0;
            if (applyBtn) applyBtn.style.display = (qty > 0) ? 'inline-flex' : 'none';
        }

        function onTemplateQtyInput() {
            const fId = parseInt(document.getElementById('fm-template-sel')?.value) || 0;
            const qty = parseFloat(document.getElementById('fm-template-qty')?.value) || 0;
            const applyBtn = document.getElementById('fm-template-apply-btn');
            if (applyBtn) applyBtn.style.display = (fId && qty > 0) ? 'inline-flex' : 'none';
        }

        function applyTemplate() {
            const fId = parseInt(document.getElementById('fm-template-sel')?.value) || 0;
            const targetKg = parseFloat(document.getElementById('fm-template-qty')?.value) || 0;

            if (!fId) { toast('Please select a template formulation', 'error'); return; }
            if (targetKg <= 0) { toast('Please enter a valid FG quantity', 'error'); return; }
            const f = DB.formulations.find(x => x.id === fId);
            if (!f || !f.items || f.items.length === 0) { toast('Template has no raw material items', 'error'); return; }

            const baseKg = calcTotalQty(f);
            if (baseKg <= 0) { toast('Template base quantity is zero', 'error'); return; }
            const scaleFactor = targetKg / baseKg;

            // Clear existing form items
            const fmItems = document.getElementById('fm-items');
            if (fmItems) fmItems.innerHTML = '';
            formItemCount = 0;

            // Add scaled items from template
            f.items.forEach(item => {
                const rm = getRMById(item.rmId); if (!rm) return;
                const u = (item.unit || rm.unit || 'KG').toUpperCase();
                // Scale quantity
                const scaledQty = parseFloat((item.qty * scaleFactor).toFixed(4));
                addFormItem(item.rmId, scaledQty, item.unit || rm.unit, item.rate !== undefined ? item.rate : rm.rate);
            });

            // Pad to at least 10 rows
            const totalRows = f.items.filter(i => getRMById(i.rmId)).length;
            const needed = Math.max(0, 10 - totalRows);
            for (let i = 0; i < needed; i++)addFormItem();

            updateFmLiveTotal();
            _saveFormDraft();

            // Show success badge
            const badge = document.getElementById('fm-template-applied-badge');
            const kgSpan = document.getElementById('fm-tpl-applied-kg');
            const applyBtn = document.getElementById('fm-template-apply-btn');
            if (badge) { badge.style.display = 'flex'; badge.style.alignItems = 'center'; }
            if (kgSpan) kgSpan.textContent = targetKg + ' KG';
            if (applyBtn) applyBtn.style.display = 'none';

            toast(`✅ Template applied — ${f.items.length} materials scaled to ${targetKg} KG (×${scaleFactor.toFixed(4)})`, 'success');

            // Scroll to items
            document.getElementById('fm-items')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function clearTemplateApply() {
            const badge = document.getElementById('fm-template-applied-badge');
            if (badge) badge.style.display = 'none';
            // Clear search + hidden value
            const searchEl = document.getElementById('fm-template-search');
            const hiddenSel = document.getElementById('fm-template-sel');
            if (searchEl) searchEl.value = '';
            if (hiddenSel) hiddenSel.value = '';
            const infoEl = document.getElementById('fm-template-info');
            if (infoEl) infoEl.textContent = '';
            const applyBtn = document.getElementById('fm-template-apply-btn');
            if (applyBtn) applyBtn.style.display = 'none';
            // Clear and reset items to 10 empty rows
            const fmItems = document.getElementById('fm-items');
            if (fmItems) fmItems.innerHTML = '';
            formItemCount = 0;
            for (let i = 0; i < 10; i++)addFormItem();
            updateFmLiveTotal();
        }

        function updateLotPreview() {
            const lots = parseInt(document.getElementById('fm-lots')?.value) || 1;
            const el = document.getElementById('lot-preview-text');
            if (el) el.textContent = `All quantities × ${lots} = deducted from inventory`;
        }

        // ════════════════════════════════════════════════════════
        //  BATCH SCALER — scale formulation to any qty, multi-product
        // ════════════════════════════════════════════════════════
        let _scalerCount = 0;
        function toggleScaler() {
            const wrap = document.getElementById('fm-scaler-wrap');
            const lbl = document.getElementById('scaler-toggle-lbl');
            if (!wrap) return;
            const isHidden = wrap.style.display === 'none';
            wrap.style.display = isHidden ? 'block' : 'none';
            if (lbl) lbl.textContent = isHidden ? 'Hide Scaler' : 'Show Scaler';
            if (isHidden && document.querySelectorAll('#scaler-products .scaler-product-row').length === 0) {
                addScalerProduct();
            }
        }

        function addScalerProduct() {
            _scalerCount++;
            const n = _scalerCount;
            const formOpts = DB.formulations.map(f => `<option value="${f.id}">${f.productName}${f.productCode ? ' (' + f.productCode + ')' : ''} — ${calcTotalQty(f).toFixed(2)} KG base</option>`).join('');
            const row = document.createElement('div');
            row.className = 'scaler-product-row';
            row.id = 'sp-' + n;
            row.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
      <div style="font-size:12px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px;">
        <span style="background:var(--accent);color:#fff;border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;">${n}</span>
        Product ${n}
      </div>
      ${n > 1 ? `<button onclick="document.getElementById('sp-${n}').remove()" style="background:var(--red-light);border:1px solid #fca5a5;color:var(--red);border-radius:6px;padding:3px 8px;cursor:pointer;font-size:11px;">✕ Remove</button>` : ''}
    </div>
    <div class="form-row">
      <div class="form-group" style="margin-bottom:10px;">
        <label style="font-size:11px;">Base Formulation</label>
        <select class="form-control" id="sp-form-${n}" style="font-size:13px;" onchange="scalerUpdateBase(${n})">
          <option value="">— Use items from this modal —</option>
          ${formOpts}
        </select>
      </div>
      <div class="form-group" style="margin-bottom:10px;">
        <label style="font-size:11px;">Required Quantity (KG)</label>
        <input class="form-control" id="sp-qty-${n}" type="number" step="0.01" min="0.01" placeholder="e.g. 500" style="font-size:13px;font-weight:700;">
      </div>
    </div>
    <div id="sp-base-info-${n}" style="font-size:11px;color:var(--text3);margin-top:-6px;margin-bottom:6px;"></div>`;
            document.getElementById('scaler-products').appendChild(row);
        }

        function scalerUpdateBase(n) {
            const fId = parseInt(document.getElementById('sp-form-' + n)?.value) || 0;
            const infoEl = document.getElementById('sp-base-info-' + n);
            if (!infoEl) return;
            if (!fId) { infoEl.textContent = 'Using items entered in this modal as the base formulation.'; return; }
            const f = DB.formulations.find(x => x.id === fId);
            if (!f) { infoEl.textContent = ''; return; }
            const base = calcTotalQty(f);
            infoEl.textContent = `Base size: ${base.toFixed(3)} KG · ${f.items.length} raw materials`;
        }

        function _getScalerBaseItems(fId) {
            // If fId is set, use that formulation's items; else read from the current modal
            if (fId) {
                const f = DB.formulations.find(x => x.id === fId);
                return f ? f.items : [];
            }
            // Read from current modal form items
            const items = [];
            document.querySelectorAll('[id^="fitem-"]').forEach(row => {
                const id = row.id;
                const rmId = parseInt(document.getElementById('sel-' + id)?.value) || 0;
                const qty = parseFloat(document.getElementById('qty-' + id)?.value) || 0;
                const unit = document.getElementById('fmunit-' + id)?.value || 'KG';
                const rateEl = document.getElementById('rate-' + id);
                const rm = getRMById(rmId);
                const rate = rateEl ? parseFloat(rateEl.value) || 0 : (rm ? rm.rate || 0 : 0);
                if (rmId && qty > 0) items.push({ rmId, qty, unit, rate });
            });
            return items;
        }

        function runScaler() {
            const resultEl = document.getElementById('scaler-result');
            if (!resultEl) return;
            const rows = document.querySelectorAll('#scaler-products .scaler-product-row');
            if (rows.length === 0) { resultEl.innerHTML = '<div class="alert alert-error">Add at least one product row.</div>'; return; }

            // Collect all product specs
            const products = [];
            let hasError = false;
            rows.forEach(row => {
                const n = row.id.replace('sp-', '');
                const fId = parseInt(document.getElementById('sp-form-' + n)?.value) || 0;
                const reqKg = parseFloat(document.getElementById('sp-qty-' + n)?.value) || 0;
                if (reqKg <= 0) { hasError = true; return; }
                const baseItems = _getScalerBaseItems(fId);
                if (baseItems.length === 0) { hasError = true; return; }
                // Compute base KG total
                const baseKg = baseItems.reduce((s, i) => {
                    const u = (i.unit || 'KG').toUpperCase();
                    return s + ((u === 'G' || u === 'ML') ? i.qty / 1000 : i.qty);
                }, 0);
                if (baseKg <= 0) { hasError = true; return; }
                const scaleFactor = reqKg / baseKg;
                let fName = 'Current Formulation';
                if (fId) { const f = DB.formulations.find(x => x.id === fId); if (f) fName = f.productName + (f.productCode ? ' (' + f.productCode + ')' : ''); }
                products.push({ name: fName, reqKg, baseKg, scaleFactor, baseItems });
            });

            if (hasError || products.length === 0) {
                resultEl.innerHTML = '<div class="alert alert-error">Please enter valid required quantities for all products.</div>';
                return;
            }

            // Aggregate RM totals across all products
            const rmTotals = {};// rmId -> {name, code, unit, totalQty, totalCost}
            let grandCost = 0, grandKg = 0;

            products.forEach(p => {
                p.baseItems.forEach(item => {
                    const rm = getRMById(item.rmId); if (!rm) return;
                    const u = (item.unit || rm.unit || 'KG').toUpperCase();
                    const scaledQty = item.qty * p.scaleFactor;
                    const scaledKg = (u === 'G' || u === 'ML') ? scaledQty / 1000 : scaledQty;
                    const rate = (item.rate !== undefined && item.rate !== null) ? item.rate : (rm.rate || 0);
                    const cost = scaledKg * rate;
                    if (!rmTotals[item.rmId]) rmTotals[item.rmId] = { name: rm.name, code: rm.code, unit: u, totalQtyKg: 0, totalCost: 0, perProduct: {} };
                    rmTotals[item.rmId].totalQtyKg += scaledKg;
                    rmTotals[item.rmId].totalCost += cost;
                    rmTotals[item.rmId].perProduct[p.name] = (rmTotals[item.rmId].perProduct[p.name] || 0) + scaledQty;
                });
                grandKg += p.reqKg;
            });

            Object.values(rmTotals).forEach(r => { grandCost += r.totalCost; });
            const grandPkg = (DB.packagingCost || 0) * grandKg;
            const grandTotal = grandCost + grandPkg;
            const costPerKg = grandKg > 0 ? grandTotal / grandKg : 0;

            // Build product breakdown
            let prodBreakdown = '';
            products.forEach(p => {
                prodBreakdown += `<div style="display:inline-flex;align-items:center;gap:8px;background:var(--accent-light);border:1px solid #bfdbfe;border-radius:8px;padding:6px 14px;margin-right:8px;margin-bottom:6px;">
      <span style="font-size:11px;font-weight:700;color:var(--accent2);">${p.name}</span>
      <span style="font-size:11px;color:var(--text3);">${p.reqKg} KG</span>
      <span style="font-size:10px;color:var(--text3);">(×${p.scaleFactor.toFixed(3)})</span>
    </div>`;
            });

            // Build RM table
            let rmRows = '';
            Object.values(rmTotals).forEach(r => {
                const displayQty = r.unit === 'G' ? `${(r.totalQtyKg * 1000).toFixed(1)} G` : `${r.totalQtyKg.toFixed(3)} KG`;
                rmRows += `<tr>
      <td class="td-primary" style="padding:8px 10px;">${r.name}</td>
      <td class="mono" style="padding:8px 10px;font-size:11px;color:var(--text3);">${r.code}</td>
      <td style="padding:8px 10px;font-weight:700;">${displayQty}</td>
      ${can('viewCost') ? `<td class="cost-tag" style="padding:8px 10px;">${fmtCurrency(r.totalCost)}</td>` : ''}
    </tr>`;
            });

            resultEl.innerHTML = `
    <div style="background:var(--bg2);border:1.5px solid var(--border);border-radius:12px;overflow:hidden;">
      <div style="background:#0f172a;padding:14px 18px;">
        <div style="font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;">Scaling For</div>
        <div style="display:flex;flex-wrap:wrap;">${prodBreakdown}</div>
      </div>
      <div style="padding:14px 18px;">
        <table class="scaler-result-table">
          <thead><tr><th>Raw Material</th><th>Code</th><th>Total Required</th>${can('viewCost') ? '<th>Total Cost</th>' : ''}</tr></thead>
          <tbody>${rmRows}</tbody>
          <tfoot>
            <tr class="scaler-total-row">
              <td colspan="2" style="padding:10px;">TOTAL — ${grandKg.toFixed(2)} KG production</td>

        let formItemCount = 0;
        // ── Draft persistence: remembers form data across page navigation ──
        let _formDraft = null;

        // ─────────────────────────────────────────────────────────────────────────────
        //  Batch Number searchable dropdown — body-appended portal

        let _batchDropOpen = false;

        function _fmBatchGetAll() {
            const seen = new Set(); const list = [];
            [...DB.formulations].sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || '')).forEach(f => {
                const b = (f.batchNo || '').trim();
                if (b && !seen.has(b)) { seen.add(b); list.push({ batchNo: b, productName: f.productName || '', productCode: f.productCode || '', mfgDate: (f.mfgDate || '').slice(0, 10) }); }
            });
            return list;
        }

        function _batchDropEnsure() {
            if (document.getElementById('_batch-drop-portal')) return;
            const div = document.createElement('div');
            div.id = '_batch-drop-portal';
            div.style.cssText = 'display:none;position:fixed;z-index:99999;background:var(--card);border:1.5px solid var(--accent);border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,0.22);max-height:280px;overflow-y:auto;min-width:260px;';
            div.innerHTML = '<div id="_batch-drop-list"></div>';

                const drop = document.getElementById('_batch-drop-portal');
                if (drop && !drop.contains(e.target)) {
                    const i1 = document.getElementById('fm-batch-search');
                    const i2 = document.getElementById('ebc-batch-search');
                    if (e.target !== i1 && e.target !== i2) _fmBatchClose();
                }
            });

        function _batchDropPosition(inputEl) {
            const drop = document.getElementById('_batch-drop-portal'); if (!drop || !inputEl) return;

        }

        function _batchDropRender(items, q, target) {
            const listEl = document.getElementById('_batch-drop-list'); if (!listEl) return;
            let html = '';
            if (q && q.trim()) {
                const safe = q.trim().replace(/\\/g, '\\\\').replace(/'/g, "\\'");

                html += `<div style="padding:16px;color:var(--text3);font-size:13px;text-align:center;">${q ? 'No matching batch found' : 'No existing batch numbers yet'}</div>`;
            } else {
                items.forEach(item => {
                    const safe = item.batchNo.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
                    html += `<div onmousedown="_fmBatchSelect('${safe}',false,'${target}')" style="display:flex;align-items:center;justify-content:space-between;padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--border);" onmouseover="this.style.background='var(--bg3)'" onmouseout="this.style.background=''"><div style="min-width:0;"><div style="font-size:13px;font-weight:700;color:var(--text)">${_esc(item.batchNo)}</div><div style="font-size:11px;color:var(--text3);">${_esc(item.productName)}${item.productCode ? ' · ' + _esc(item.productCode) : ''}${item.mfgDate ? ' · ' + item.mfgDate : ''}</div></div><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--text3)" stroke-width="2.5" style="flex-shrink:0;margin-left:8px"><polyline points="9 18 15 12 9 6"/></svg></div>`;

            _batchDropEnsure();

            _batchDropPosition(anchor);
            const q = anchor ? anchor.value : '';
            const all = _fmBatchGetAll(); const ql = q.toLowerCase().trim();
            const filtered = ql ? all.filter(x => x.batchNo.toLowerCase().includes(ql) || x.productName.toLowerCase().includes(ql)) : all;
            _batchDropRender(filtered, q, _batchDropTarget);
            const drop = document.getElementById('_batch-drop-portal');
            if (drop) drop.style.display = 'block';

        function _fmBatchFilter(q) {
            const hiddenId = _batchDropTarget === 'ebc' ? 'ebc-batch' : 'fm-batch';
            const hidden = document.getElementById(hiddenId); if (hidden) hidden.value = q;
            if (_batchDropTarget === 'fm') _saveFormDraft();
            _batchDropEnsure();
            const anchor = document.getElementById(_batchDropTarget === 'ebc' ? 'ebc-batch-search' : 'fm-batch-search');
            _batchDropPosition(anchor);
            const all = _fmBatchGetAll(); const ql = q.toLowerCase().trim();
            const filtered = ql ? all.filter(x => x.batchNo.toLowerCase().includes(ql) || x.productName.toLowerCase().includes(ql)) : all;
            _batchDropRender(filtered, q, _batchDropTarget);
            const drop = document.getElementById('_batch-drop-portal');
            if (drop) drop.style.display = 'block';
            _batchDropOpen = true;
            const hintId = _batchDropTarget === 'ebc' ? 'ebc-batch-hint' : 'fm-batch-hint';
            const hint = document.getElementById(hintId);
            if (hint) hint.textContent = filtered.length ? `${filtered.length} batch${filtered.length > 1 ? 'es' : ''} found — click to select` : q ? 'No match — will be a new batch number' : 'Type to search or scroll to browse';

        function _fmBatchToggle() {
            if (_batchDropOpen) { _fmBatchClose(); }

        function _fmBatchClose() {
            const drop = document.getElementById('_batch-drop-portal'); if (drop) drop.style.display = 'none'; _batchDropOpen = false;
        }

        function _fmBatchSelect(batchNo, isNew, target) {
            target = target || _batchDropTarget || 'fm';
            const searchEl = document.getElementById(target === 'ebc' ? 'ebc-batch-search' : 'fm-batch-search');
            const hiddenEl = document.getElementById(target === 'ebc' ? 'ebc-batch' : 'fm-batch');
            const hintEl = document.getElementById(target === 'ebc' ? 'ebc-batch-hint' : 'fm-batch-hint');
            if (searchEl) searchEl.value = batchNo;
            if (hiddenEl) hiddenEl.value = batchNo;
            if (target === 'fm') _saveFormDraft();
            _fmBatchClose();
            if (hintEl) {
                if (isNew) { hintEl.innerHTML = `<span style="color:var(--green);font-weight:700;">✚ New batch: ${_esc(batchNo)}</span>`; }
                else {
                    const used = DB.formulations.filter(f => (f.batchNo || '').trim() === batchNo);
                    const names = [...new Set(used.map(f => f.productName))].slice(0, 3).join(', ');
                    hintEl.innerHTML = `<span style="color:var(--accent2);font-weight:700;">♻ Reusing: ${_esc(batchNo)}</span>` + (names ? ` &nbsp;·&nbsp; <span style="color:var(--text3)">Used for: ${_esc(names)}</span>` : '');
