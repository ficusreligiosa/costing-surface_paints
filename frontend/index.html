        function _saveFormDraft() {
            const pname = document.getElementById('fm-pname')?.value || '';
            const pcode = document.getElementById('fm-pcode')?.value || '';
            const batch = document.getElementById('fm-batch')?.value || '';
            const remarks = document.getElementById('fm-remarks')?.value || '';
            const refNo = document.getElementById('fm-refno')?.value || '';
            const productType = document.getElementById('fm-ptype')?.value || '';
            const productFinish = document.getElementById('fm-pfinish')?.value || '';
            const items = [];
            document.querySelectorAll('[id^="fitem-"]').forEach(row => {
                const id = row.id;
                const rmId = parseInt(document.getElementById('sel-' + id)?.value) || 0;
                const qty = parseFloat(document.getElementById('qty-' + id)?.value) || 0;
                const unit = document.getElementById('fmunit-' + id)?.value || 'KG';
                const rateEl = document.getElementById('rate-' + id);
                const rate = rateEl ? parseFloat(rateEl.value) || 0 : 0;
                const labelEl = document.getElementById('rmsearch-' + id);
                const label = labelEl ? labelEl.value : '';
                items.push({ rmId, qty, unit, rate, label });
            });
            _formDraft = { pname, pcode, batch, remarks, refNo, productType, productFinish, items };
        }

        function _clearFormDraft() {
            _formDraft = null;
            toast('Form data cleared ✓', 'info');
            closeModal('form-modal');
            openNewFormModal(null, true);
        }

        function addFormItem(preRmId = null, preQty = null, preUnit = null, preRate = null) {
            formItemCount++;
            const id = 'fitem-' + formItemCount;
            const preRM = preRmId ? DB.rawMaterials.find(r => r.id === preRmId) : null;
            const defaultUnit = preUnit || (preRM ? preRM.unit : 'KG');
            const defaultRate = preRate !== null ? preRate : (preRM ? preRM.rate : 0);
            const preLabel = preRM ? `${preRM.name} (${preRM.code})` : '';
            const showCostCol = can('viewCost');

            // All units for paint/manufacturing companies
            const allUnits = ['KG', 'G', 'LTR', 'ML', 'NOS', 'PCS', 'MTR', 'CM', 'MM', 'BOX', 'BAG', 'DRUM'];
            const unitOpts = allUnits.map(u => `<option value="${u}" ${u === defaultUnit ? 'selected' : ''}>${u}</option>`).join('');

            document.getElementById('fm-items').insertAdjacentHTML('beforeend', `
    <div class="fi-row ${showCostCol ? '' : 'no-cost'}" id="${id}">
      <div class="rm-search-wrap" style="position:relative;">
        <input class="rm-search-input" id="rmsearch-${id}" placeholder="🔍 Search raw material..." 
          value="${preLabel}" autocomplete="off"
          oninput="filterRMDropdown('${id}');_saveFormDraft()"
          onfocus="openRMDropdown('${id}')"
          onkeydown="handleRMDropdownKey(event,'${id}')">
        <div class="rm-dropdown" id="rmdrop-${id}"></div>
        <input type="hidden" id="sel-${id}" value="${preRmId || ''}">
        <input type="hidden" id="baserate-${id}" value="${defaultRate}">
      </div>
      <input class="form-control" id="qty-${id}" type="number" step="0.001" min="0" value="${preQty || ''}" placeholder="Qty" oninput="updateFmLiveTotal();_saveFormDraft()">
      <select class="form-control" id="fmunit-${id}" style="padding:10px 6px;font-size:12px;" onchange="updateFmLiveTotal();_saveFormDraft()">${unitOpts}</select>
      ${showCostCol ? `<input class="fi-rate" id="rate-${id}" type="number" step="0.01" min="0" value="${defaultRate || ''}" placeholder="Rate" title="Edit rate for this batch" oninput="onRateInput('${id}');updateFmLiveTotal();_saveFormDraft()">` : ''}
      ${showCostCol ? `<span class="fi-cost" id="ficost-${id}">—</span>` : ''}
      <button class="remove-btn" onclick="document.getElementById('${id}').remove();updateFmLiveTotal();_saveFormDraft()">−</button>
    </div>`);

            if (!preRmId) openRMDropdown(id);
            updateFmLiveTotal();
        }

        // Highlight rate field yellow when user edits it away from default
        function onRateInput(id) {
            const rateEl = document.getElementById('rate-' + id);
            const baseRate = parseFloat(document.getElementById('baserate-' + id)?.value) || 0;
            if (!rateEl) return;
            const currentRate = parseFloat(rateEl.value) || 0;
            if (currentRate !== baseRate) {
                rateEl.classList.add('fi-rate-changed');
                rateEl.title = '⚠ Rate changed from default ₹' + baseRate;
            } else {
                rateEl.classList.remove('fi-rate-changed');
                rateEl.title = 'Edit rate for this batch';
            }
        }

        function updateFmLiveTotal() {
            let totalKg = 0, totalG = 0, totalCost = 0, lineCount = 0;
            document.querySelectorAll('[id^="fitem-"]').forEach(row => {
                const id = row.id;
                const rmId = parseInt(document.getElementById('sel-' + id)?.value) || 0;
                const qty = parseFloat(document.getElementById('qty-' + id)?.value) || 0;
                const unit = (document.getElementById('fmunit-' + id)?.value || 'KG').toUpperCase();
                const rm = getRMById(rmId);
                const rateEl = document.getElementById('rate-' + id);
                const rate = rateEl ? parseFloat(rateEl.value) || 0 : (rm ? rm.rate || 0 : 0);
                if (unit === 'G' || unit === 'ML') totalG += qty; else totalKg += qty;
                lineCount++;
                if (rm && can('viewCost')) {
                    // cost: if G, rate is per KG so convert
                    const qtyKg = (unit === 'G' || unit === 'ML') ? qty / 1000 : qty;
                    const lineCost = qtyKg * rate;
                    totalCost += lineCost;
                    const costEl = document.getElementById('ficost-' + id);
                    if (costEl) costEl.textContent = qty > 0 ? fmtCurrency(lineCost) : '—';
                }
            });
            const totalQtyKg = totalKg + (totalG / 1000);
            const qtyLabel = `${totalQtyKg.toFixed(3)} KG`;
            const panel = document.getElementById('fm-live-total');
            if (!panel) return;
            if (can('viewCost')) {
                const totalWithPkg = totalCost + (DB.packagingCost || 0) * totalQtyKg;
                const costPerKg = totalQtyKg > 0 ? totalWithPkg / totalQtyKg : 0;
                panel.innerHTML = `
      <div class="fm-lt-item"><div class="fm-lt-label">Materials Added</div><div class="fm-lt-value">${lineCount}</div></div>
      <div class="fm-lt-item"><div class="fm-lt-label">Total Qty</div><div class="fm-lt-value amber" style="font-size:13px;">${qtyLabel}</div></div>
      <div class="fm-lt-item"><div class="fm-lt-label">RM Cost</div><div class="fm-lt-value green">${fmtCurrency(totalCost)}</div></div>
      <div class="fm-lt-item"><div class="fm-lt-label">+Packaging</div><div class="fm-lt-value green">${fmtCurrency(totalWithPkg)}</div></div>
      <div class="fm-lt-item" style="border-left:2px solid #fbbf24;padding-left:14px;"><div class="fm-lt-label" style="color:#fbbf24;font-size:11px;font-weight:800;">COST / KG</div><div style="font-size:30px;font-weight:900;color:#fbbf24;font-family:'JetBrains Mono',monospace;letter-spacing:-1px;line-height:1;">${totalQtyKg > 0 ? fmtCurrency(costPerKg) : '—'}</div></div>`;
            } else {
                panel.innerHTML = `
      <div class="fm-lt-item"><div class="fm-lt-label">Materials Added</div><div class="fm-lt-value">${lineCount}</div></div>
      <div class="fm-lt-item"><div class="fm-lt-label">Total Qty</div><div class="fm-lt-value amber" style="font-size:13px;">${qtyLabel}</div></div>
      <div class="fm-lt-item"><div class="fm-lt-label">Status</div><div class="fm-lt-value" style="color:#34d399;font-size:12px;">${lineCount > 0 ? '✓ Ready' : 'Add items'}</div></div>`;
            }
        }

        function openRMDropdown(id) {
            const input = document.getElementById('rmsearch-' + id);
            const q = (input?.value || '').toLowerCase();
            renderRMDropdown(id, q);
            document.getElementById('rmdrop-' + id)?.classList.add('open');
            // Close other dropdowns
            document.querySelectorAll('.rm-dropdown.open').forEach(d => { if (d.id !== 'rmdrop-' + id) d.classList.remove('open'); });

        function filterRMDropdown(id) {
            const q = (document.getElementById('rmsearch-' + id)?.value || '').toLowerCase();
            renderRMDropdown(id, q);
            document.getElementById('rmdrop-' + id)?.classList.add('open');
        }

        function renderRMDropdown(id, q) {
            const drop = document.getElementById('rmdrop-' + id);
            if (!drop) return;
            const filtered = DB.rawMaterials.filter(r =>
                r.name.toLowerCase().includes(q) || r.code.toLowerCase().includes(q) ||
                (r.supplier && r.supplier.toLowerCase().includes(q))
            );
            if (filtered.length === 0) {
                drop.innerHTML = `<div class="rm-dropdown-empty">No materials found for "${q}"</div>`;
            } else {
                drop.innerHTML = filtered.map(r =>
                    `<div class="rm-dropdown-item" data-rmid="${r.id}" data-rmname="${r.name}" data-rmcode="${r.code}" data-rmunit="${r.unit}"
         onclick="selectRM('${id}',${r.id},'${r.name.replace(/'/g, "\\'")}','${r.code}','${r.unit}')">
         <span>${r.name}</span><span class="rm-code">${r.code} · ${r.unit}${can('viewCost') && r.rate ? ' · <strong style="color:var(--accent2)">₹' + r.rate + '</strong>' : ''}</span>
       </div>`
                ).join('');
            }
        }

        function selectRM(id, rmId, rmName, rmCode, rmUnit) {
            // Works for both formulation items (sel-) and CA items (casel-)
            const hiddenFm = document.getElementById('sel-' + id);
            const hiddenCA = document.getElementById('casel-' + id);
            if (hiddenFm) hiddenFm.value = rmId;
            if (hiddenCA) hiddenCA.value = rmId;
            document.getElementById('rmsearch-' + id).value = `${rmName} (${rmCode})`;
            // Set the unit dropdown if it exists (formulation modal)
            const unitSel = document.getElementById('fmunit-' + id);
            if (unitSel && rmUnit) {
                unitSel.value = rmUnit;
                if (!unitSel.value) unitSel.value = 'KG'; // fallback
            }
            // Legacy unit span (fallback)
            const unitEl = document.getElementById('unit-' + id);
            if (unitEl) unitEl.textContent = rmUnit;
            // ── Populate editable rate field with RM's current rate ──
            const rm = getRMById(rmId);
            const rateEl = document.getElementById('rate-' + id);
            const baseRateEl = document.getElementById('baserate-' + id);
            if (rateEl && rm) {
                rateEl.value = rm.rate || 0;
                rateEl.classList.remove('fi-rate-changed');
                rateEl.title = 'Edit rate for this batch';
            }
            if (baseRateEl && rm) baseRateEl.value = rm.rate || 0;
            document.getElementById('rmdrop-' + id)?.classList.remove('open');
            // Focus qty field (either naming convention)
            const qtyEl = document.getElementById('qty-' + id) || document.getElementById('caqty-' + id);
            qtyEl?.focus();
            // Update live total and save draft
            if (typeof updateFmLiveTotal === 'function') updateFmLiveTotal();
            if (typeof _saveFormDraft === 'function') _saveFormDraft();
        }

        function handleRMDropdownKey(e, id) {
            const drop = document.getElementById('rmdrop-' + id);
            const items = [...drop.querySelectorAll('.rm-dropdown-item')];
            const hi = drop.querySelector('.highlighted');
            let idx = items.indexOf(hi);
            if (e.key === 'ArrowDown') { e.preventDefault(); if (hi) hi.classList.remove('highlighted'); items[Math.min(idx + 1, items.length - 1)]?.classList.add('highlighted'); }
            else if (e.key === 'ArrowUp') { e.preventDefault(); if (hi) hi.classList.remove('highlighted'); items[Math.max(idx - 1, 0)]?.classList.add('highlighted'); }
            else if (e.key === 'Enter' && hi) { e.preventDefault(); hi.click(); }
            else if (e.key === 'Escape') { drop.classList.remove('open'); }
        }

        // Close dropdowns on outside click
        document.addEventListener('click', e => {

        function saveFormulation() {
            const pname = document.getElementById('fm-pname').value.trim();
            const pcode = document.getElementById('fm-pcode').value.trim();
            const batch = document.getElementById('fm-batch').value.trim();
            const mfgDateTime = nowDateTime();
            const remarks = document.getElementById('fm-remarks').value.trim();
            const refNo = document.getElementById('fm-refno')?.value.trim() || '';
            const productType = document.getElementById('fm-ptype')?.value || '';
            const productFinish = document.getElementById('fm-pfinish')?.value || '';
            // v3.8: Auto-lookup partyId + partyName from Sheet2 using refNo
            let resolvedPartyId = '', resolvedPartyName = '';
            if (refNo && DB.partyLookup && DB.partyLookup.length) {
                const _pm = DB.partyLookup.find(p => String(p.refNo || '').trim().toLowerCase() === refNo.trim().toLowerCase());
                if (_pm) { resolvedPartyId = String(_pm.partyId || '').trim(); resolvedPartyName = String(_pm.partyName || '').trim(); }
            }
            const lots = 1;  // lots removed from new formulation form; always saved as 1
            // Formulation save NEVER debits inventory anymore.
            // Inventory debit is a separate explicit action by Sudhir Ji via the Debit button.

            if (!pname) { toast('Product Name is required', 'error'); return; }

            const items = [];
            document.querySelectorAll('[id^="fitem-"]').forEach(row => {
                const id = row.id;
                const rmId = parseInt(document.getElementById('sel-' + id).value);
                const baseQty = parseFloat(document.getElementById('qty-' + id).value);
                const unit = document.getElementById('fmunit-' + id)?.value || 'KG';
                const rateEl = document.getElementById('rate-' + id);
                const rm = getRMById(rmId);
                const rate = rateEl ? parseFloat(rateEl.value) || 0 : (rm ? rm.rate || 0 : 0);
                if (rmId && baseQty > 0) items.push({ rmId, qty: baseQty * lots, unit, rate });
            });
            if (items.length === 0) { toast('Add at least one raw material', 'error'); return; }

            // v3.5 FIX-ID: Send id:0 — GAS assigns the real ID under LockService and returns {newId}.
            // We do NOT push to DB.formulations here; we do it in the .then() after server confirms.
            const f = { id: 0, productName: pname, productCode: pcode, productType, productFinish, batchNo: batch, mfgDate: mfgDateTime, remarks, refNo, partyId: resolvedPartyId, partyName: resolvedPartyName, by: currentUser.username, byName: currentUser.name, createdAt: mfgDateTime, lots, inventoryDebited: false, inventoryPartialDebit: false, skippedDebitRmIds: [], debitRemarks: '', items };

            const saveBtn = document.querySelector('#form-modal .btn-primary');
            if (saveBtn) { saveBtn.disabled = true; saveBtn.innerHTML = '<div class="spinner" style="width:14px;height:14px;border-color:#fff3;border-top-color:#fff;display:inline-block;vertical-align:middle;margin-right:6px;"></div>Saving…'; }

            // Show animated save overlay
            showSaveOverlay();

            gasCall('saveFormulation', { formulation: f, items, inventoryUpdates: [], transactions: [], debitInventory: false })
                .then(res => {
                    // v3.5 FIX-ID: Server returns the real locked ID — update f and push to DB now
                    if (res && res.newId) {
                        f.id = Number(res.newId);
                        if (DB.nextId.formulation <= f.id) DB.nextId.formulation = f.id + 1;
                    }
                    DB.formulations.push(f);
                    sovAdvance(1);
                    return gasCall('addAudit', { entry: auditEntry });
                })
                .then(() => {
                    sovAdvance(2);
                    return gasCall('saveSetting', { key: 'nextId', value: JSON.stringify(DB.nextId) });
                })
                .then(() => {
                    return loadFromGAS();
                })
                .then(() => {
                    sovSuccess();
                    hideSaveOverlay(1800);
                    setTimeout(() => {
                        _formDraft = null;
                        closeModal('form-modal');

        function saveCostAnalysis() {
            const name = document.getElementById('ca-name')?.value.trim();
            const productRef = document.getElementById('ca-pref')?.value.trim();
            const batchSize = parseFloat(document.getElementById('ca-bsize')?.value) || 0;
            const lots = parseInt(document.getElementById('ca-lots')?.value) || 1;
            const notes = document.getElementById('ca-notes')?.value.trim();
            if (!name) { toast('Analysis Name is required', 'error'); return; }
            if (!batchSize) { toast('Batch size is required', 'error'); return; }
            const items = _getCAItems();
            if (items.length === 0) { toast('Add at least one material', 'error'); return; }
            let rmCost = 0;
            items.forEach(item => { const rm = getRMById(item.rmId); if (rm) rmCost += item.qty * lots * rm.rate; });
            const totalQty = batchSize * lots;
            const totalPackaging = (DB.packagingCost || 0) * totalQty;
            const totalCost = rmCost + totalPackaging;
            const rec = {
                id: DB.nextId.ca++,
                name, productRef, batchSize, lots, notes, items,
                rmCost, packagingCost: totalPackaging, totalCost, costPerKg: totalCost / totalQty,
                savedBy: currentUser.name, savedAt: nowDateTime()
            };
            DB.costAnalysisRecords.push(rec);
            addAudit('Saved cost analysis', `${name} — ${fmtCurrency(totalCost)}`);
            closeModal('ca-modal');
            toast('Cost analysis saved ✓', 'success');
            navigate('costanalysis');

        function exportSingleCostAnalysis(id) {

                data.push([rm.name, rm.code, rm.unit, item.qty, rec.lots || 1, effQty, rm.rate, (effQty * rm.rate).toFixed(2)]);

            data.push(['', '', '', '', '', '', 'TOTAL', rec.totalCost.toFixed(2)]);

            dlExcel(data, `CostAnalysis_${rec.name.replace(/\s+/g, '_')}`);

        function previewBulkImport(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (e) {
                const wb = XLSX.read(e.target.result, { type: 'array' });
                const ws = wb.Sheets[wb.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(ws, { header: 1 });
                if (rows.length < 2) { document.getElementById('bulk-preview').innerHTML = '<div class="alert alert-error">File is empty or invalid.</div>'; return; }
                const headers = rows[0].map(h => String(h).trim());
                const required = ['Name', 'Code', 'Unit', 'Rate (₹)', 'Supplier'];
                const missing = required.filter(r => !headers.includes(r));
                if (missing.length > 0) {
                    document.getElementById('bulk-preview').innerHTML = `<div class="alert alert-error">Missing columns: ${missing.join(', ')}. Please check your file headers.</div>`;
                    return;
                }
                const nameIdx = headers.indexOf('Name'), codeIdx = headers.indexOf('Code'), unitIdx = headers.indexOf('Unit'), rateIdx = headers.indexOf('Rate (₹)'), supplierIdx = headers.indexOf('Supplier');
                window._bulkImportData = [];
                let previewHTML = `<div class="card-title">Preview (${rows.length - 1} rows)</div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Code</th><th>Unit</th><th>Rate</th><th>Supplier</th><th>Status</th></tr></thead><tbody>`;
                rows.slice(1).forEach(row => {
                    const name = String(row[nameIdx] || '').trim();
                    const code = String(row[codeIdx] || '').trim();
                    const unit = String(row[unitIdx] || 'KG').trim();
                    const rate = parseFloat(row[rateIdx]);
                    const rateFinal = isNaN(rate) ? 0 : rate;
                    const supplier = String(row[supplierIdx] || '').trim();
                    if (!name || !code) { previewHTML += `<tr><td colspan="6" style="color:var(--red);">Skipping invalid row</td></tr>`; return; }
                    const exists = DB.rawMaterials.find(r => r.code === code);
                    const status = exists ? '<span class="status-pill status-low">UPDATE</span>' : '<span class="status-pill status-ok">NEW</span>';
                    window._bulkImportData.push({ name, code, unit, rate: rateFinal, supplier });
                    previewHTML += `<tr><td class="td-primary">${name}</td><td class="mono" style="font-size:11px;">${code}</td><td>${unit}</td><td class="cost-tag">${fmtCurrency(rateFinal)}</td><td>${supplier}</td><td>${status}</td></tr>`;
                });
                previewHTML += `</tbody></table></div>`;
                document.getElementById('bulk-preview').innerHTML = previewHTML;
                document.getElementById('bulk-import-btn').style.display = 'flex';
            };
            reader.readAsArrayBuffer(file);
        }

        async function confirmBulkImport() {
            if (!window._bulkImportData.length) { toast('No data to import', 'error'); return; }

            const btn = document.getElementById('bulk-import-btn');
            if (btn) { btn.disabled = true; btn.innerHTML = '<div class="spinner" style="width:14px;height:14px;border-color:#fff3;border-top-color:#fff"></div> Saving...'; }

            let added = 0, updated = 0;
            const toSave = [];

            window._bulkImportData.forEach(item => {
                const exists = DB.rawMaterials.find(r => r.code === item.code);
                if (exists) {
                    Object.assign(exists, { name: item.name, unit: item.unit, rate: item.rate, supplier: item.supplier, updatedDate: nowDate() });
                    toSave.push({ rm: exists, isNew: false });
                    updated++;
                } else {
                    const newRMId2 = DB.nextId.rm++;
                    const newRM = { id: newRMId2, name: item.name, code: item.code, unit: item.unit, rate: item.rate, supplier: item.supplier, updatedDate: nowDate(), minStock: 0, category: item.category || '' };
                    DB.rawMaterials.push(newRM);
                    DB.inventory.push({ id: newRMId2, rmId: newRMId2, quantity: 0 });
                    toSave.push({ rm: newRM, isNew: true });
                    added++;
                }
            });

            addAudit('Bulk import raw materials', `${added} added, ${updated} updated`);
            closeModal('bulk-modal');
            toast(`Saving ${toSave.length} materials to database...`, 'info');

            let saved = 0, failed = 0;
            for (const entry of toSave) {
                try {
                    await gasCall('saveRawMaterial', { rm: entry.rm, isNew: entry.isNew });
                    saved++;
                } catch (e) { console.error('Bulk save failed for', entry.rm.code, e); failed++; }
            }

            await gasCall('addAudit', { entry: DB.auditLog[0] });

            if (failed === 0) {
                toast(`All ${saved} materials saved to database`, 'success');
            } else {
                toast(`${saved} saved, ${failed} failed — check database connection`, 'error');
            }

            navigate('rawmaterials');
        }

            DB.rawMaterials.splice(DB.rawMaterials.findIndex(r => r.id === id), 1);

            addAudit('Deleted raw material', rm.code + ' — ' + rm.name);

        function saveRM(id) {
            const name = document.getElementById('rm-name').value.trim();
            const code = document.getElementById('rm-code').value.trim();
            const unit = document.getElementById('rm-unit').value;
            const rateEl = document.getElementById('rm-rate');
            const rate = currentUser.role === 'inventory' ? (getRMById(id)?.rate || 0) : (parseFloat(rateEl.value) || 0);
            const supplierEl = document.getElementById('rm-supplier');
            const supplier = supplierEl ? supplierEl.value.trim() : (getRMById(id)?.supplier || '');
            const updatedDate = document.getElementById('rm-updated').value;
            const minStockEl = document.getElementById('rm-minstock');
            const minStock = minStockEl ? (isNaN(parseInt(minStockEl.value, 10)) ? 0 : parseInt(minStockEl.value, 10)) : (getRMById(id)?.minStock || 0);
            const categoryEl = document.getElementById('rm-category');
            const category = categoryEl ? categoryEl.value : (getRMById(id)?.category || '');
            const expiryDateEl = document.getElementById('rm-expiry');
            const expiryDate = expiryDateEl ? expiryDateEl.value.trim() : (getRMById(id)?.expiryDate || '');
            if (!name || !code) { toast('Name and Code are required', 'error'); return; }
            // rate can be 0 (allowed) — only block if field is completely empty/NaN
            if (currentUser.role !== 'inventory' && isNaN(parseFloat(rateEl?.value))) { toast('Rate is required — enter 0 if free', 'error'); return; }
            // Disable save button to prevent double-clicks
            const saveBtn = document.getElementById('rm-save-btn');
            if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = 'Saving…'; }

            if (id) {
                const rm = DB.rawMaterials.find(r => r.id === id);
                const oldName = rm.name;
                // Update in memory first so UI feels instant
                rm.name = name; rm.code = code; rm.unit = unit; rm.rate = rate;
                rm.supplier = supplier; rm.updatedDate = updatedDate; rm.minStock = minStock; rm.category = category; rm.expiryDate = expiryDate;
                const rmForGAS = { id: rm.id, name: name, code: code, unit: unit, rate: rate, supplier: supplier, updatedDate: updatedDate, minStock: minStock, category: category, expiryDate: expiryDate };
                const detail = `${code} — ${name}${oldName !== name ? ' (renamed from ' + oldName + ')' : ''}`;
                addAudit('Updated raw material', detail);
                gasCall('saveRawMaterial', { rm: rmForGAS, isNew: false })
                    .then(res => { if (res && res.newId) rm.id = Number(res.newId); return gasCall('addAudit', { entry: DB.auditLog[0] }); })
                    .then(() => { toast('Material updated ✓', 'success'); closeModal('rm-modal'); navigate('rawmaterials'); })
                    .catch(err => { toast('Save failed — ' + err.message, 'error'); if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = 'Save'; } });
            } else {
                const newRMId = DB.nextId.rm++;
                const newRM = { id: newRMId, name: name, code: code, unit: unit, rate: rate, supplier: supplier, updatedDate: updatedDate, minStock: minStock, category: category, expiryDate: expiryDate };
                DB.rawMaterials.push(newRM);
                DB.inventory.push({ id: newRMId, rmId: newRMId, quantity: 0 });
                addAudit('Added raw material', `${code} — ${name}`);
                gasCall('saveRawMaterial', { rm: newRM, isNew: true })
                    .then(res => {
                        // v3.7: sync the GAS-assigned ID back to local DB (locks prevent skips)
                        if (res && res.newId) {
                            newRM.id = Number(res.newId);
                            const inv = DB.inventory.find(i => i.rmId === newRMId);
                            if (inv) { inv.id = Number(res.newId); inv.rmId = Number(res.newId); }
                        }
                        return gasCall('addAudit', { entry: DB.auditLog[0] });
                    })
                    .then(() => { toast('Material saved ✓', 'success'); closeModal('rm-modal'); navigate('rawmaterials'); })
                    .catch(err => {
                        toast('Save failed — ' + err.message, 'error');
                        DB.rawMaterials.pop();
                        DB.inventory.pop();
                        DB.nextId.rm--;
                        if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = 'Save'; }
                    });
            }
        }

        // ════════════════════════════════════════════════════════
        //  INVENTORY  (inventory user: limited columns, no pricing)
        // ════════════════════════════════════════════════════════
        function renderInventory() {
            const isInvUser = currentUser.role === 'inventory';

            const canSubtract = can('subtractStock');

            const _alertTotal = _critCount + _expCount;
            const tabs = `<div class="tabs">

    </div>
    ${can('editPrice') || canAdd || canSubtract ? `<div class="tab" id="tab-adjust" onclick="switchInvTab('adjust')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg> Adjust

    <div class="tab" id="tab-alerts" onclick="switchInvTab('alerts')" style="position:relative;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> Alerts${_alertTotal > 0 ? `<span style="position:absolute;top:4px;right:4px;background:#ef4444;color:#fff;border-radius:999px;font-size:9px;font-weight:800;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 3px;line-height:1;">${_alertTotal}</span>` : ''}
    </div>
  </div>`;
            return tabs + `<div id="inv-tab-content">${renderStockTab()}</div>`;
        }

        function renderStockTab() {
            const isInvUser = currentUser.role === 'inventory';
            let t = `<div class="card">
  <div class="page-header" style="margin-bottom:16px;">
    <div class="card-title" style="margin:0;">${NAV_ICONS.inventory} Stock Levels</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn btn-success btn-sm" onclick="exportInventoryExcel()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Export Excel
      </button>
      ${can('editPrice') || can('addStock') ? `<button class="btn btn-primary btn-sm" onclick="openStockModal()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add Stock
      </button>`: ''}
    </div>
  </div>`;

            // Search bar
            t += `<div class="search-filter-bar">
    <div class="search-input-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search-input" id="inv-search" placeholder="Search materials..." oninput="filterTable('inv-search','inv-main-table')">
    </div>
    <select class="filter-select" id="inv-filter-status" onchange="filterInvByStatus()">
      <option value="">All Status</option>
      <option value="ok">OK</option>
      <option value="low">Low</option>
      <option value="out">Out of Stock</option>

  </div>`;

            t += `<div class="table-wrap"><table id="inv-main-table">
  <thead><tr><th>Material</th><th>Code</th><th>Unit</th><th>Available Qty</th><th>Min Stock</th><th>Status</th><th>Last Updated</th>${can('viewPrice') ? '<th>Rate</th><th>Stock Value</th>' : ''}</tr></thead><tbody>`;
            DB.rawMaterials.forEach(rm => {
                const inv = getInvByRMId(rm.id);
                const st = getStockStatus(rm);
                const capacities = { 1: 500, 2: 300, 3: 100, 4: 150, 5: 100, 6: 1000, 7: 50, 8: 200 };
                const maxStock = capacities[rm.id] || (rm.minStock > 0 ? rm.minStock * 3 : 100);
                const pct = Math.min(100, (inv.quantity / maxStock) * 100);
                t += `<tr data-status="${st}">
      <td class="td-primary">${rm.name}</td>
      <td class="mono" style="color:var(--text3);font-size:12px;">${rm.code}</td>
      <td>${rm.unit}</td>
      <td><strong style="font-size:14px;">${inv.quantity.toFixed(2)}</strong><div class="stock-bar"><div class="stock-bar-fill ${st}" style="width:${pct}%"></div></div></td>
      <td>${rm.minStock}</td>
      <td><span class="status-pill ${st === 'ok' ? 'status-ok' : st === 'low' ? 'status-low' : 'status-out'}">${st === 'ok' ? '✓ OK' : st === 'low' ? '⚠ LOW' : '✕ OUT'}</span></td>
      <td style="color:var(--text3);font-size:12px;">${rm.updatedDate}</td>
      ${can('viewPrice') ? `<td class="cost-tag">${fmtCurrency(rm.rate)}</td><td class="cost-tag" style="font-weight:700;">${fmtCurrency(inv.quantity * rm.rate)}</td>` : ''}

            if (can('viewPrice')) {

                t += `<tr style="background:var(--accent-light);font-weight:700;"><td colspan="${can('viewPrice') ? 7 : 7}" style="padding:12px 14px;color:var(--text);">TOTAL INVENTORY VALUE</td><td></td><td class="cost-tag" style="padding:12px 14px;font-size:15px;font-weight:800;">${fmtCurrency(totalVal)}</td></tr>`;

        }

        function filterInvByStatus() {
            const status = document.getElementById('inv-filter-status')?.value || '';
            const q = (document.getElementById('inv-search')?.value || '').toLowerCase();
            document.querySelectorAll('#inv-main-table tbody tr[data-status]').forEach(row => {
                const matchStatus = !status || row.dataset.status === status;
                const matchQ = !q || row.textContent.toLowerCase().includes(q);
                row.style.display = (matchStatus && matchQ) ? '' : 'none';
            });
        }

        function renderLedgerTab() {
            const txns = [...DB.stockTransactions].reverse();
            const typeColors = { purchase: 'status-ok', consumption: 'status-low', damage: 'status-out', correction: 'badge-view', adjustment: 'badge-report' };
            let t = `<div class="card">
  <div class="page-header" style="margin-bottom:16px;">
    <div class="card-title" style="margin:0;">Transaction Ledger</div>
    <div class="search-input-wrap" style="max-width:280px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search-input" id="ledger-search" placeholder="Search transactions..." oninput="filterTable('ledger-search','ledger-table')">
    </div>
  </div>
  <div class="table-wrap"><table id="ledger-table">
  <thead><tr><th>Date</th><th>Material</th><th>Type</th><th>Qty</th><th>Remarks</th><th>By</th></tr></thead><tbody>`;
            txns.forEach(tx => {
                const rm = getRMById(tx.rmId);
                t += `<tr>
      <td style="color:var(--text3);font-size:12px;">${tx.date}</td>
      <td class="td-primary">${rm ? rm.name : 'Unknown'}</td>
      <td><span class="status-pill ${typeColors[tx.type] || 'badge-view'}">${tx.type.toUpperCase()}</span></td>
      <td style="font-family:'JetBrains Mono';font-size:12px;font-weight:600;color:${tx.qty > 0 ? 'var(--green)' : 'var(--red)'}">${tx.qty > 0 ? '+' : ''}${tx.qty.toFixed(2)}</td>
      <td style="color:var(--text2)">${tx.remarks || '—'}</td>
      <td style="color:var(--text3)">${tx.by}</td>
    </tr>`;
            });
            t += `</tbody></table></div></div>`;
            return t;
        }

        function renderAdjustTab() {
            const canAdd = can('addStock');
            const canSubtract = can('subtractStock');
            const isInvUser = currentUser.role === 'inventory';

            let typeOptions = '';
            if (canAdd) typeOptions += `<option value="purchase">Purchase / Add Stock</option>`;
            if (canSubtract) typeOptions += `<option value="damage">Damage / Loss</option><option value="adjustment">Manual Adjustment (Subtract)</option>`;
            if (can('editPrice')) typeOptions += `<option value="correction">Correction</option>`;

            return `<div class="card">
  <div class="card-title">Manual Stock Adjustment</div>
  <div class="form-row">
    <div class="form-group">
      <label>Material</label>
      <div style="position:relative;">
        <input class="form-control" id="adj-rm-search" placeholder="🔍 Search material name or code..." autocomplete="off"
          oninput="filterAdjustMaterialDropdown()" 
          onfocus="openAdjustMaterialDropdown()" 
          onblur="setTimeout(()=>closeAdjustMaterialDropdown(),200)">
        <div id="adj-rm-dropdown" style="display:none;position:absolute;top:100%;left:0;right:0;background:var(--bg2);border:1.5px solid var(--accent);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,0.12);z-index:500;max-height:280px;overflow-y:auto;margin-top:2px;"></div>
        <input type="hidden" id="adj-rm" value="">
      </div>
    </div>
    <div class="form-group"><label>Type</label>
      <select class="form-control" id="adj-type">${typeOptions}</select>
    </div>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label>Quantity${isInvUser ? ' (always positive — direction set by type)' : ' (+ to add, − to deduct)'}</label>
      <input class="form-control" id="adj-qty" type="number" step="0.01" min="0" placeholder="e.g. 50">
    </div>
    <div class="form-group"><label>Date</label><input class="form-control" id="adj-date" type="date" value="${nowDate()}"></div>
  </div>
  <div class="form-group"><label>Remarks</label><input class="form-control" id="adj-remarks" placeholder="Reason for adjustment"></div>
  <button class="btn btn-primary" onclick="saveAdjustment()">Apply Adjustment</button>
</div>`;
        }

        function switchInvTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + tab)?.classList.add('active');
            const c = document.getElementById('inv-tab-content');
            if (tab === 'stock') c.innerHTML = renderStockTab();
            else if (tab === 'ledger') c.innerHTML = renderLedgerTab();
            else if (tab === 'adjust') c.innerHTML = renderAdjustTab();
            else if (tab === 'alerts') c.innerHTML = renderAlertsTab();
        }

        // ════════════════════════════════════════════════════════
        //  ALERTS TAB — Critical Shortages + Expiry Warning
        // ════════════════════════════════════════════════════════
        function exportAlertsExcel() {
            if (typeof XLSX === 'undefined') { toast('XLSX library not loaded', 'error'); return; }
            const wb = XLSX.utils.book_new();
            const today = new Date(); today.setHours(0, 0, 0, 0);
            const soon = new Date(today); soon.setDate(soon.getDate() + 30);

            // ── Build shared RM→formulation map ──────────────────────
            const rmFmMap = {};
            DB.formulations.forEach(f => {
                (f.items || []).forEach(item => {
                    if (!rmFmMap[item.rmId]) rmFmMap[item.rmId] = [];
                    if (!rmFmMap[item.rmId].includes(f.productName)) rmFmMap[item.rmId].push(f.productName);
                });
            });

            // ── Sheet 1: Critical Stock ───────────────────────────────
            const critHeaders = ['Material Name', 'Code', 'Unit', 'Current Stock', 'Min Required', 'Shortage', 'Status', 'Formulation Count', 'Formulations Using This Material'];
            const critRows = [critHeaders];
            DB.rawMaterials.filter(rm => getStockStatus(rm) !== 'ok')
                .sort((a, b) => { const sa = getStockStatus(a), sb = getStockStatus(b); return (sa === 'out' && sb !== 'out') ? -1 : (sb === 'out' && sa !== 'out') ? 1 : 0; })
                .forEach(rm => {
                    const inv = getInvByRMId(rm.id);
                    const st = getStockStatus(rm);
                    const shortage = Math.max(0, rm.minStock - inv.quantity);
                    const fmNames = rmFmMap[rm.id] || [];
                    critRows.push([rm.name, rm.code, rm.unit, inv.quantity.toFixed(2), rm.minStock, shortage > 0 ? shortage.toFixed(2) : '0', st.toUpperCase(), fmNames.length, fmNames.join(', ') || 'Not used in any formulation']);
                });
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(critRows), 'Critical Stock');

            // ── Sheet 2: Expiring Soon ────────────────────────────────
            const expHeaders = ['Material Name', 'Code', 'Unit', 'Current Stock', 'Expiry Date', 'Days Left', 'Status', 'Formulation Count', 'Formulations Using This Material'];
            const expRows = [expHeaders];
            DB.rawMaterials.filter(rm => { if (!rm.expiryDate) return false; const d = new Date(rm.expiryDate); d.setHours(0, 0, 0, 0); return d <= soon; })
                .sort((a, b) => new Date(a.expiryDate) - new Date(b.expiryDate))
                .forEach(rm => {
                    const inv = getInvByRMId(rm.id);
                    const expDate = new Date(rm.expiryDate); expDate.setHours(0, 0, 0, 0);
                    const daysLeft = Math.round((expDate - today) / (1000 * 60 * 60 * 24));
                    const statusLabel = daysLeft < 0 ? 'EXPIRED' : daysLeft <= 7 ? 'URGENT' : 'EXPIRING SOON';
                    const fmNames = rmFmMap[rm.id] || [];
                    expRows.push([rm.name, rm.code, rm.unit, inv.quantity.toFixed(2), rm.expiryDate, daysLeft, statusLabel, fmNames.length, fmNames.join(', ') || 'Not used in any formulation']);
                });
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(expRows), 'Expiring Soon');

            // ── Sheet 3: Most Used Materials (all RM sorted by formulation count) ───────
            const usageHeaders = ['#', 'Material Name', 'Code', 'Unit', 'Current Stock', 'Min Stock', 'Stock Status', 'Formulation Count', 'Formulations'];
            const usageRows = [usageHeaders];
            DB.rawMaterials
                .map(rm => ({ rm, fmNames: rmFmMap[rm.id] || [] }))
                .filter(x => x.fmNames.length > 0)
                .sort((a, b) => b.fmNames.length - a.fmNames.length)
                .forEach((x, i) => {
                    const inv = getInvByRMId(x.rm.id);
                    usageRows.push([i + 1, x.rm.name, x.rm.code, x.rm.unit, inv.quantity.toFixed(2), x.rm.minStock, getStockStatus(x.rm).toUpperCase(), x.fmNames.length, x.fmNames.join(', ')]);
                });
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(usageRows), 'Most Used Materials');

            XLSX.writeFile(wb, 'Inventory_Alerts_' + new Date().toISOString().slice(0, 10) + '.xlsx');
            toast('Alerts report exported ✓', 'success');
        }

        function renderAlertsTab() {
            const today = new Date(); today.setHours(0, 0, 0, 0);
            const soon = new Date(today); soon.setDate(soon.getDate() + 30);
            const urgent = new Date(today); urgent.setDate(urgent.getDate() + 7);

            // ── 1. Build RM → formulation usage map (unique product names per RM) ───────
            const rmFormulationMap = {};   // rmId → [productName, ...]
            DB.formulations.forEach(f => {
                (f.items || []).forEach(item => {
                    if (!rmFormulationMap[item.rmId]) rmFormulationMap[item.rmId] = [];
                    if (!rmFormulationMap[item.rmId].includes(f.productName))
                        rmFormulationMap[item.rmId].push(f.productName);
                });
            });

            // ── 2. Top-5 most used materials (by unique formulation count) ───────────────
            const topUsed = DB.rawMaterials
                .map(rm => ({ rm, fmNames: rmFormulationMap[rm.id] || [] }))
                .filter(x => x.fmNames.length > 0)
                .sort((a, b) => b.fmNames.length - a.fmNames.length)
                .slice(0, 5);

            const rankColors = ['#f59e0b', '#94a3b8', '#b45309', '#64748b', '#64748b'];
            const rankBgs = ['#fffbeb', '#f8fafc', '#fef3c7', '#f8fafc', '#f8fafc'];
            const rankLabels = ['🥇', '🥈', '🥉', '4th', '5th'];

            const topUsedHTML = topUsed.length === 0 ? '' : `
  <div class="card" style="margin-bottom:16px;">
    <div class="page-header" style="margin-bottom:14px;">
      <div>
        <div class="card-title" style="margin:0;display:flex;align-items:center;gap:8px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2.5"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          Most Used Materials
        </div>
        <div style="font-size:12px;color:var(--text3);margin-top:3px;">Raw materials appearing in the most formulations — critical to keep in stock</div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;">
      ${topUsed.map((x, i) => {
                const inv = getInvByRMId(x.rm.id);
                const st = getStockStatus(x.rm);
                const stColor = st === 'out' ? '#dc2626' : st === 'low' ? '#d97706' : '#16a34a';
                const stBg = st === 'out' ? '#fef2f2' : st === 'low' ? '#fffbeb' : '#f0fdf4';
                const stLabel = st === 'out' ? '✕ OUT' : st === 'low' ? '⚠ LOW' : '✓ OK';
                return `<div style="background:${rankBgs[i]};border:1.5px solid ${rankColors[i]}33;border-radius:12px;padding:14px 16px;position:relative;overflow:hidden;">
          <div style="position:absolute;top:10px;right:12px;font-size:20px;opacity:0.7;">${rankLabels[i]}</div>
          <div style="font-size:18px;font-weight:900;color:${rankColors[i]};line-height:1;">${x.fmNames.length}</div>
          <div style="font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;">formulations</div>
          <div style="font-size:13px;font-weight:700;color:var(--text);line-height:1.2;margin-bottom:4px;">${x.rm.name}</div>
          <div style="font-size:11px;color:var(--text3);margin-bottom:8px;font-family:'JetBrains Mono',monospace;">${x.rm.code}</div>
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <span style="font-size:11px;font-weight:600;color:var(--text2);">${inv.quantity.toFixed(2)} ${x.rm.unit}</span>
            <span style="background:${stBg};color:${stColor};border-radius:4px;padding:2px 7px;font-size:10px;font-weight:700;">${stLabel}</span>
          </div>
          <div style="margin-top:8px;font-size:10px;color:var(--text3);line-height:1.4;">${x.fmNames.slice(0, 3).join(' · ')}${x.fmNames.length > 3 ? ` +${x.fmNames.length - 3} more` : ''}</div>
        </div>`;
            }).join('')}
    </div>
  </div>`;

            // ── 3. Critical / Short stock ─────────────────────────────
            const critItems = DB.rawMaterials
                .filter(rm => getStockStatus(rm) !== 'ok')
                .sort((a, b) => {
                    // Primary: OUT before LOW
                    const sa = getStockStatus(a), sb = getStockStatus(b);
                    if (sa !== sb) return (sa === 'out' && sb !== 'out') ? -1 : 1;
                    // Secondary: more formulations first
                    const fa = (rmFormulationMap[a.id] || []).length, fb = (rmFormulationMap[b.id] || []).length;
                    return fb - fa;
                });

            let critHTML = '';
            if (critItems.length === 0) {
                critHTML = `<div style="color:var(--green);font-weight:600;padding:16px 0;display:flex;align-items:center;gap:8px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
      All materials are sufficiently stocked ✓
    </div>`;
            } else {
                critHTML = `<div class="table-wrap"><table>
      <thead><tr>
        <th>Material</th><th>Code</th><th>Stock</th><th>Min Required</th><th>Shortage</th><th>Status</th><th style="text-align:center;">Used In</th><th>Formulations</th>
      </tr></thead><tbody>`;
                critItems.forEach(rm => {
                    const inv = getInvByRMId(rm.id);
                    const st = getStockStatus(rm);
                    const shortage = Math.max(0, rm.minStock - inv.quantity);
                    const fmNames = rmFormulationMap[rm.id] || [];
                    const cnt = fmNames.length;
                    const pillColor = st === 'out' ? '#fef2f2' : '#fffbeb';
                    const cntBg = cnt >= 5 ? '#7c3aed' : cnt >= 3 ? '#2563eb' : cnt >= 1 ? '#0891b2' : '#94a3b8';
                    const fmChips = cnt > 0
                        ? fmNames.map(n => `<span style="display:inline-block;background:var(--accent-light);color:var(--accent2);border-radius:4px;padding:1px 7px;font-size:10px;font-weight:600;margin:1px 2px 1px 0;">${n}</span>`).join('')
                        : `<span style="color:var(--text3);font-size:11px;">Not used in any formulation</span>`;
                    critHTML += `<tr style="background:${pillColor};">
        <td class="td-primary" style="font-weight:700;">${rm.name}</td>
        <td class="mono" style="font-size:11px;color:var(--text3);">${rm.code}</td>
        <td><strong style="color:${st === 'out' ? 'var(--red)' : 'var(--orange)'};">${inv.quantity.toFixed(2)} ${rm.unit}</strong></td>
        <td>${rm.minStock} ${rm.unit}</td>
        <td style="color:var(--red);font-weight:700;">${shortage > 0 ? shortage.toFixed(2) + ' ' + rm.unit : '—'}</td>

        <td style="text-align:center;">
          <span style="display:inline-flex;align-items:center;justify-content:center;background:${cntBg};color:#fff;border-radius:999px;width:28px;height:28px;font-size:13px;font-weight:800;">${cnt}</span>
        </td>
        <td style="max-width:280px;">${fmChips}</td>
      </tr>`;
                });
                critHTML += `</tbody></table></div>`;
            }

            // ── 4. Expiring Soon ──────────────────────────────────────
            const expItems = DB.rawMaterials
                .filter(rm => { if (!rm.expiryDate) return false; const d = new Date(rm.expiryDate); d.setHours(0, 0, 0, 0); return d <= soon; })
                .sort((a, b) => new Date(a.expiryDate) - new Date(b.expiryDate));

            let expHTML = '';
            if (expItems.length === 0) {
                expHTML = `<div style="color:var(--green);font-weight:600;padding:16px 0;display:flex;align-items:center;gap:8px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
      No materials expiring in the next 30 days ✓
    </div>`;
            } else {
                expHTML = `<div class="table-wrap"><table>
      <thead><tr>
        <th>Material</th><th>Code</th><th>Current Stock</th><th>Expiry Date</th><th>Days Left</th><th style="text-align:center;">Used In</th><th>Formulations</th>
      </tr></thead><tbody>`;
                expItems.forEach(rm => {
                    const inv = getInvByRMId(rm.id);
                    const expDate = new Date(rm.expiryDate); expDate.setHours(0, 0, 0, 0);
                    const daysLeft = Math.round((expDate - today) / (1000 * 60 * 60 * 24));
                    const isExpired = daysLeft < 0;
                    const isUrgent = daysLeft <= 7 && !isExpired;
                    const rowBg = isExpired ? '#fef2f2' : isUrgent ? '#fffbeb' : '#f0fdf4';
                    const dayColor = isExpired ? '#dc2626' : isUrgent ? '#d97706' : '#16a34a';
                    const dayLabel = isExpired ? `Expired ${Math.abs(daysLeft)}d ago` : isUrgent ? `${daysLeft}d left` : `${daysLeft} days`;
                    const fmNames = rmFormulationMap[rm.id] || [];
                    const cnt = fmNames.length;
                    const cntBg = cnt >= 5 ? '#7c3aed' : cnt >= 3 ? '#2563eb' : cnt >= 1 ? '#0891b2' : '#94a3b8';
                    const fmChips = cnt > 0
                        ? fmNames.map(n => `<span style="display:inline-block;background:var(--accent-light);color:var(--accent2);border-radius:4px;padding:1px 7px;font-size:10px;font-weight:600;margin:1px 2px 1px 0;">${n}</span>`).join('')
                        : `<span style="color:var(--text3);font-size:11px;">Not used in any formulation</span>`;
                    expHTML += `<tr style="background:${rowBg};">
        <td class="td-primary" style="font-weight:700;">${rm.name}</td>
        <td class="mono" style="font-size:11px;color:var(--text3);">${rm.code}</td>
        <td><strong>${inv.quantity.toFixed(2)} ${rm.unit}</strong></td>
        <td style="font-weight:600;">${rm.expiryDate}</td>
        <td><span style="font-weight:800;color:${dayColor};">${dayLabel}</span></td>
        <td style="text-align:center;">
          <span style="display:inline-flex;align-items:center;justify-content:center;background:${cntBg};color:#fff;border-radius:999px;width:28px;height:28px;font-size:13px;font-weight:800;">${cnt}</span>
        </td>
        <td style="max-width:280px;">${fmChips}</td>
      </tr>`;
                });
                expHTML += `</tbody></table></div>`;
            }

            // ── 5. Render ─────────────────────────────────────────────
            return `
  ${topUsedHTML}

  <div class="card" style="margin-bottom:16px;">
    <div class="page-header" style="margin-bottom:18px;">
      <div>
        <div class="card-title" style="margin:0;display:flex;align-items:center;gap:8px;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.5"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          Critical Stock Shortage
        </div>

      </div>

        <span style="background:#fef2f2;color:#dc2626;border:1px solid #fca5a5;border-radius:6px;padding:4px 12px;font-size:12px;font-weight:700;">${critItems.filter(r => getStockStatus(r) === 'out').length} OUT</span>
        <span style="background:#fffbeb;color:#92400e;border:1px solid #fcd34d;border-radius:6px;padding:4px 12px;font-size:12px;font-weight:700;">${critItems.filter(r => getStockStatus(r) === 'low').length} LOW</span>

  <div class="card">
    <div class="page-header" style="margin-bottom:18px;">
      <div>
        <div class="card-title" style="margin:0;display:flex;align-items:center;gap:8px;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2.5"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Expiring Soon
          <span style="font-size:11px;font-weight:500;color:var(--text3);">(within 30 days)</span>
        </div>
        <div style="font-size:12px;color:var(--text3);margin-top:4px;">Set expiry date per material in Raw Materials → Edit</div>
      </div>
      ${expItems.length > 0 ? `<span style="background:#fffbeb;color:#92400e;border:1px solid #fcd34d;border-radius:6px;padding:4px 12px;font-size:12px;font-weight:700;">${expItems.length} Material${expItems.length !== 1 ? 's' : ''} Expiring</span>` : ''}
    </div>
    ${expHTML}
  </div>`;
        }

        function openStockModal() {
            const modal = `<div class="modal-overlay" id="stock-modal" onclick="if(event.target.id==='stock-modal')closeModal('stock-modal')">
  <div class="modal">
    <div class="modal-header"><div class="modal-title">Add Stock</div><button class="close-btn" onclick="closeModal('stock-modal')">✕</button></div>
    <div class="modal-body">
      <div class="form-group"><label>Material</label>
        <select class="form-control" id="st-rm">${DB.rawMaterials.map(r => `<option value="${r.id}">${r.name} (${r.code})</option>`).join('')}</select>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Quantity</label><input class="form-control" id="st-qty" type="number" step="0.01" placeholder="0"></div>
        <div class="form-group"><label>Date</label><input class="form-control" id="st-date" type="date" value="${nowDate()}"></div>
      </div>
      <div class="form-group"><label>Remarks</label><input class="form-control" id="st-remarks" placeholder="e.g. Monthly purchase"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('stock-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveStock()">Add Stock</button>
    </div>
  </div></div>`;
            document.body.insertAdjacentHTML('beforeend', modal);
        }

        function saveStock() {
            const rmId = parseInt(document.getElementById('st-rm').value);
            const qty = parseFloat(document.getElementById('st-qty').value);
            const date = document.getElementById('st-date').value;
            const remarks = document.getElementById('st-remarks').value.trim();
            if (!qty || qty <= 0) { toast('Enter valid quantity', 'error'); return; }
            const inv = DB.inventory.find(i => i.rmId === rmId);
            if (inv) inv.quantity += qty;
            const rm = getRMById(rmId);
            if (rm) rm.updatedDate = date;
            const tx = { id: DB.nextId.txn++, rmId, type: 'purchase', qty, date, remarks, by: currentUser.username };
            DB.stockTransactions.push(tx);
            addAudit('Stock added', `${getRMById(rmId)?.name} +${qty}`);
            closeModal('stock-modal');
            toast('Saving...', 'info');
            gasCall('adjustStock', { transaction: tx })
                .then(() => toast('Stock saved ✓', 'success'))
                .catch(err => { toast('Save failed — ' + err.message, 'error'); });
            navigate('inventory');
        }

        function saveAdjustment() {
            const rmId = parseInt(document.getElementById('adj-rm').value);
            const type = document.getElementById('adj-type').value;
            const date = document.getElementById('adj-date').value;
            const remarks = document.getElementById('adj-remarks').value.trim();
            const isInvUser = currentUser.role === 'inventory';
            let qty = parseFloat(document.getElementById('adj-qty').value);
            if (isNaN(qty)) { toast('Enter valid quantity', 'error'); return; }
            if (!rmId) { toast('Please select a material', 'error'); return; }
            // Inventory user always inputs positive; subtract types auto-negate
            if (isInvUser && (type === 'damage' || type === 'adjustment')) qty = -Math.abs(qty);
            const inv = DB.inventory.find(i => i.rmId === rmId);
            if (inv) { inv.quantity += qty; if (inv.quantity < 0) inv.quantity = 0; }
            const tx = { id: DB.nextId.txn++, rmId, type, qty, date, remarks, by: currentUser.username };
            DB.stockTransactions.push(tx);
            addAudit(`Stock ${type}`, `${getRMById(rmId)?.name} ${qty > 0 ? '+' : ''}${qty}`);
            toast('Saving...', 'info');
            gasCall('adjustStock', { transaction: tx })
                .then(() => toast('Adjustment saved ✓', 'success'))
                .catch(err => { toast('Save failed — ' + err.message, 'error'); });
            navigate('inventory');
        }

        // ════════════════════════════════════════════════════════
        //  ADJUST TAB MATERIAL SEARCH DROPDOWN
        // ════════════════════════════════════════════════════════
        function openAdjustMaterialDropdown() {
            const searchInput = document.getElementById('adj-rm-search');
            const dropdown = document.getElementById('adj-rm-dropdown');
            if (!searchInput || !dropdown) return;

            const searchText = (searchInput.value || '').toLowerCase().trim();
            let filteredMaterials = DB.rawMaterials;

            if (searchText) {
                filteredMaterials = DB.rawMaterials.filter(rm =>
                    rm.name.toLowerCase().includes(searchText) ||
                    rm.code.toLowerCase().includes(searchText)
                );
            }

            if (filteredMaterials.length === 0) {
                dropdown.innerHTML = `<div style="padding:12px;color:var(--text3);font-size:12px;text-align:center;">No materials found</div>`;
            } else {
                dropdown.innerHTML = filteredMaterials.map(rm => {
                    const inv = getInvByRMId(rm.id);
                    const st = getStockStatus(rm);
                    const stockBadge = st === 'ok' ? '<span style="background:#d1fae5;color:#065f46;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:700;">✓ IN STOCK</span>' :
                        st === 'low' ? '<span style="background:#fef3c7;color:#92400e;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:700;">⚠ LOW</span>' :
                            '<span style="background:#fee2e2;color:#991b1b;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:700;">✕ OUT</span>';
                    return `<div onmousedown="selectAdjustMaterial(${rm.id},'${rm.name.replace(/'/g, "\\'")} (${rm.code})')" 
        style="padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .1s;" 
        onmouseover="this.style.background='var(--accent-light)'" 
        onmouseout="this.style.background=''">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <div style="font-size:13px;font-weight:600;color:var(--text);">${rm.name}</div>
          ${stockBadge}
        </div>
        <div style="font-size:11px;color:var(--text3);margin-top:3px;">
          Code: <span class="mono" style="color:var(--text2);">${rm.code}</span> · 
          Available: <strong>${inv.quantity.toFixed(2)} ${rm.unit}</strong> · 
          Min Stock: ${rm.minStock}
        </div>
      </div>`;
                }).join('');
            }

            dropdown.style.display = 'block';
        }

        function filterAdjustMaterialDropdown() {
            openAdjustMaterialDropdown();
        }

        function closeAdjustMaterialDropdown() {
            const dropdown = document.getElementById('adj-rm-dropdown');
            if (dropdown) dropdown.style.display = 'none';
        }

        function selectAdjustMaterial(rmId, displayName) {
            document.getElementById('adj-rm').value = rmId;
            document.getElementById('adj-rm-search').value = displayName;
            closeAdjustMaterialDropdown();
        }

        // ════════════════════════════════════════════════════════
        //  FULL KITTING  — with saved analysis database
        // ════════════════════════════════════════════════════════
        DB.kittingRecords = DB.kittingRecords || [];
        DB.nextId.kit = DB.nextId.kit || 1;

        function renderKitting() {
            const saved = DB.kittingRecords;
            const formOpts = DB.formulations.map(f => `<option value="${f.id}">${f.productName} (${f.productCode})</option>`).join('');

            let html = `<div class="page-header">
    <div><div class="page-title">Full Kitting</div><div class="page-subtitle">Plan your production orders — check material availability & shortages</div></div>
    <button class="btn btn-primary" onclick="openNewKitting()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> New Kitting Analysis
    </button>
  </div>
  <div class="alert alert-info" style="margin-bottom:20px;">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    Kitting analysis checks inventory availability without debiting stock. Save analyses to track production orders in pipeline.
  </div>`;

            // Saved records database
            html += `<div class="card" style="margin-bottom:20px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;">
      <div class="card-title" style="margin:0;">📋 Saved Kitting Analyses (${saved.length})</div>
      <div style="display:flex;gap:8px;align-items:center;">
        <div class="search-input-wrap" style="min-width:200px;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input class="search-input" id="kit-db-search" placeholder="Search kitting records..." oninput="filterKitDB()">
        </div>
        <select class="filter-select" id="kit-db-status" onchange="filterKitDB()">
          <option value="">All Status</option>
          <option value="ok">All Available</option>
          <option value="shortage">Has Shortage</option>
        </select>
        <button class="btn btn-success btn-sm" onclick="exportAllKittingRecords()">↓ Export All</button>
      </div>
    </div>`;

            if (saved.length === 0) {
                html += `<div style="text-align:center;padding:32px;color:var(--text3);">
      <div style="font-size:32px;margin-bottom:8px;">📦</div>
      <div style="font-size:14px;font-weight:600;">No kitting analyses saved yet</div>
      <div style="font-size:12px;margin-top:4px;">Click "New Kitting Analysis" to check a production order</div>
    </div>`;
            } else {
                html += `<div class="table-wrap"><table id="kit-db-table">
      <thead><tr><th>Analysis Name</th><th>Product</th><th>Lots</th><th>Total Required</th><th>Shortages</th><th>Status</th><th>Saved By</th><th>Date</th><th>Actions</th></tr></thead>
      <tbody>`;
                saved.slice().reverse().forEach(rec => {
                    const statusPill = rec.hasShortage
                        ? `<span class="status-pill status-out">⚠ Shortage</span>`
                        : `<span class="status-pill status-ok">✓ Ready</span>`;
                    html += `<tr data-status="${rec.hasShortage ? 'shortage' : 'ok'}">
        <td class="td-primary">${rec.name}</td>
        <td>${rec.productName}</td>
        <td style="font-weight:600;">${rec.lots}</td>
        <td style="font-weight:600;">${rec.totalRequired.toFixed(2)} KG</td>
        <td class="${rec.hasShortage ? 'kitting-shortage' : 'kitting-ok'}" style="font-weight:700;">${rec.shortageCount} item(s)</td>
        <td>${statusPill}</td>
        <td style="color:var(--text3);font-size:12px;">${rec.savedBy}</td>
        <td style="color:var(--text3);font-size:12px;">${rec.savedAt}</td>
        <td style="display:flex;gap:4px;">
          <button class="btn btn-secondary btn-sm" onclick="viewKittingRecord(${rec.id})">View</button>
          <button class="btn btn-teal btn-sm" onclick="openNewKitting(${rec.id})">Re-run</button>
          <button class="btn btn-danger btn-sm" onclick="deleteKittingRecord(${rec.id})">Del</button>
        </td>
      </tr>`;
                });
                html += `</tbody></table></div>`;
            }
            html += `</div>`;

            // Quick analysis panel (inline, not saved)
            html += `<div class="card">
    <div class="card-title">⚡ Quick Kitting Check (not saved)</div>
    <div class="form-row">
      <div class="form-group"><label>Finished Product</label>
        <select class="form-control" id="kit-form" onchange="runQuickKitting()">${formOpts}</select>
      </div>
      <div class="form-group"><label>Number of Lots</label>

      </div>
    </div>
    <div id="kitting-result"></div>
  </div>`;

            return html;
        }

        function filterKitDB() {
            const q = (document.getElementById('kit-db-search')?.value || '').toLowerCase();
            const status = document.getElementById('kit-db-status')?.value || '';
            document.querySelectorAll('#kit-db-table tbody tr').forEach(row => {
                const matchQ = !q || row.textContent.toLowerCase().includes(q);
                const matchS = !status || row.dataset.status === status;
                row.style.display = (matchQ && matchS) ? '' : 'none';
            });
        }

        function runQuickKitting() {
            const fId = parseInt(document.getElementById('kit-form')?.value);
            const lots = parseInt(document.getElementById('kit-lots')?.value) || 1;
            const f = DB.formulations.find(x => x.id === fId);
            if (!f) { document.getElementById('kitting-result').innerHTML = ''; return; }
            const { rows, allOk } = _buildKittingRows(f, lots);
            document.getElementById('kitting-result').innerHTML = `
    <div style="margin-top:14px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
        <div style="font-size:13px;font-weight:700;color:var(--text);">Result: ${f.productName} × ${lots} lot(s)</div>
        <div style="display:flex;gap:8px;">
          ${allOk ? `<span class="status-pill status-ok">✓ All Materials Available</span>` : `<span class="status-pill status-out">⚠ Shortages Found</span>`}
          <button class="btn btn-success btn-sm" onclick="exportQuickKitting()">↓ Export</button>
          <button class="btn btn-primary btn-sm" onclick="saveQuickKittingAsRecord()">💾 Save This Analysis</button>
        </div>
      </div>
      <div class="table-wrap"><table id="quick-kit-table">
        <thead><tr><th>Finished Product</th><th>Raw Material</th><th>Required Qty</th><th>Unit</th><th>Available</th><th>To Order</th><th>Final Purchase Qty</th><th>Status</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>`;
        }

        function _buildKittingRows(f, lots) {
            let rows = ''; let allOk = true;
            f.items.forEach(item => {
                const rm = getRMById(item.rmId); if (!rm) return;
                const required = item.qty * lots;
                const available = getInvByRMId(rm.id).quantity;
                const toOrder = Math.max(0, required - available);
                if (toOrder > 0) allOk = false;
                const statusPill = toOrder > 0 ? `<span class="status-pill status-out">Shortage</span>` : `<span class="status-pill status-ok">OK</span>`;
                rows += `<tr>
      <td class="td-primary">${f.productName}</td>
      <td class="td-primary">${rm.name}</td>
      <td style="font-weight:600;">${required.toFixed(3)}</td>
      <td>${rm.unit}</td>
      <td>${available.toFixed(3)}</td>
      <td class="${toOrder > 0 ? 'kitting-shortage' : 'kitting-ok'}" style="font-weight:700;">${toOrder > 0 ? toOrder.toFixed(3) : '✓ 0'}</td>
      <td style="font-weight:700;color:${toOrder > 0 ? 'var(--red)' : 'var(--green)'};">${toOrder > 0 ? toOrder.toFixed(3) + ' ' + rm.unit : '—'}</td>
      <td>${statusPill}</td>
    </tr>`;
            });
            return { rows, allOk };
        }

        function openNewKitting(rerunId = null) {
            const src = rerunId ? DB.kittingRecords.find(r => r.id === rerunId) : null;

            const modal = `<div class="modal-overlay" id="kit-modal" onclick="if(event.target.id==='kit-modal')closeModal('kit-modal')">
  <div class="modal modal-lg">
    <div class="modal-header">
      <div><div class="modal-title">${src ? 'Re-run: ' + src.name : 'New Kitting Analysis'}</div><div style="font-size:12px;color:var(--text3);margin-top:2px;">Inventory is not debited</div></div>
      <button class="close-btn" onclick="closeModal('kit-modal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group"><label>Analysis Name ✱</label><input class="form-control" id="kn-name" value="${src ? (rerunId ? src.name + ' (re-run)' : src.name) : ''}" placeholder="e.g. Q2 Production Order"></div>
        <div class="form-group"><label>Order Reference</label><input class="form-control" id="kn-ref" value="${src ? src.orderRef || '' : ''}" placeholder="e.g. PO-2025-042"></div>
      </div>

          <input class="form-control" id="kn-lots" type="number" min="1" value="${src ? src.lots : 1}" oninput="previewKittingModal()">

        function saveKittingAnalysis() {
            const name = document.getElementById('kn-name')?.value.trim();
            const orderRef = document.getElementById('kn-ref')?.value.trim();
            const fId = parseInt(document.getElementById('kn-form')?.value);
            const lots = parseInt(document.getElementById('kn-lots')?.value) || 1;
            const notes = document.getElementById('kn-notes')?.value.trim();
            if (!name) { toast('Analysis name is required', 'error'); return; }
            const f = DB.formulations.find(x => x.id === fId);
            if (!f) { toast('Select a product', 'error'); return; }

            let shortageCount = 0; let totalRequired = 0;
            const lineItems = f.items.map(item => {
                const rm = getRMById(item.rmId); if (!rm) return null;
                const required = item.qty * lots;
                const available = getInvByRMId(rm.id).quantity;
                const toOrder = Math.max(0, required - available);
                if (toOrder > 0) shortageCount++;
                totalRequired += required;
                return { rmId: item.rmId, rmName: rm.name, rmCode: rm.code, unit: rm.unit, required, available, toOrder, finalPurchase: toOrder > 0 ? toOrder : 0 };
            }).filter(Boolean);

            const rec = {
                id: DB.nextId.kit++,
                name, orderRef, formId: fId, productName: f.productName, productCode: f.productCode,
                lots, notes, lineItems, shortageCount, totalRequired,
                hasShortage: shortageCount > 0,
                savedBy: currentUser.name, savedAt: nowDateTime()
            };
            DB.kittingRecords.push(rec);
            addAudit('Saved kitting analysis', `${name} — ${f.productName} × ${lots} lots`);
            closeModal('kit-modal');
            toast(`Kitting analysis saved ✓ (${shortageCount} shortage(s))`, 'success');
            navigate('kitting');
        }

        function saveUser(id) {
            const name = document.getElementById('usr-name').value.trim();
            const username = document.getElementById('usr-uname').value.trim();
            const pass = document.getElementById('usr-pass').value;
            const role = document.getElementById('usr-role').value;
            if (!name || !username) { toast('Fill required fields', 'error'); return; }
            if (id) {
                const u = DB.users.find(x => x.id === id);
                u.name = name; u.username = username; u.role = role;
                if (pass) u.password = pass;
                addAudit('Updated user', `${username} — ${role}`);
                toast('Saving...', 'info');
                gasCall('saveUser', { user: u, isNew: false })
                    .then(() => gasCall('addAudit', { entry: DB.auditLog[0] }))
                    .then(() => toast('User updated ✓', 'success'));
            } else {
                if (!pass) { toast('Password required', 'error'); return; }
                const newUser = { id: DB.nextId.user++, username, password: pass, name, role };
                DB.users.push(newUser);
                addAudit('Created user', `${username} — ${role}`);
                toast('Saving...', 'info');
                gasCall('saveUser', { user: newUser, isNew: true })
                    .then(() => gasCall('addAudit', { entry: DB.auditLog[0] }))
                    .then(() => toast('User saved ✓', 'success'));
            }
            closeModal('user-modal');
            navigate('users');
        }

        function deleteUser(id) {
            if (id === currentUser.id) { toast('Cannot delete yourself', 'error'); return; }
            if (!confirm('Delete this user?')) return;
            DB.users.splice(DB.users.findIndex(u => u.id === id), 1);
            toast('User deleted', 'info');
            navigate('users');
        }
