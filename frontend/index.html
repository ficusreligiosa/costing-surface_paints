table{width:100%;border-collapse:collapse;font-size:10pt;}
thead tr{background:#0d0d0d;color:#fff;}
thead th{padding:7px 9px;font-size:7.5pt;text-transform:uppercase;letter-spacing:.8px;font-weight:600;}
th.c,td.c{text-align:center;}th.r,td.r{text-align:right;font-family:'JetBrains Mono',monospace;font-size:9pt;}
tbody tr{border-bottom:1px solid #e0e0e0;}
tbody tr:nth-child(even){background:#f8f8f8;}
tbody tr:last-child{border-bottom:1.5px solid #1a1a1a;}
td{padding:6px 9px;color:#1a1a1a;vertical-align:middle;}
.cost-box{margin-top:10px;display:flex;justify-content:flex-end;}
.cost-box table{width:310px;border-collapse:collapse;border:1px solid #ccc;}
.cost-box td{padding:5px 10px;font-size:10pt;border-bottom:1px solid #e0e0e0;color:#333;}
.cost-box td:last-child{font-family:'JetBrains Mono';text-align:right;font-size:9.5pt;font-weight:600;}
.cost-box .sub{color:#888;font-size:9pt;}
.cost-box .sub td{color:#666;font-size:8.5pt;}
.cost-box .sub td:last-child{font-size:8.5pt;}
.cost-box tr.gd td{background:#0d0d0d;color:#fff;font-weight:700;font-size:11pt;border-bottom:none;}
.cost-box tr.cpkg td{color:#555;font-size:9pt;border-bottom:none;}
.rem{border:1px solid #ccc;padding:7px 10px;margin:10px 0;background:#fafafa;}
.rl{font-size:7pt;text-transform:uppercase;letter-spacing:.8px;color:#666;margin-bottom:3px;}
.sig{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-top:30px;}
.sig .sl{border-top:1.5px solid #1a1a1a;padding-top:5px;margin-top:35px;text-align:center;}
.sig .st{font-size:8pt;text-transform:uppercase;letter-spacing:.8px;color:#444;}
.df{margin-top:16px;border-top:1px solid #ccc;padding-top:6px;display:flex;justify-content:space-between;font-size:7.5pt;color:#888;}
@media screen{body{background:#e0e0e0;padding:20px;}.page{background:#fff;max-width:210mm;margin:0 auto;padding:14mm 16mm 16mm;box-shadow:0 4px 24px rgba(0,0,0,.2);}}
@media print{.np{display:none;}body{background:#fff;}.page{padding:0;box-shadow:none;}}

            document.body.insertAdjacentHTML('beforeend', modal);

        let _ssScalerCount = 0;

            _ssScalerCount++;

            const row = document.createElement('div');
            row.className = 'scaler-product-row';
            row.id = 'ss-sp-' + n;
            row.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">

      </div>
      ${n > 1 ? `<button onclick="document.getElementById('ss-sp-${n}').remove()" style="background:var(--red-light);border:1px solid #fca5a5;color:var(--red);border-radius:6px;padding:3px 8px;cursor:pointer;font-size:11px;">✕ Remove</button>` : ''}

          <input class="form-control" id="ss-sp-search-${n}" placeholder="🔍 Type product name, code or date..." autocomplete="off"

          <input type="hidden" id="ss-sp-form-${n}" value="">

            document.getElementById('ss-scaler-products').appendChild(row);
            ssOpenFormDrop(n);
        }

        function _ssBuildDropItems(n, filterText, filterDate) {
            const items = [];
            DB.formulations.forEach(f => {
                const nameMatch = !filterText || (f.productName.toLowerCase().includes(filterText) || ((f.productCode || '').toLowerCase().includes(filterText)) || ((f.mfgDate || '').includes(filterText)));
                const dateMatch = !filterDate || (f.mfgDate && f.mfgDate.startsWith(filterDate));
                if (nameMatch && dateMatch) items.push(f);
            });
            // Sort latest first
            items.sort((a, b) => (b.mfgDate || '').localeCompare(a.mfgDate || ''));
            return items;
        }

        function ssOpenFormDrop(n) {
            const filterText = (document.getElementById('ss-sp-search-' + n)?.value || '').toLowerCase().trim();
            const filterDate = document.getElementById('ss-sp-date-' + n)?.value || '';
            const drop = document.getElementById('ss-sp-drop-' + n);
            if (!drop) return;
            const items = _ssBuildDropItems(n, filterText, filterDate);
            if (items.length === 0) {
                drop.innerHTML = `<div style="padding:10px 12px;font-size:12px;color:var(--text3);">No formulations found</div>`;
            } else {
                drop.innerHTML = items.map(f => {

                    const dateStr = f.mfgDate ? f.mfgDate.slice(0, 10) : '';
                    const typeBadge = f.productType ? `<span style="background:#dbeafe;color:#1e40af;border-radius:4px;padding:1px 5px;font-size:9px;font-weight:700;margin-left:4px;">${f.productType}</span>` : '';
                    const finBadge = f.productFinish ? `<span style="background:#fef3c7;color:#92400e;border-radius:4px;padding:1px 5px;font-size:9px;font-weight:700;margin-left:2px;">${f.productFinish}</span>` : '';

        <div style="font-size:11px;color:var(--text3);margin-top:2px;">${f.productCode ? f.productCode + ' · ' : ''}📅 ${dateStr} · ⚗ ${base} KG base · ${f.items.length} materials</div>

        function ssCloseFormDrop(n) {
            const drop = document.getElementById('ss-sp-drop-' + n);

            ssOpenFormDrop(n);

        function ssSelectForm(n, fId) {
            const f = DB.formulations.find(x => x.id === fId);
            if (!f) return;
            document.getElementById('ss-sp-form-' + n).value = fId;
            document.getElementById('ss-sp-search-' + n).value = `${f.productName}${f.productCode ? ' (' + f.productCode + ')' : ''}  📅 ${f.mfgDate ? f.mfgDate.slice(0, 10) : ''}`;
            ssCloseFormDrop(n);
            const base = calcTotalQty(f);
            const infoEl = document.getElementById('ss-sp-base-info-' + n);
            if (infoEl) {
                const typeBadge = f.productType ? `<span style="background:#dbeafe;color:#1e40af;border-radius:4px;padding:1px 6px;font-size:10px;font-weight:700;">${f.productType}</span> ` : '';

        function runSSScaler() {
            const resultEl = document.getElementById('ss-scaler-result');
            if (!resultEl) return;
            const rows = document.querySelectorAll('#ss-scaler-products .scaler-product-row');
            if (rows.length === 0) { resultEl.innerHTML = '<div class="alert alert-error">Add at least one product.</div>'; return; }

            const products = [];
            let hasError = false;
            rows.forEach(row => {
                const n = row.id.replace('ss-sp-', '');
                const fId = parseInt(document.getElementById('ss-sp-form-' + n)?.value) || 0;
                const reqKg = parseFloat(document.getElementById('ss-sp-qty-' + n)?.value) || 0;
                if (!fId || reqKg <= 0) { hasError = true; return; }
                const f = DB.formulations.find(x => x.id === fId);
                if (!f || !f.items.length) { hasError = true; return; }
                const baseKg = calcTotalQty(f);
                if (baseKg <= 0) { hasError = true; return; }
                const scaleFactor = reqKg / baseKg;
                products.push({ name: f.productName + (f.productCode ? ' (' + f.productCode + ')' : ''), reqKg, baseKg, scaleFactor, baseItems: f.items, f });
            });

            if (hasError || products.length === 0) {
                resultEl.innerHTML = '<div class="alert alert-error">Please select a formulation and enter a valid quantity for each product row.</div>';
                return;
            }

            // Aggregate RM totals with stock data
            const rmTotals = {};
            let grandCost = 0, grandKg = 0, totalShortage = 0;

            products.forEach(p => {
                p.baseItems.forEach(item => {
                    const rm = getRMById(item.rmId); if (!rm) return;
                    const u = (item.unit || rm.unit || 'KG').toUpperCase();
                    const scaledQty = item.qty * p.scaleFactor;
                    const scaledKg = (u === 'G' || u === 'ML') ? scaledQty / 1000 : scaledQty;
                    const rate = (item.rate !== undefined && item.rate !== null) ? item.rate : (rm.rate || 0);
                    const cost = scaledKg * rate;
                    if (!rmTotals[item.rmId]) {
                        const inv = getInvByRMId(item.rmId);
                        rmTotals[item.rmId] = {
                            rmId: item.rmId, name: rm.name, code: rm.code, unit: u,
                            totalQtyKg: 0, totalCost: 0,
                            availableKg: inv.quantity, rate
                        };
                    }
                    rmTotals[item.rmId].totalQtyKg += scaledKg;
                    rmTotals[item.rmId].totalCost += cost;
                });
                grandKg += p.reqKg;
            });

            // Compute shortfall & to-purchase
            Object.values(rmTotals).forEach(r => {
                r.shortfallKg = Math.max(0, r.totalQtyKg - r.availableKg);
                r.toPurchaseKg = r.shortfallKg;
                if (r.shortfallKg > 0) totalShortage++;
                grandCost += r.totalCost;
            });

            const grandPkg = (DB.packagingCost || 0) * grandKg;
            const grandTotal = grandCost + grandPkg;
            const costPerKg = grandKg > 0 ? grandTotal / grandKg : 0;

            // Store result for export
            window._ssLastResult = { products, rmTotals: Object.values(rmTotals), grandKg, grandCost, grandPkg, grandTotal, costPerKg, totalShortage, generatedAt: nowDateTime() };

            // Build product pills
            const prodPills = products.map(p => `<div style="display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:6px 14px;margin-right:8px;margin-bottom:6px;">
    <span style="font-size:12px;font-weight:700;color:#e2e8f0;">${p.name}</span>
    <span style="font-size:11px;color:#94a3b8;">${p.reqKg} KG</span>
    <span style="font-size:10px;color:#64748b;">×${p.scaleFactor.toFixed(3)}</span>
  </div>`).join('');

            // Build RM rows with stock columns
            const rmRows = Object.values(rmTotals).map(r => {
                const isG = r.unit === 'G';
                const reqDisplay = isG ? `${(r.totalQtyKg * 1000).toFixed(1)} G` : `${r.totalQtyKg.toFixed(3)} KG`;
                const availDisplay = isG ? `${(r.availableKg * 1000).toFixed(1)} G` : `${r.availableKg.toFixed(3)} KG`;
                const shortage = r.shortfallKg > 0;
                const shortfallDisplay = shortage ? (isG ? `${(r.shortfallKg * 1000).toFixed(1)} G` : `${r.shortfallKg.toFixed(3)} KG`) : '—';
                const purchaseDisplay = shortage ? (isG ? `<strong style="color:var(--red);">${(r.toPurchaseKg * 1000).toFixed(1)} G</strong>` : `<strong style="color:var(--red);">${r.toPurchaseKg.toFixed(3)} KG</strong>`) : '<span style="color:var(--green);font-weight:700;">✓ No Purchase Needed</span>';
                const statusPill = shortage ? `<span style="background:var(--red-light);color:var(--red);border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700;">⚠ Short</span>` : `<span style="background:var(--green-light);color:var(--green);border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700;">✓ OK</span>`;
                return `<tr style="${shortage ? 'background:#fff8f8;' : ''}">
      <td class="td-primary" style="padding:9px 10px;">${r.name}</td>
      <td class="mono" style="padding:9px 10px;font-size:11px;color:var(--text3);">${r.code}</td>
      <td style="padding:9px 10px;font-weight:700;">${reqDisplay}</td>
      <td style="padding:9px 10px;color:${r.availableKg >= r.totalQtyKg ? 'var(--green)' : 'var(--red)'};font-weight:600;">${availDisplay}</td>
      <td style="padding:9px 10px;color:${shortage ? 'var(--red)' : 'var(--text3)'};">${shortfallDisplay}</td>
      <td style="padding:9px 10px;">${purchaseDisplay}</td>
      <td style="padding:9px 10px;">${statusPill}</td>
      ${can('viewCost') ? `<td class="cost-tag" style="padding:9px 10px;">${fmtCurrency(r.totalCost)}</td>` : ''}
    </tr>`;
            }).join('');

            const shortageAlert = totalShortage > 0
                ? `<div style="background:#fef2f2;border:1.5px solid #fca5a5;border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--red);font-weight:600;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> ${totalShortage} raw material(s) have insufficient stock — see "To Purchase" column.</div>`
                : `<div style="background:var(--green-light);border:1.5px solid #6ee7b7;border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--green);font-weight:600;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> All raw materials are sufficiently stocked — no purchases needed!</div>`;

            resultEl.innerHTML = `
    ${shortageAlert}
    <div style="background:var(--bg2);border:1.5px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-md);">
      <div style="background:#0f172a;padding:16px 20px;">
        <div style="font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;">Production Plan</div>
        <div style="display:flex;flex-wrap:wrap;">${prodPills}</div>
      </div>
      <div style="padding:0;">
        <div style="overflow-x:auto;">
          <table style="width:100%;border-collapse:collapse;">
            <thead>
              <tr style="background:#1e293b;">
                <th style="padding:10px 10px;font-size:10px;font-weight:700;color:#94a3b8;text-align:left;text-transform:uppercase;letter-spacing:.6px;white-space:nowrap;">Raw Material</th>
                <th style="padding:10px 10px;font-size:10px;font-weight:700;color:#94a3b8;text-align:left;text-transform:uppercase;letter-spacing:.6px;">Code</th>
                <th style="padding:10px 10px;font-size:10px;font-weight:700;color:#fbbf24;text-align:left;text-transform:uppercase;letter-spacing:.6px;white-space:nowrap;">Required</th>
                <th style="padding:10px 10px;font-size:10px;font-weight:700;color:#34d399;text-align:left;text-transform:uppercase;letter-spacing:.6px;white-space:nowrap;">Available</th>
                <th style="padding:10px 10px;font-size:10px;font-weight:700;color:#f87171;text-align:left;text-transform:uppercase;letter-spacing:.6px;white-space:nowrap;">Shortfall</th>
                <th style="padding:10px 10px;font-size:10px;font-weight:700;color:#fb923c;text-align:left;text-transform:uppercase;letter-spacing:.6px;white-space:nowrap;">To Purchase</th>
                <th style="padding:10px 10px;font-size:10px;font-weight:700;color:#94a3b8;text-align:left;text-transform:uppercase;letter-spacing:.6px;">Status</th>
                ${can('viewCost') ? '<th style="padding:10px 10px;font-size:10px;font-weight:700;color:#94a3b8;text-align:left;text-transform:uppercase;letter-spacing:.6px;">Cost</th>' : ''}
              </tr>
            </thead>
            <tbody>${rmRows}</tbody>
            <tfoot>
              <tr style="background:var(--bg3);border-top:2px solid var(--border);">
                <td colspan="2" style="padding:12px 10px;font-size:12px;font-weight:800;color:var(--text);">TOTAL — ${grandKg.toFixed(2)} KG</td>
                <td style="padding:12px 10px;font-weight:800;color:var(--text);">${grandKg.toFixed(3)} KG</td>
                <td colspan="${can('viewCost') ? 4 : 4}"></td>
                ${can('viewCost') ? `<td class="cost-tag" style="padding:12px 10px;font-size:14px;font-weight:800;">${fmtCurrency(grandCost)}</td>` : ''}
              </tr>
            </tfoot>
          </table>
        </div>
        ${can('viewCost') ? `
        <div style="padding:16px 20px;border-top:1px solid var(--border);">
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;">
            <div style="background:var(--green-light);border:1px solid #a7f3d0;border-radius:10px;padding:14px;text-align:center;">
              <div style="font-size:10px;font-weight:700;color:#065f46;text-transform:uppercase;letter-spacing:.7px;">RM Cost</div>
              <div class="cost-tag" style="font-size:20px;font-weight:800;margin-top:6px;">${fmtCurrency(grandCost)}</div>
            </div>
            <div style="background:var(--blue-light);border:1px solid #93c5fd;border-radius:10px;padding:14px;text-align:center;">
              <div style="font-size:10px;font-weight:700;color:#1e40af;text-transform:uppercase;letter-spacing:.7px;">+Packaging</div>
              <div style="font-size:20px;font-weight:800;color:var(--blue);margin-top:6px;">${fmtCurrency(grandPkg)}</div>
            </div>
            <div style="background:#0f172a;border-radius:10px;padding:14px;text-align:center;">
              <div style="font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.7px;">COST / KG</div>
              <div style="font-size:32px;font-weight:900;color:#fbbf24;font-family:'JetBrains Mono',monospace;letter-spacing:-1px;margin-top:4px;">${fmtCurrency(costPerKg)}</div>
            </div>

            <span class="cost-tag" style="font-size:22px;font-weight:900;">${fmtCurrency(grandTotal)}</span>
          </div>
        </div>`: ''}

            // Show export buttons

            if (pdfBtn) pdfBtn.style.display = 'flex';

        function ssScalerExportExcel() {
            const d = window._ssLastResult;
            if (!d) { toast('Run calculation first', 'error'); return; }
            const headers = ['Raw Material', 'Code', 'Required Qty (KG)', 'Available Stock (KG)', 'Shortfall (KG)', 'To Purchase (KG)', 'Status'];
            if (can('viewCost')) headers.push('Cost (₹)');
            const data = [
                [`Batch Scaler Report — Generated: ${d.generatedAt}`],
                [`Products: ${d.products.map(p => p.name + ' ' + p.reqKg + 'KG').join(' | ')}`],
                [],
                headers
            ];
            d.rmTotals.forEach(r => {
                const row = [r.name, r.code, r.totalQtyKg.toFixed(3), r.availableKg.toFixed(3), r.shortfallKg.toFixed(3), r.toPurchaseKg.toFixed(3), r.shortfallKg > 0 ? 'PURCHASE NEEDED' : 'OK'];
                if (can('viewCost')) row.push(r.totalCost.toFixed(2));
                data.push(row);
            });
            data.push([]);
            if (can('viewCost')) {
                data.push(['', '', '', '', '', 'RM Cost (₹)', d.grandCost.toFixed(2)]);
                data.push(['', '', '', '', '', '+Packaging (₹)', d.grandPkg.toFixed(2)]);
                data.push(['', '', '', '', '', 'TOTAL COST (₹)', d.grandTotal.toFixed(2)]);
                data.push(['', '', '', '', '', 'COST / KG (₹)', (d.grandKg > 0 ? d.grandTotal / d.grandKg : 0).toFixed(2)]);
            }
            dlExcel(data, `BatchScaler_${nowDate()}`);
        }

        function ssScalerPrintPDF() {
            const d = window._ssLastResult;
            if (!d) { toast('Run calculation first', 'error'); return; }
            const printDate = new Date().toLocaleDateString('en-IN', { day: '2-digit', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
            const showCost = can('viewCost');

            const prodRows = d.products.map((p, i) => `<tr><td>${i + 1}</td><td><strong>${p.name}</strong></td><td>${p.reqKg} KG</td><td>${p.baseKg.toFixed(3)} KG</td><td>×${p.scaleFactor.toFixed(4)}</td></tr>`).join('');

        function normalizeGASTime(val) {
            // Google Sheets returns time cells as full Date strings like
            // "Sat Dec 30 1899 14:30:00 GMT+0530 (India Standard Time)"
            // We extract just "HH:MM" so parseTime() works correctly.
            if (!val) return '';
            const s = String(val).trim();
            // Already in HH:MM format
            if (/^\d{1,2}:\d{2}$/.test(s)) return s;
            // Try to extract HH:MM from a Date string
            const match = s.match(/(\d{1,2}):(\d{2}):\d{2}/);
            if (match) return match[1].padStart(2, '0') + ':' + match[2];
            // Try JS Date parse as last resort
            const d = new Date(s);
            if (!isNaN(d.getTime())) return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
            return s; // return as-is; parseTime will return null and calcProdMetrics will bail
        }
        function parseTime(str) { // "HH:MM" → minutes since midnight
            if (!str) return null;
            const [h, m] = (str || '').split(':').map(Number);
            return h * 60 + (m || 0);
        }
        function calcProdMetrics(log) {
            const start = parseTime(log.startTime);
            const end = parseTime(log.endTime);
            if (start === null || end === null) return null;
            let totalMins = end - start;
            if (totalMins <= 0) totalMins += 1440; // crosses midnight
            const breakMins = Number(log.breakMins) || 0;
            const machineRunMins = Math.max(0, totalMins - breakMins);
            const machineRunHrs = machineRunMins / 60;
            const manHrs = machineRunHrs; // same period

            const rmInput = Number(log.rmInput) || 0;
            const fgOutput = Number(log.fgOutput) || 0;
            const wastage = rmInput > 0 ? Math.max(0, ((rmInput - fgOutput) / rmInput) * 100) : 0;
            const kgPerHr = machineRunHrs > 0 ? fgOutput / machineRunHrs : 0;

            // Machine efficiency = (actual kg/hr) / (standard kg/hr) * 100  — use machine's stdKgHr if set, else 100 as denominator
            const machine = DB.machines.find(m => m.id === log.machineId);
            const stdKgHr = machine?.stdKgHr || kgPerHr || 1;
            const machineEff = stdKgHr > 0 ? Math.min(200, (kgPerHr / stdKgHr) * 100) : 0;

            // Costing
            const hourlyMachineCost = machine?.hourlyMachineCost || 0;
            const machineCost = machineRunHrs * hourlyMachineCost;
            const labourCost = manHrs * (DB.labourRate || 60);
            const totalCost = machineCost + labourCost;
            const convCostPerKg = fgOutput > 0 ? totalCost / fgOutput : 0;

            // Formulation (theoretical) cost per kg

            }
            const totalActualPerKg = convCostPerKg + formulationCostPerKg;

            return {
                machineRunMins, machineRunHrs, manHrs, kgPerHr, wastage, machineEff,
                machineCost, labourCost, totalCost, convCostPerKg, formulationCostPerKg, totalActualPerKg,
                stdKgHr

        }

    .header h1{font-size:18px;font-weight:700;}
    .header .sub{font-size:11px;opacity:.75;margin-top:3px;}

    .kpi .kv{font-size:20px;font-weight:800;color:#0f172a;margin-top:3px;}
    h2{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#334155;margin-bottom:8px;margin-top:18px;border-bottom:1px solid #e2e8f0;padding-bottom:4px;}

    .footer{margin-top:20px;border-top:1px solid #e2e8f0;padding-top:10px;display:flex;justify-content:space-between;font-size:10px;color:#94a3b8;}
    @media print{body{padding:12px;}.no-print{display:none;}}
  </style></head><body>
  <div class="no-print" style="text-align:center;margin-bottom:16px;">
    <button onclick="window.print()" style="background:#1e293b;color:#fff;border:none;padding:9px 28px;font-size:12px;cursor:pointer;border-radius:6px;font-weight:600;">🖨 Print / Save as PDF</button>
  </div>
  <div class="header">
    <div><h1>Surface Paints Pvt. Ltd.</h1><div class="sub">Production Reports &amp; Analytics — Generated: ${dtTime}</div></div>
    <div style="text-align:right;font-size:11px;opacity:.8;">${logs.length} total entries<br>${months.length} months</div>
  </div>
  <div class="kpis">
    <div class="kpi"><div class="kl">Total FG Output</div><div class="kv">${totalFG.toFixed(0)} kg</div></div>
    <div class="kpi"><div class="kl">Total RM Input</div><div class="kv">${totalRM.toFixed(0)} kg</div></div>
    <div class="kpi"><div class="kl">Avg Wastage</div><div class="kv ${avgWastage < 5 ? 'good' : avgWastage < 10 ? 'warn' : 'bad'}">${avgWastage.toFixed(1)}%</div></div>
    <div class="kpi"><div class="kl">Total Entries</div><div class="kv">${logs.length}</div></div>
  </div>
  <h2>📅 Monthly Summary</h2>
  <table><thead><tr><th>Month</th><th>Entries</th><th>FG Output (kg)</th><th>RM Input (kg)</th><th>Run Hrs</th><th>Wastage %</th><th>Workers</th></tr></thead><tbody>
  ${months.map(mn => { const w = mn.rmInput > 0 ? ((1 - mn.fgOutput / mn.rmInput) * 100) : 0; return `<tr><td><strong>${mn.month}</strong></td><td>${mn.entries}</td><td>${mn.fgOutput.toFixed(1)}</td><td>${mn.rmInput.toFixed(1)}</td><td>${mn.runHrs.toFixed(2)}</td><td class="${w < 5 ? 'good' : w < 10 ? 'warn' : 'bad'}">${w.toFixed(1)}%</td><td>${mn.workers.size}</td></tr>`; }).join('')}
  </tbody></table>
  <h2>🧑 Worker Productivity</h2>
  <table><thead><tr><th>Worker</th><th>Entries</th><th>FG Output (kg)</th><th>Machine Run Hrs</th><th>Avg kg/hr</th></tr></thead><tbody>
  ${workers.map(w => `<tr><td><strong>${w.name}</strong></td><td>${w.entries}</td><td>${w.fgOutput.toFixed(1)}</td><td>${w.runHrs.toFixed(2)}</td><td>${w.runHrs > 0 ? (w.fgOutput / w.runHrs).toFixed(2) : '—'}</td></tr>`).join('')}
  </tbody></table>
  <h2>🏭 Machine Utilisation</h2>
  <table><thead><tr><th>Machine</th><th>Type</th><th>Entries</th><th>FG Output (kg)</th><th>Run Hrs</th></tr></thead><tbody>
  ${machines.map(mac => `<tr><td><strong>${mac.name}</strong></td><td>${mac.type}</td><td>${mac.entries}</td><td>${mac.fgOutput.toFixed(1)}</td><td>${mac.runHrs.toFixed(2)}</td></tr>`).join('')}
  </tbody></table>
  <h2>📋 All Production Logs</h2>
  <table><thead><tr><th>Date</th><th>Worker(s)</th><th>Product</th><th>Machine</th><th>FG (kg)</th><th>Wastage%</th><th>Eff%</th><th>Conv Cost/kg</th></tr></thead><tbody>
  ${logs.map(log => { const m = calcProdMetrics(log); const mac = DB.machines.find(x => x.id === log.machineId); if (!m) return ''; const wc = m.wastage < 5 ? 'good' : m.wastage < 10 ? 'warn' : 'bad'; const ec = m.machineEff >= 85 ? 'good' : m.machineEff >= 60 ? 'warn' : 'bad'; return `<tr><td>${log.date}</td><td>${log.workerName}</td><td>${log.productName}</td><td>${mac ? mac.name : '#' + log.machineId}</td><td>${log.fgOutput}</td><td class="${wc}">${m.wastage.toFixed(1)}%</td><td class="${ec}">${m.machineEff.toFixed(1)}%</td><td>₹${m.convCostPerKg.toFixed(2)}</td></tr>`; }).join('')}
  </tbody></table>
  <div class="footer">
    <span>Surface Paints Pvt. Ltd. — Production Report</span>
    <span>Generated: ${dtTime}</span>
  </div>
</body></html>`;

            const w = window.open('', '_blank', 'width=1000,height=750');
            w.document.write(html);
            w.document.close();
            setTimeout(() => w.print(), 500);
        }

        // ── Production Entry — Formulation Live Search ───────────────────────────────
        let _peFormIdx = -1; // keyboard navigation index

        function peFormSearch(query) {
            const dropdown = document.getElementById('pe-form-dropdown');
            const clearBtn = document.getElementById('pe-form-clear');
            const q = (query || '').trim().toLowerCase();
            clearBtn.classList.toggle('visible', q.length > 0);

            if (!q) {
                dropdown.classList.remove('open');
                dropdown.innerHTML = '';
                _peFormIdx = -1;
                return;
            }

            const results = DB.formulations.filter(f => {
                return (f.productName || '').toLowerCase().includes(q)
                    || (f.productCode || '').toLowerCase().includes(q)
                    || (f.batchNo || '').toLowerCase().includes(q);
            }).slice(0, 20);

            if (!results.length) {
                dropdown.innerHTML = '<div class="form-search-no-results">No formulations found</div>';
                dropdown.classList.add('open');
                return;
            }

            dropdown.innerHTML = results.map((f, i) => {
                const batchStr = f.batchNo ? `<span>🏷 ${f.batchNo}</span>` : '';
                const dateStr = f.mfgDate ? `<span>📅 ${f.mfgDate.slice(0, 10)}</span>` : '';
                const codeStr = f.productCode ? `<span>🔢 ${f.productCode}</span>` : '';
                return `<div class="form-search-item" data-id="${f.id}" data-idx="${i}"
      onmousedown="peFormSelect(${f.id})"
      onmouseover="peFormHighlight(${i})">
      <div class="form-search-item-name">${f.productName}</div>
      <div class="form-search-item-meta">${batchStr}${dateStr}${codeStr}</div>
    </div>`;
            }).join('');
            _peFormIdx = -1;
            dropdown.classList.add('open');
        }

        function peFormHighlight(idx) {
            _peFormIdx = idx;
            document.querySelectorAll('#pe-form-dropdown .form-search-item').forEach((el, i) => {
                el.classList.toggle('selected', i === idx);
            });
        }

        function peFormSearchKey(e) {
            const dropdown = document.getElementById('pe-form-dropdown');
            const items = dropdown.querySelectorAll('.form-search-item');
            if (!items.length) return;
            if (e.key === 'ArrowDown') { e.preventDefault(); _peFormIdx = Math.min(_peFormIdx + 1, items.length - 1); peFormHighlight(_peFormIdx); }
            else if (e.key === 'ArrowUp') { e.preventDefault(); _peFormIdx = Math.max(_peFormIdx - 1, 0); peFormHighlight(_peFormIdx); }
            else if (e.key === 'Enter' && _peFormIdx >= 0) { e.preventDefault(); const sel = items[_peFormIdx]; if (sel) peFormSelect(Number(sel.dataset.id)); }
            else if (e.key === 'Escape') { peFormClear(); }
        }

        function peFormSelect(fId) {
            const f = DB.formulations.find(x => x.id === fId);
            if (!f) return;
            // set hidden value
            document.getElementById('pe-formulation').value = fId;
            // fill product name field automatically
            const prodInput = document.getElementById('pe-product');
            if (prodInput && !prodInput.value.trim()) {
                prodInput.value = f.productName || '';
            }
            // build display text
            const parts = [f.productName];
            if (f.batchNo) parts.push('Batch: ' + f.batchNo);
            if (f.mfgDate) parts.push('Mfg: ' + f.mfgDate.slice(0, 10));
            document.getElementById('pe-form-search').value = parts.join('  |  ');
            document.getElementById('pe-form-clear').classList.add('visible');
            // show linked badge
            const badge = document.getElementById('pe-form-linked');
            const badgeText = document.getElementById('pe-form-linked-text');
            const metaParts = [];
            if (f.batchNo) metaParts.push('Batch: ' + f.batchNo);
            if (f.mfgDate) metaParts.push('Mfg: ' + f.mfgDate.slice(0, 10));
            if (f.productCode) metaParts.push(f.productCode);
            badgeText.textContent = f.productName + (metaParts.length ? '  —  ' + metaParts.join('  ·  ') : '');
            badge.classList.add('visible');
            // close dropdown
            document.getElementById('pe-form-dropdown').classList.remove('open');
            // trigger calc preview update
            updateProdCalcPreview();
        }

        function peFormClear(silent) {
            document.getElementById('pe-formulation').value = '';
            const si = document.getElementById('pe-form-search');
            if (si) si.value = '';
            const cc = document.getElementById('pe-form-clear');
            if (cc) cc.classList.remove('visible');
            const dd = document.getElementById('pe-form-dropdown');
            if (dd) { dd.classList.remove('open'); dd.innerHTML = ''; }
            const badge = document.getElementById('pe-form-linked');
            if (badge) badge.classList.remove('visible');
            _peFormIdx = -1;
            if (!silent) updateProdCalcPreview();
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', function (e) {
            const wrap = document.querySelector('.form-search-wrap');
            if (wrap && !wrap.contains(e.target)) {
                const dd = document.getElementById('pe-form-dropdown');
                if (dd) dd.classList.remove('open');
            }
        });

        // ── Multi-Machine Entry State ────────────────────────────────────────────────
        window._peMachineEntries = []; // array of entry objects {id, ...}
        window._peMachineCounter = 0;

        function openProdEntryModal() {
            document.getElementById('prod-modal').style.display = 'flex';
            peFormClear(true);
            // reset workers
            window._peWorkers = [];
            const tags = document.getElementById('pe-worker-tags');
            const inp = document.getElementById('pe-worker-input');
            if (tags) tags.innerHTML = '';
            if (inp) { inp.value = ''; inp.placeholder = 'Type or select worker…'; }
            peWorkerWrapStyle();
            // reset dates — clear rows, set today's date in picker, auto-select first shift
            window._peDates = [];
            peDateRenderRows();
            const todayVal = nowDate();
            const dp = document.getElementById('pe-date-picker');
            if (dp) dp.value = todayVal;
            const sp = document.getElementById('pe-shift-picker');
            if (sp && DB.shifts.length > 0) {
                const firstActive = DB.shifts.find(s => s.active);
                if (firstActive) sp.value = String(firstActive.id);
            }
            // reset multi-machine entries
            window._peMachineEntries = [];
            window._peMachineCounter = 0;
            document.getElementById('pe-machine-entries-container').innerHTML = '';
            document.getElementById('pe-totals-bar').style.display = 'none';
            // add first entry by default
            peAddMachineEntry();
        }
        function closeProdModal() {
            document.getElementById('prod-modal').style.display = 'none';
            peFormClear(true);
            window._peWorkers = [];
            window._peDates = [];
            window._peMachineEntries = [];
        }

        // peShiftAutoFill is now a no-op — shift auto-fill is per date-row via peDateRenderRows()
        function peShiftAutoFill() { }

        function peAddMachineEntry() {
            const idx = ++window._peMachineCounter;
            const container = document.getElementById('pe-machine-entries-container');
            const machOpts = DB.machines.filter(m => m.active).map(m => `<option value="${m.id}">${m.name} (${m.type})</option>`).join('');
            // grab shift defaults from first date-row if available
            let defStart = '', defEnd = '';
            if (window._peDates && window._peDates.length > 0) {
                const firstShift = DB.shifts.find(s => String(s.id) === String(window._peDates[0].shiftId));
                if (firstShift) { defStart = firstShift.startTime || ''; defEnd = firstShift.endTime || ''; }
            }
            const card = document.createElement('div');
            card.id = 'pe-me-card-' + idx;
            card.className = 'prod-form-section';
            card.style.cssText = 'border:1.5px solid var(--border);border-radius:12px;margin-bottom:14px;padding:16px;position:relative;background:var(--bg2);';
            card.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
      <div style="display:flex;align-items:center;gap:9px;">
        <div style="width:28px;height:28px;border-radius:8px;background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--accent);">${idx}</div>
        <div class="prod-form-section-title" style="margin-bottom:0;">Machine Entry #${idx}</div>
      </div>
      ${idx > 1 ? `<button type="button" class="btn btn-danger btn-sm" onclick="peRemoveMachineEntry(${idx})" title="Remove this entry">✕ Remove</button>` : '<span style="font-size:11px;color:var(--text3)">First entry</span>'}
    </div>

    <!-- Machine Details sub-section -->
    <div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:8px;padding-bottom:4px;border-bottom:1px dashed var(--border);">
      🏭 Machine Details
    </div>
    <div class="prod-entry-grid" style="margin-bottom:12px;">
      <div class="form-group">
        <label>Machine *</label>
        <select class="form-control pe-me-machine" id="pe-me-machine-${idx}">${machOpts}</select>
      </div>
      <div class="form-group">
        <label>RPM *</label>
        <input class="form-control pe-me-rpm" id="pe-me-rpm-${idx}" type="number" placeholder="e.g. 1200" min="1">
      </div>
      <div class="form-group">
        <label>Hour Meter Reading *</label>
        <input class="form-control pe-me-hourmeter" id="pe-me-hourmeter-${idx}" type="number" placeholder="Meter reading at start" min="0">
      </div>
    </div>

    <!-- Time Details sub-section -->
    <div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:8px;padding-bottom:4px;border-bottom:1px dashed var(--border);">
      ⏱ Time Details
    </div>
    <div class="prod-entry-grid" style="margin-bottom:12px;">
      <div class="form-group">
        <label>Start Time *</label>
        <input class="form-control pe-me-start" id="pe-me-start-${idx}" type="time" value="${defStart}" oninput="peMachineEntriesUpdateTotals()">
      </div>
      <div class="form-group">
        <label>End Time *</label>
        <input class="form-control pe-me-end" id="pe-me-end-${idx}" type="time" value="${defEnd}" oninput="peMachineEntriesUpdateTotals()">
      </div>
      <div class="form-group">
        <label>Break / Lunch (min)</label>
        <input class="form-control pe-me-break" id="pe-me-break-${idx}" type="number" value="30" min="0" placeholder="30" oninput="peMachineEntriesUpdateTotals()">
      </div>
    </div>

    <!-- Material Quantities sub-section -->
    <div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:8px;padding-bottom:4px;border-bottom:1px dashed var(--border);">
      ⚖️ Material Quantities
    </div>
    <div class="prod-entry-grid" style="margin-bottom:4px;">
      <div class="form-group">
        <label>Raw Material Input (kg) *</label>
        <input class="form-control pe-me-rminput" id="pe-me-rminput-${idx}" type="number" step="0.01" placeholder="0.00" oninput="peMachineEntriesUpdateTotals()">
      </div>
      <div class="form-group">
        <label>Finished Goods Output (kg) *</label>
        <input class="form-control pe-me-fgoutput" id="pe-me-fgoutput-${idx}" type="number" step="0.01" placeholder="0.00" oninput="peMachineEntriesUpdateTotals()">
      </div>
    </div>

    <!-- Per-entry calc preview -->
    <div id="pe-me-preview-${idx}" style="margin-top:6px;"></div>
  `;
            container.appendChild(card);
            // Animate in
            card.style.opacity = '0'; card.style.transform = 'translateY(8px)';
            requestAnimationFrame(() => requestAnimationFrame(() => {
                card.style.transition = 'opacity 0.22s ease, transform 0.22s ease';
                card.style.opacity = '1'; card.style.transform = 'translateY(0)';
            }));
            peMachineEntriesUpdateTotals();
        }

        function peRemoveMachineEntry(idx) {
            const card = document.getElementById('pe-me-card-' + idx);
            if (card) {
                card.style.transition = 'opacity 0.2s ease, transform 0.2s ease';
                card.style.opacity = '0'; card.style.transform = 'translateY(-8px) scale(0.98)';
                setTimeout(() => { card.remove(); peMachineEntriesUpdateTotals(); }, 200);
            }
        }

        function peMachineEntriesUpdateTotals() {
            const cards = document.querySelectorAll('[id^="pe-me-card-"]');
            let totalRM = 0, totalFG = 0, totalRunHrs = 0, entriesWithTime = 0;

            cards.forEach(card => {
                const idx = card.id.replace('pe-me-card-', '');
                const startT = document.getElementById('pe-me-start-' + idx)?.value;
                const endT = document.getElementById('pe-me-end-' + idx)?.value;
                const brk = Number(document.getElementById('pe-me-break-' + idx)?.value) || 0;
                const rmIn = Number(document.getElementById('pe-me-rminput-' + idx)?.value) || 0;
                const fgOut = Number(document.getElementById('pe-me-fgoutput-' + idx)?.value) || 0;
                const machId = Number(document.getElementById('pe-me-machine-' + idx)?.value);

                totalRM += rmIn;
                totalFG += fgOut;

                // Per-card preview
                const mock = { startTime: startT, endTime: endT, breakMins: brk, rmInput: rmIn, fgOutput: fgOut, machineId: machId };
                const m = calcProdMetrics(mock);
                const prevEl = document.getElementById('pe-me-preview-' + idx);
                if (prevEl) {
                    if (m && (startT || endT)) {
                        prevEl.innerHTML = `<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;">
          <span style="background:#1e293b;color:#fff;border-radius:7px;padding:4px 11px;font-size:11px;font-weight:700;">⏱ ${m.machineRunHrs.toFixed(2)} hrs run</span>
          <span style="background:${m.kgPerHr > 0 ? '#eff6ff' : '#f8fafc'};color:var(--accent);border-radius:7px;padding:4px 11px;font-size:11px;font-weight:700;border:1px solid #bfdbfe;">📦 ${m.kgPerHr.toFixed(2)} kg/hr</span>
          <span style="background:${m.wastage < 5 ? '#f0fdf4' : m.wastage < 10 ? '#fffbeb' : '#fef2f2'};color:${m.wastage < 5 ? '#059669' : m.wastage < 10 ? '#d97706' : '#dc2626'};border-radius:7px;padding:4px 11px;font-size:11px;font-weight:700;border:1px solid ${m.wastage < 5 ? '#6ee7b7' : m.wastage < 10 ? '#fde68a' : '#fca5a5'};">⚠ ${m.wastage.toFixed(2)}% waste</span>
        </div>`;
                        totalRunHrs += m.machineRunHrs;
                        entriesWithTime++;
                    } else {
                        prevEl.innerHTML = '';
                    }
                }
            });

            // Update totals bar
            const totalBar = document.getElementById('pe-totals-bar');
            const totGrid = document.getElementById('pe-totals-grid');
            if (cards.length > 1 || (totalRM > 0 && totalFG > 0)) {
                totalBar.style.display = 'block';
                const avgWaste = totalRM > 0 ? ((totalRM - totalFG) / totalRM * 100) : 0;
                totGrid.innerHTML = `
      <div style="text-align:center;"><div style="font-size:10px;opacity:.65;text-transform:uppercase;letter-spacing:.6px;">Machines</div><div style="font-size:20px;font-weight:800;">${cards.length}</div></div>
      <div style="text-align:center;"><div style="font-size:10px;opacity:.65;text-transform:uppercase;letter-spacing:.6px;">Total Run Hrs</div><div style="font-size:20px;font-weight:800;">${totalRunHrs.toFixed(2)}</div></div>
      <div style="text-align:center;"><div style="font-size:10px;opacity:.65;text-transform:uppercase;letter-spacing:.6px;">Total RM (kg)</div><div style="font-size:20px;font-weight:800;">${totalRM.toFixed(1)}</div></div>
      <div style="text-align:center;"><div style="font-size:10px;opacity:.65;text-transform:uppercase;letter-spacing:.6px;">Total FG (kg)</div><div style="font-size:20px;font-weight:800;">${totalFG.toFixed(1)}</div></div>
      <div style="text-align:center;"><div style="font-size:10px;opacity:.65;text-transform:uppercase;letter-spacing:.6px;">Avg Wastage</div><div style="font-size:20px;font-weight:800;color:${avgWaste < 5 ? '#4ade80' : avgWaste < 10 ? '#fbbf24' : '#f87171'}">${avgWaste.toFixed(1)}%</div></div>
    `;
            } else {
                totalBar.style.display = 'none';
            }
        }

        function updateProdCalcPreview() {
            // Legacy: now handled per-machine-entry by peMachineEntriesUpdateTotals
            peMachineEntriesUpdateTotals();
        }

        function saveProdEntry() {
            const workers = window._peWorkers || [];
            const workerName = workers.join(', ');
            if (!workerName) { toast('Please add at least one worker (*)', 'error'); return; }

            // Multi-date validation: _peDates is [{date, shiftId}]
            const dateRows = (window._peDates || []).filter(r => r.date && r.shiftId);
            if (!dateRows.length) { toast('Please add at least one date + shift row (*)', 'error'); return; }

            const product = document.getElementById('pe-product').value.trim();
            const formId = document.getElementById('pe-formulation').value;
            const remarks = document.getElementById('pe-remarks').value.trim();

            if (!product) {
                toast('Please fill Material/Product (*)', 'error'); return;
            }

            // Collect all machine entries
            const cards = document.querySelectorAll('[id^="pe-me-card-"]');
            if (!cards.length) { toast('Add at least one Machine Entry', 'error'); return; }

            const machineEntries = [];
            let hasError = false;
            cards.forEach(card => {
                const idx = card.id.replace('pe-me-card-', '');
                const machId = Number(document.getElementById('pe-me-machine-' + idx)?.value);
                const rpm = (document.getElementById('pe-me-rpm-' + idx)?.value || '').trim();
                const hmeter = (document.getElementById('pe-me-hourmeter-' + idx)?.value ?? '').trim();
                const start = document.getElementById('pe-me-start-' + idx)?.value || '';
                const end = document.getElementById('pe-me-end-' + idx)?.value || '';
                const brk = document.getElementById('pe-me-break-' + idx)?.value || '0';
                const rmIn = document.getElementById('pe-me-rminput-' + idx)?.value || '';
                const fgOut = document.getElementById('pe-me-fgoutput-' + idx)?.value || '';
                if (!machId || !start || !end || !rmIn || !fgOut) {
                    toast('Machine Entry #' + idx + ': please fill Machine, Start/End Time, RM Input and FG Output (*)', 'error');
                    hasError = true; return;
                }
                if (!rpm) {
                    toast('Machine Entry #' + idx + ': RPM is required (*)', 'error');
                    hasError = true; return;
                }
                if (hmeter === '') {
                    toast('Machine Entry #' + idx + ': Hour Meter Reading is required (*)', 'error');
                    hasError = true; return;

                machineEntries.push({ machineId: machId, rpm, hourMeter: hmeter, startTime: start, endTime: end, breakMins: Number(brk) || 0, rmInput: Number(rmIn), fgOutput: Number(fgOut) });
            });
            if (hasError) return;

            // Save one production log per machine entry PER DATE ROW
            // Each row has its own date + shift; same machine data, separate records
            const logsToSave = [];
            dateRows.forEach((row, rowIdx) => {
                const shiftObj2 = DB.shifts.find(s => String(s.id) === String(row.shiftId));
                const shiftName2 = shiftObj2 ? shiftObj2.name : '';
                machineEntries.forEach((me, i) => {
                    const id = DB.nextId_prodlog++;
                    const log = {
                        id, workerName, date: row.date, shiftId: Number(row.shiftId), shiftName: shiftName2,
                        productName: product, machineId: me.machineId,
                        rpm: me.rpm, hourMeter: me.hourMeter,
                        startTime: me.startTime, endTime: me.endTime, breakMins: me.breakMins,
                        rmInput: me.rmInput, fgOutput: me.fgOutput,
                        formulationId: formId ? Number(formId) : null,
                        remarks: (rowIdx === 0 && i === 0) ? remarks : '',
                        by: currentUser.username, byName: currentUser.name, createdAt: nowDateTime()

                    toast('⚠ Some entries may not have saved to database. Check connection.', 'error');
                }
            })();
        }

            logs.forEach(l => {
                const mn = l.date.slice(0, 7);
                if (!monthData[mn]) monthData[mn] = { month: mn, entries: 0, fgOutput: 0, rmInput: 0, runHrs: 0, workers: new Set(), products: new Set() };
                const m = calcProdMetrics(l);
                monthData[mn].entries++;
                monthData[mn].fgOutput += Number(l.fgOutput) || 0;
                monthData[mn].rmInput += Number(l.rmInput) || 0;
                if (m) monthData[mn].runHrs += m.machineRunHrs;
                monthData[mn].workers.add(l.workerName);
                monthData[mn].products.add(l.productName);
            });

            // Machine utilisation
            const machineData = {};
            DB.machines.forEach(m => { machineData[m.id] = { name: m.name, type: m.type, runHrs: 0, fgOutput: 0, entries: 0 }; });
            logs.forEach(l => {
                const m = calcProdMetrics(l);
                if (m && machineData[l.machineId]) { machineData[l.machineId].runHrs += m.machineRunHrs; machineData[l.machineId].fgOutput += Number(l.fgOutput) || 0; machineData[l.machineId].entries++; }
            });

            // Worker productivity
            const workerData = {};
            logs.forEach(l => {
                if (!workerData[l.workerName]) workerData[l.workerName] = { name: l.workerName, entries: 0, fgOutput: 0, runHrs: 0 };
                const m = calcProdMetrics(l);
                workerData[l.workerName].entries++;
                workerData[l.workerName].fgOutput += Number(l.fgOutput) || 0;
                if (m) workerData[l.workerName].runHrs += m.machineRunHrs;
            });

            // Total KPIs
            let totFG = 0, totRM = 0, totHrs = 0, totWaste = 0, countW = 0;
            const thisMonthLogs = logs.filter(l => l.date.startsWith(thisMonth));
            thisMonthLogs.forEach(l => {
                totFG += Number(l.fgOutput) || 0; totRM += Number(l.rmInput) || 0;
                const m = calcProdMetrics(l);
                if (m) { totHrs += m.machineRunHrs; totWaste += m.wastage; countW++; }
            });
            const avgWaste = countW > 0 ? (totWaste / countW) : 0;
            const avgKgHr = totHrs > 0 ? (totFG / totHrs) : 0;

            // Bar chart helper
            const barChart = (items, labelKey, valKey, color, unit = '') => {
                const max = Math.max(...items.map(i => i[valKey]), 1);
                return `<div class="bar-chart-horiz">${items.slice(0, 8).map(i => `
      <div class="bar-chart-row">
        <div class="bar-chart-label">${i[labelKey]}</div>
        <div class="bar-chart-track"><div class="bar-chart-fill" style="width:${Math.max(2, (i[valKey] / max) * 100)}%;background:${color}"></div></div>
        <div class="bar-chart-val">${Number(i[valKey]).toFixed(1)}${unit}</div>
      </div>`).join('')}</div>`;
            };

            const macArr = Object.values(machineData);
            const workArr = Object.values(workerData);
            const monthArr = Object.values(monthData).sort((a, b) => b.month.localeCompare(a.month));

            const monthlySummaryRows = monthArr.map(mn => `

      <td>${mn.rmInput.toFixed(1)} kg</td>

    </tr>`).join('');

            const allLogsRows = logs.length ? [...logs].reverse().map(log => {

    </div>

      <option value="">All Machines</option>

        function applyProdFilters() {
            const month = document.getElementById('rpt-month')?.value || '';
            const machId = document.getElementById('rpt-machine')?.value || '';
            const worker = document.getElementById('rpt-worker')?.value || '';
            const product = document.getElementById('rpt-product')?.value || '';

            let filtered = DB.productionLogs;
            if (month) filtered = filtered.filter(l => l.date.startsWith(month));
            if (machId) filtered = filtered.filter(l => l.machineId === Number(machId));
            if (worker) filtered = filtered.filter(l => l.workerName === worker);
            if (product) filtered = filtered.filter(l => l.productName === product);

            const tbody = document.getElementById('prod-rpt-tbody');
            if (!tbody) return;
            tbody.innerHTML = filtered.length ? [...filtered].reverse().map(log => {
                const m = calcProdMetrics(log);
                const mac = DB.machines.find(x => x.id === log.machineId);
                if (!m) return '';
                return `<tr>
      <td>${log.date}</td><td>${log.workerName}</td><td>${log.productName}</td>
      <td><span class="machine-tag" style="font-size:10px">${mac ? mac.name : '#' + log.machineId}</span></td>
      <td>${m.machineRunHrs.toFixed(2)}</td><td>${log.fgOutput}</td>
      <td>${effBadge(m.wastage, 3, 8, '%')}</td>
      <td>${effBadge(m.machineEff, 85, 60, '%')}</td>
      <td class="cost-tag">${fmtCurrency(m.convCostPerKg)}</td>
    </tr>`;
            }).join('') : `<tr><td colspan="9" style="text-align:center;padding:24px;color:var(--text3)">No entries match filters</td></tr>`;
        }

        // ── Export helpers ───────────────────────────────────────────────────────────
        function exportProdExcel() {
            if (typeof XLSX === 'undefined') { toast('XLSX library not loaded', 'error'); return; }
            const rows = DB.productionLogs.map(log => {
                const m = calcProdMetrics(log);
                const mac = DB.machines.find(x => x.id === log.machineId);
                return {
                    Date: log.date, Worker: log.workerName, Product: log.productName,
                    Machine: mac ? mac.name : '#' + log.machineId, RPM: log.rpm,
                    'Start Time': log.startTime, 'End Time': log.endTime, 'Break (min)': log.breakMins,
                    'RM Input (kg)': log.rmInput, 'FG Output (kg)': log.fgOutput,
                    'Machine Run Hrs': m ? m.machineRunHrs.toFixed(2) : '', 'Man Hrs': m ? m.manHrs.toFixed(2) : '',
                    'Avg kg/hr': m ? m.kgPerHr.toFixed(2) : '', 'Wastage %': m ? m.wastage.toFixed(2) : '',
                    'Machine Eff%': m ? m.machineEff.toFixed(1) : '',
                    'Machine Cost': m ? m.machineCost.toFixed(2) : '', 'Labour Cost': m ? m.labourCost.toFixed(2) : '',
                    'Conv Cost/kg': m ? m.convCostPerKg.toFixed(2) : '', 'Hour Meter': log.hourMeter, Remarks: log.remarks
                };
            });
            const ws = XLSX.utils.json_to_sheet(rows);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Production Logs');
            XLSX.writeFile(wb, 'Production_Logs_' + nowDate() + '.xlsx');
            toast('Excel exported ✓', 'success');
        }

        function exportProdReportExcel() {

            const monthData = {};
            DB.productionLogs.forEach(l => {
                const mn = l.date.slice(0, 7);
                if (!monthData[mn]) monthData[mn] = { Month: mn, Entries: 0, 'FG Output (kg)': 0, 'RM Input (kg)': 0, 'Run Hrs': 0 };
                const m = calcProdMetrics(l);
                monthData[mn].Entries++;
                monthData[mn]['FG Output (kg)'] += (Number(l.fgOutput) || 0);
                monthData[mn]['RM Input (kg)'] += (Number(l.rmInput) || 0);
                if (m) monthData[mn]['Run Hrs'] += m.machineRunHrs;
            });
            const monthly = Object.values(monthData).map(r => ({ ...r, 'FG Output (kg)': r['FG Output (kg)'].toFixed(1), 'RM Input (kg)': r['RM Input (kg)'].toFixed(1), 'Run Hrs': r['Run Hrs'].toFixed(2), 'Wastage %': r['RM Input (kg)'] > 0 ? ((1 - (r['FG Output (kg)'] / r['RM Input (kg)'])) * 100).toFixed(1) : '—' }));
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(monthly), 'Monthly Summary');
            // Machine sheet
            const macData = {};
            DB.machines.forEach(m => { macData[m.id] = { 'Machine': m.name, 'Type': m.type, 'Run Hrs': 0, 'FG Output (kg)': 0, 'Entries': 0 }; });
            DB.productionLogs.forEach(l => { const m = calcProdMetrics(l); if (m && macData[l.machineId]) { macData[l.machineId]['Run Hrs'] += m.machineRunHrs; macData[l.machineId]['FG Output (kg)'] += (Number(l.fgOutput) || 0); macData[l.machineId]['Entries']++; } });
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(Object.values(macData)), 'Machine Utilisation');

        // ─────────────────────────────────────────────────────────────────────────────
        //  initForecasting
        // ─────────────────────────────────────────────────────────────────────────────
        function initForecasting() {
            _fcOrders = [];
            _fcActiveIdx = null;
            _fcFilterDate = new Date().toISOString().slice(0, 10); // default today
            _fcViewMode = 'summary';
            const existing = _fcBuildOrdersFromDB();

                _fcOrders = existing;
