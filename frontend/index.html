        // ─────────────────────────────────────────────────────────────────────────────
        //  fcLoadOrders — sync from GAS then re-render
        // ─────────────────────────────────────────────────────────────────────────────
        async function fcLoadOrders() {
            if (_fcLoading) return;
            _fcLoading = true;
            _fcSetState('loading');
            const btn = document.getElementById('fc-refresh-btn');
            if (btn) { btn.disabled = true; btn.innerHTML = '<div class="spinner" style="width:13px;height:13px;border-color:#bfdbfe;border-top-color:var(--accent)"></div> Syncing…'; }
            try {
                await loadFromGAS();
                _fcOrders = _fcBuildOrdersFromDB();
                _fcActiveIdx = null;
                _fcRenderOrders();
                toast(_fcOrders.length
                    ? 'Loaded ' + _fcOrders.length + ' orders ✓'
                    : 'ForecastInput table is empty — add rows first', _fcOrders.length ? 'success' : 'info');
            } catch (e) {
                _fcOrders = _fcBuildOrdersFromDB();
                _fcRenderOrders();
                if (!_fcOrders.length) _fcSetState('empty');
            } finally {
                _fcLoading = false;
                if (btn) { btn.disabled = false; btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg> Sync from Database'; }
            }
        }

        // ─────────────────────────────────────────────────────────────────────────────
        //  Date helpers
        // ─────────────────────────────────────────────────────────────────────────────
        function _fcFmtDate(d) {
            if (!d) return '';
            const s = String(d).trim().slice(0, 16).replace('T', ' ');
            const m = s.match(/^(\d{4})-(\d{2})-(\d{2})\s+(\d{2}:\d{2})$/);
            if (m) return m[3] + '/' + m[2] + '/' + m[1] + '  ' + m[4];
            return s;
        }

        // ─────────────────────────────────────────────────────────────────────────────
        //  _fcBuildOrdersFromDB — client-side forecast calculation
        //  Uses reference batch BOM × scale factor to get per-RM requirement
        // ─────────────────────────────────────────────────────────────────────────────
        function _fcBuildOrdersFromDB() {
            const rawRows = DB.forecastInputRows || [];
            if (!rawRows.length) return [];

            const batchMap = {};
            DB.formulations.forEach(f => { if (f.batchNo) batchMap[f.batchNo.trim().toLowerCase()] = f; });

            return rawRows.map((row, idx) => {
                const batchNo = (row.batchNo || '').trim();
                const refNo = (row.refNo || '').trim();
                const prodName = (row.productName || '').trim();
                const orderQty = Number(row.orderQty) || 0;
                const rowIndex = Number(row.rowIndex) || (idx + 2);
                // Normalize date — orderDate arrives as "YYYY-MM-DD HH:MM:SS" from GAS
                const orderDate = (row.orderDate || '').trim();
                const createdAt = (row.createdAt || '').trim();

                if (!batchNo || orderQty <= 0) {
                    return {
                        rowIndex, batchNo, refNo, productName: prodName, orderQty,
                        orderDate, createdAt, by: row.by || '',
                        status: 'error', error: !batchNo ? 'Batch No missing' : 'Order Qty must be > 0',
                        formulation: null, forecast: null
                    };
                }

                const fm = batchMap[batchNo.toLowerCase()];
                if (!fm) {
                    return {
                        rowIndex, batchNo, refNo, productName: prodName, orderQty,
                        orderDate, createdAt, by: row.by || '',
                        status: 'error', error: 'Batch "' + batchNo + '" not found in Formulations',
                        formulation: null, forecast: null
                    };
                }

                const items = fm.items || [];
                // Original batch weight in KG (sum all BOM items)
                const origBatchKg = items.reduce((s, it) => {
                    const u = (it.unit || 'KG').toUpperCase();
                    return s + ((u === 'G' || u === 'ML') ? (it.qty || 0) / 1000 : (it.qty || 0));
                }, 0);

                // Scale factor: how many times the base BOM batch fits in the order
                const scaleFactor = origBatchKg > 0 ? orderQty / origBatchKg : 1;

                let shortItems = 0, totalReqKg = 0, totalShortKg = 0, totalExcessKg = 0;
                const rows = items.map(it => {
                    const rm = getRMById(it.rmId);
                    if (!rm) return null;
                    const origQty = it.qty || 0;
                    const unit = (it.unit || rm.unit || 'KG').toUpperCase();
                    const origKg = (unit === 'G' || unit === 'ML') ? origQty / 1000 : origQty;
                    const reqKg = origKg * scaleFactor;
                    const available = getInvByRMId(it.rmId).quantity || 0;
                    const shortQty = Math.max(0, reqKg - available);
                    const excessQty = Math.max(0, available - reqKg);
                    totalReqKg += reqKg;
                    totalShortKg += shortQty;
                    totalExcessKg += excessQty;
                    if (shortQty > 0) shortItems++;
                    return {
                        rmId: it.rmId, rmName: rm.name, rmCode: rm.code, category: rm.category || '',
                        origUnit: unit, origQty, origKg, scaleFactor,
                        reqKg, available, shortQty, excessQty,
                        status: shortQty > 0 ? 'Procurement Required' : 'Available in Inventory'
                    };
                }).filter(Boolean);

                return {
                    rowIndex, batchNo, refNo,
                    productName: prodName || fm.productName,
                    orderQty, orderDate, createdAt, by: row.by || '',
                    status: 'ok', error: null,
                    formulation: {
                        id: fm.id, productName: fm.productName, productCode: fm.productCode,
                        batchNo: fm.batchNo, mfgDate: fm.mfgDate, origBatchKg, scaleFactor
                    },
                    forecast: {
                        rows, totalMaterials: rows.length,
                        availableCount: rows.length - shortItems, shortItemCount: shortItems,
                        totalRequiredKg: totalReqKg, totalShortKg, totalExcessKg,
                        procurementRequired: shortItems > 0
                    }
                };
            });
        }

        // ─────────────────────────────────────────────────────────────────────────────
        //  State / filter helpers
        // ─────────────────────────────────────────────────────────────────────────────
        function _fcSetState(state) {
            ['fc-howto', 'fc-kpi-grid', 'fc-filter-bar', 'fc-view-summary', 'fc-view-consolidated',
                'fc-orders-wrap', 'fc-detail-panel', 'fc-state-loading', 'fc-state-empty']
                .forEach(id => { const el = document.getElementById(id); if (el) el.style.display = 'none'; });
            const xls = document.getElementById('fc-xls-btn');
            const xlsAll = document.getElementById('fc-xls-all-btn');
            if (state === 'loading') {
                const el = document.getElementById('fc-state-loading'); if (el) el.style.display = 'flex';
            } else if (state === 'empty') {
                const el = document.getElementById('fc-howto'); if (el) el.style.display = 'flex';
                const el2 = document.getElementById('fc-state-empty'); if (el2) el2.style.display = 'block';
            } else if (state === 'ready') {
                const el = document.getElementById('fc-kpi-grid'); if (el) el.style.display = 'grid';
                const el2 = document.getElementById('fc-filter-bar'); if (el2) el2.style.display = 'block';
                if (xls) xls.style.display = ''; if (xlsAll) xlsAll.style.display = '';
            }
        }

        function _fcGetFiltered() {
            let orders = _fcOrders;
            // Date filter
            if (_fcFilterDate === '_week_') {
                const today = new Date(); today.setHours(0, 0, 0, 0);
                const wEnd = new Date(today); wEnd.setDate(wEnd.getDate() + 6);
                orders = orders.filter(o => {
                    const d = new Date((o.orderDate || o.createdAt || '').slice(0, 10));
                    return !isNaN(d) && d >= today && d <= wEnd;
                });
            } else if (_fcFilterDate === '_lastweek_') {
                const today = new Date(); today.setHours(0, 0, 0, 0);
                const wStart = new Date(today); wStart.setDate(wStart.getDate() - 7);
                const wEnd = new Date(today); wEnd.setDate(wEnd.getDate() - 1);
                orders = orders.filter(o => {
                    const d = new Date((o.orderDate || o.createdAt || '').slice(0, 10));
                    return !isNaN(d) && d >= wStart && d <= wEnd;
                });
            } else if (_fcFilterDate) {
                orders = orders.filter(o => (o.orderDate || o.createdAt || '').slice(0, 10) === _fcFilterDate);
            }
            // Search filter
            const q = (document.getElementById('fc-search')?.value || '').toLowerCase().trim();
            if (q) {
                orders = orders.filter(o =>
                    (o.productName || '').toLowerCase().includes(q) ||
                    (o.batchNo || '').toLowerCase().includes(q) ||
                    (o.refNo || '').toLowerCase().includes(q));
            }
            return orders;
        }

        function fcApplyFilter() {
            const inp = document.getElementById('fc-date-filter');
            _fcFilterDate = inp ? inp.value : '';
            _fcActiveIdx = null;
            _fcRenderCurrentView();
            _fcUpdateFilterInfo();
        }

        function fcApplySearch() {
            _fcActiveIdx = null;
            _fcRenderCurrentView();
            _fcUpdateFilterInfo();
        }

        function fcSetDateChip(chip) {
            const today = new Date();
            const toStr = d => d.toISOString().slice(0, 10);
            const inp = document.getElementById('fc-date-filter');
            ['today', 'yesterday', 'week', 'lastweek', 'all'].forEach(c => {
                const btn = document.getElementById('fc-chip-' + c); if (!btn) return;
                if (c === chip) { btn.style.background = 'var(--accent)'; btn.style.color = '#fff'; btn.style.border = 'none'; }
                else { btn.style.background = 'var(--bg3)'; btn.style.color = 'var(--text2)'; btn.style.border = '1.5px solid var(--border)'; }
            });
            if (chip === 'today') {
                _fcFilterDate = toStr(today); if (inp) inp.value = _fcFilterDate;
            } else if (chip === 'yesterday') {
                const y = new Date(today); y.setDate(y.getDate() - 1); _fcFilterDate = toStr(y); if (inp) inp.value = _fcFilterDate;
            } else if (chip === 'week') {
                _fcFilterDate = '_week_'; if (inp) inp.value = '';
            } else if (chip === 'lastweek') {
                _fcFilterDate = '_lastweek_'; if (inp) inp.value = '';
            } else {
                _fcFilterDate = ''; if (inp) inp.value = '';
            }
            _fcActiveIdx = null;
            _fcRenderCurrentView();
            _fcUpdateFilterInfo();
        }

        function _fcUpdateFilterInfo() {
            const el = document.getElementById('fc-filter-info');
            if (!el) return;
            const filtered = _fcGetFiltered();
            const total = _fcOrders.length;
            const q = (document.getElementById('fc-search')?.value || '').trim();
            let msg = '';
            if (_fcFilterDate === '_week_') {
                msg += `📅 This week: showing <strong>${filtered.length}</strong> of ${total} orders`;
            } else if (_fcFilterDate === '_lastweek_') {
                msg += `📅 Last 7 days: showing <strong>${filtered.length}</strong> of ${total} orders`;
            } else if (_fcFilterDate) {
                msg += `📅 <strong>${_fcFmtDate(_fcFilterDate + ' 00:00').split('  ')[0]}</strong>: showing <strong>${filtered.length}</strong> of ${total} orders`;
            } else {
                msg += `Showing all <strong>${total}</strong> orders`;
            }
            if (q) msg += ` · search: "<em>${_esc(q)}</em>"`;
            if (filtered.length !== total)
                msg += ` &nbsp;<span style="color:var(--accent);cursor:pointer;" onclick="fcSetDateChip('all')">Show all</span>`;
            el.innerHTML = msg;
        }

        function fcSwitchView(mode) {
            _fcViewMode = mode;
            _fcActiveIdx = null;
            ['summary', 'consolidated', 'orders'].forEach(m => {
                const btn = document.getElementById('fc-btn-' + m); if (!btn) return;
                if (m === mode) { btn.style.background = 'var(--accent)'; btn.style.color = '#fff'; btn.style.borderColor = 'var(--accent)'; }
                else { btn.style.background = 'var(--bg3)'; btn.style.color = 'var(--text2)'; btn.style.borderColor = 'var(--border)'; }
            });
            _fcRenderCurrentView();
        }

        function _fcRenderCurrentView() {
            ['fc-view-summary', 'fc-view-consolidated', 'fc-orders-wrap', 'fc-detail-panel']
                .forEach(id => { const el = document.getElementById(id); if (el) el.style.display = 'none'; });
            const filtered = _fcGetFiltered();
            _fcUpdateKPI(filtered);
            if (_fcViewMode === 'summary') {
                const el = document.getElementById('fc-view-summary');
                if (el) { el.style.display = 'block'; el.innerHTML = _fcBuildSummaryView(filtered); }
            } else if (_fcViewMode === 'consolidated') {
                const el = document.getElementById('fc-view-consolidated');
                if (el) { el.style.display = 'block'; el.innerHTML = _fcBuildConsolidatedView(filtered); }
            } else {
                const wrap = document.getElementById('fc-orders-wrap');
                if (wrap) { wrap.style.display = 'block'; wrap.innerHTML = _fcBuildOrdersView(filtered); }
            }
        }

        function _fcUpdateKPI(filtered) {
            const kpiGrid = document.getElementById('fc-kpi-grid'); if (!kpiGrid) return;
            const valid = filtered.filter(o => o.status === 'ok' && o.forecast);
            const shortCnt = valid.filter(o => o.forecast.procurementRequired).length;
            const readyCnt = valid.length - shortCnt;
            const totalKg = valid.reduce((s, o) => s + o.orderQty, 0);
            kpiGrid.innerHTML = [
                { icon: '📋', label: 'Orders', value: filtered.length, sub: 'In selected range', color: 'blue' },
                { icon: '🏭', label: 'FG Products', value: valid.length, sub: 'Can be calculated', color: 'purple' },
                { icon: '✅', label: 'Ready to Produce', value: readyCnt, sub: 'All RM in stock', color: 'green' },
                { icon: '⚠️', label: 'Need Procurement', value: shortCnt, sub: shortCnt ? 'RM shortage' : 'All clear', color: shortCnt ? 'red' : 'green' },
                { icon: '⚖️', label: 'Total Order Qty', value: totalKg.toFixed(1) + ' KG', sub: 'Combined weight', color: 'teal' },
            ].map(k => `
    <div class="forecast-kpi">
      <div class="forecast-kpi-icon" style="background:var(--${k.color}-light)">${k.icon}</div>
      <div class="forecast-kpi-label">${k.label}</div>
      <div class="forecast-kpi-value" style="${(k.color === 'red' || k.color === 'green') && k.value !== 0 ? 'color:var(--' + k.color + ')' : ''}">${k.value}</div>
      <div class="forecast-kpi-sub">${k.sub}</div>
    </div>`).join('');
        }

        // ─────────────────────────────────────────────────────────────────────────────
        //  _fcRenderOrders — called after sync, sets defaults and renders
        // ─────────────────────────────────────────────────────────────────────────────
        function _fcRenderOrders() {
            if (!_fcOrders.length) { _fcSetState('empty'); return; }
            _fcSetState('ready');
            _fcViewMode = 'summary';
            if (!_fcFilterDate) _fcFilterDate = new Date().toISOString().slice(0, 10);
            // Activate today chip
            setTimeout(() => { fcSetDateChip('today'); _fcUpdateFilterInfo(); }, 60);
        }

        // ─────────────────────────────────────────────────────────────────────────────
        //  SUMMARY VIEW
        // ─────────────────────────────────────────────────────────────────────────────
        function _fcBuildSummaryView(filtered) {
            const valid = filtered.filter(o => o.status === 'ok' && o.forecast);
            const errors = filtered.filter(o => o.status === 'error');

            if (!filtered.length) {
                return `<div class="forecast-empty">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <h3>No orders for the selected date / search</h3>
      <p>Try "All Orders" or change the date filter.</p></div>`;
            }

            // ── 1. FG Production list at the TOP ──────────────────────────────────────
            const fgMap = {};
            valid.forEach(o => {
                const key = o.productName;
                if (!fgMap[key]) fgMap[key] = { productName: key, orders: [], totalQty: 0, anyShort: false, totalShortKg: 0 };
                fgMap[key].orders.push(o);
                fgMap[key].totalQty += o.orderQty;
                if (o.forecast.procurementRequired) { fgMap[key].anyShort = true; fgMap[key].totalShortKg += o.forecast.totalShortKg; }
            });
            const fgList = Object.values(fgMap);

            let html = '';

            // FG header card
            html += `<div class="card" style="padding:18px;margin-bottom:16px;border-left:4px solid var(--accent);">
    <div class="card-title" style="margin-bottom:12px">
      🏭 Finished Goods to Produce — ${_fcFilterDate && _fcFilterDate !== '_week_' ? _fcFmtDate(_fcFilterDate + ' 00:00').split('  ')[0] : 'Selected Period'}
      <span style="font-size:11px;font-weight:400;color:var(--text3);margin-left:8px">${valid.length} orders · ${fgList.length} products</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;">
    ${fgList.map(fg => `
      <div style="display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--bg3);border-radius:10px;border-left:3px solid ${fg.anyShort ? 'var(--red)' : 'var(--green)'};">
        <div style="flex:1;min-width:0;">
          <div style="font-size:13px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${_esc(fg.productName)}">${_esc(fg.productName)}</div>
          <div style="font-size:11px;color:var(--text3);margin-top:2px;">${fg.orders.length} order${fg.orders.length > 1 ? 's' : ''} · <strong>${fg.totalQty} KG</strong></div>
        </div>
        ${fg.anyShort
                    ? `<span style="background:#fef2f2;color:#dc2626;border:1px solid #fca5a5;border-radius:16px;padding:2px 9px;font-size:11px;font-weight:700;white-space:nowrap;">⚠ Short</span>`
                    : `<span style="background:#f0fdf4;color:#16a34a;border:1px solid #6ee7b7;border-radius:16px;padding:2px 9px;font-size:11px;font-weight:700;white-space:nowrap;">✓ Ready</span>`}
      </div>`).join('')}
    </div>
  </div>`;

            // ── 2. Two-column: order statuses + shortage summary ──────────────────────
            html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;">`;

            // Order status column
            html += `<div class="card" style="padding:18px;">
    <div class="card-title" style="margin-bottom:10px;">📋 Order Status (${filtered.length})</div>
    <div style="display:flex;flex-direction:column;gap:6px;max-height:340px;overflow-y:auto;">
    ${valid.map(o => {
                const fc = o.forecast;
                const gIdx = _fcOrders.indexOf(o);
                return `<div onclick="fcSwitchView('orders');setTimeout(()=>fcExpandOrder(${gIdx}),80)"
        style="display:flex;align-items:center;gap:9px;padding:8px 11px;background:var(--bg3);border-radius:8px;cursor:pointer;border:1px solid ${fc.procurementRequired ? '#fca5a5' : 'var(--border)'};transition:border-color .15s;"
        onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='${fc.procurementRequired ? '#fca5a5' : 'var(--border)'}'">
        <div style="width:7px;height:7px;border-radius:50%;background:${fc.procurementRequired ? 'var(--red)' : 'var(--green)'};flex-shrink:0;"></div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:12px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${_esc(o.productName || o.batchNo)}</div>
          <div style="font-size:11px;color:var(--text3);">${_esc(o.batchNo)} · ${o.orderQty} KG${o.refNo ? ' · ' + _esc(o.refNo) : ''} · ${_fcFmtDate(o.orderDate || o.createdAt).split('  ')[0] || '—'}</div>
        </div>
        <div style="text-align:right;flex-shrink:0;">
          ${fc.shortItemCount > 0
                        ? `<div style="font-size:12px;font-weight:700;color:var(--red);">⚠ ${fc.shortItemCount} short</div><div style="font-size:10px;color:var(--text3);">${fc.totalShortKg.toFixed(1)} KG</div>`
                        : `<div style="font-size:12px;font-weight:700;color:var(--green);">✓ Ready</div>`}
        </div>
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--text3)" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
      </div>`;
            }).join('')}
    ${errors.map(o => `
      <div style="display:flex;align-items:center;gap:9px;padding:8px 11px;background:#fff8f8;border-radius:8px;border:1px solid #fca5a5;">
        <div style="width:7px;height:7px;border-radius:50%;background:var(--red);flex-shrink:0;"></div>
        <div style="flex:1;"><div style="font-size:12px;font-weight:700;color:var(--red);">${_esc(o.batchNo || '?')}</div><div style="font-size:11px;color:var(--text3);">${_esc(o.error)}</div></div>
      </div>`).join('')}
    </div>
  </div>`;

            // Procurement required column
            const shortOrders = valid.filter(o => o.forecast.procurementRequired);
            const rmShortMap = {};
            shortOrders.forEach(o => {
                (o.forecast.rows || []).filter(r => r.shortQty > 0).forEach(r => {
                    if (!rmShortMap[r.rmId]) rmShortMap[r.rmId] = { rmName: r.rmName, rmCode: r.rmCode, category: r.category || '', totalShort: 0, usedIn: [] };
                    rmShortMap[r.rmId].totalShort += r.shortQty;
                    if (!rmShortMap[r.rmId].usedIn.includes(o.productName)) rmShortMap[r.rmId].usedIn.push(o.productName);
                });
            });
            const shorts = Object.values(rmShortMap).sort((a, b) => b.totalShort - a.totalShort);

            html += `<div class="card" style="padding:18px;">
    <div class="card-title" style="margin-bottom:10px;${shorts.length ? 'color:var(--red);' : ''}">
      ${shorts.length ? '⚠ Materials Needed for Procurement (' + shorts.length + ')' : '✅ No Procurement Required'}
    </div>
    ${shorts.length ? `
    <div style="display:flex;flex-direction:column;gap:6px;max-height:340px;overflow-y:auto;">
    ${shorts.map((r, i) => `
      <div style="display:flex;align-items:center;gap:9px;padding:8px 11px;background:#fff8f8;border-radius:8px;border-left:3px solid var(--red);">
        <div style="font-size:11px;color:#94a3b8;min-width:18px;">${i + 1}</div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:12px;font-weight:700;color:var(--text);">${_esc(r.rmName)}</div>
          <div style="font-size:10px;color:var(--text3);">${_esc(r.rmCode)}${r.category ? ' · ' + r.category : ''}</div>
        </div>
        <div style="text-align:right;flex-shrink:0;">
          <div style="font-size:13px;font-weight:800;color:var(--red);">${r.totalShort.toFixed(3)} KG</div>
          <div style="font-size:10px;color:var(--text3);">${r.usedIn.slice(0, 2).join(', ')}${r.usedIn.length > 2 ? '...' : ''}</div>
        </div>
      </div>`).join('')}
    </div>
    <div style="margin-top:10px;">
      <button class="btn btn-danger btn-sm" style="width:100%;justify-content:center;margin-top:4px;" onclick="fcExportProcurementExcel()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export Procurement List to Excel
      </button>
    </div>` : `<div style="text-align:center;padding:40px 20px;color:var(--green);">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      <div style="font-size:14px;font-weight:700;margin-top:8px;">All materials are available!</div>
      <div style="font-size:12px;color:var(--text3);margin-top:4px;">Ready to start production.</div>
    </div>`}
  </div>`;

            html += `</div>`; // end grid

            return html;
        }

        // ─────────────────────────────────────────────────────────────────────────────
        //  CONSOLIDATED RM VIEW — all materials merged across filtered orders
        // ─────────────────────────────────────────────────────────────────────────────
        function _fcBuildConsolidatedView(filtered) {
            const valid = filtered.filter(o => o.status === 'ok' && o.forecast);
            if (!valid.length) return `<div class="forecast-empty"><h3>No valid orders in selected range</h3></div>`;

            // Merge RM requirements across all valid orders
            const rmMap = {};
            valid.forEach(o => {
                (o.forecast.rows || []).forEach(r => {
                    if (!rmMap[r.rmId]) {
                        rmMap[r.rmId] = {
                            rmId: r.rmId, rmName: r.rmName, rmCode: r.rmCode, category: r.category || '',
                            totalReqKg: 0, available: r.available, totalShortKg: 0, usedIn: []
                        };
                    }
                    rmMap[r.rmId].totalReqKg += r.reqKg;
                    rmMap[r.rmId].totalShortKg += r.shortQty;
                    rmMap[r.rmId].available = r.available;
                    if (!rmMap[r.rmId].usedIn.find(x => x === o.productName)) rmMap[r.rmId].usedIn.push(o.productName);
                });
            });
            const allRMs = Object.values(rmMap).sort((a, b) => b.totalReqKg - a.totalReqKg);
            const shortRMs = allRMs.filter(r => r.totalShortKg > 0);
            const readyRMs = allRMs.filter(r => r.totalShortKg <= 0);

            return `<div class="card" style="padding:18px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;">
      <div class="card-title" style="margin:0;">🧪 Consolidated RM Requirement — ${valid.length} orders · ${allRMs.length} materials
        ${shortRMs.length ? `<span style="color:var(--red);font-size:12px;font-weight:700;margin-left:8px;">⚠ ${shortRMs.length} short</span>` : '<span style="color:var(--green);font-size:12px;margin-left:8px;">✓ All clear</span>'}
      </div>
      <div style="display:flex;gap:8px;">
        <div class="search-input-wrap" style="min-width:200px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input class="search-input" id="fc-cons-search" placeholder="Search material..." oninput="filterBITable('fc-cons-search','fc-cons-table')">
        </div>
        <button class="btn btn-secondary btn-sm" onclick="fcExportConsolidatedExcel()">↓ Excel</button>
      </div>
    </div>
    <div class="table-wrap"><table id="fc-cons-table">
      <thead><tr>
        <th>#</th><th>Raw Material</th><th>Code</th><th>Category</th>
        <th style="text-align:right">Total Required (KG)</th>
        <th style="text-align:right">In Stock (KG)</th>
        <th style="text-align:right">Short (KG)</th>
        <th style="text-align:right">Excess (KG)</th>
        <th>Status</th><th>Used In</th>
      </tr></thead>
      <tbody>
      ${allRMs.map((r, i) => {
                const excess = Math.max(0, r.available - r.totalReqKg);
                const isShort = r.totalShortKg > 0;
                return `<tr style="${isShort ? 'background:#fff8f8' : ''}">
          <td style="font-size:11px;color:#94a3b8">${i + 1}</td>
          <td class="td-primary" style="${isShort ? 'color:var(--red)' : ''}">${isShort ? '⚠ ' : ''} ${_esc(r.rmName)}</td>
          <td class="mono" style="font-size:11px;color:#64748b">${_esc(r.rmCode)}</td>
          <td style="font-size:11px;color:var(--text3)">${_esc(r.category)}</td>
          <td style="text-align:right;font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--accent2)">${r.totalReqKg.toFixed(3)}</td>
          <td style="text-align:right;font-family:'JetBrains Mono',monospace">${r.available.toFixed(3)}</td>
          <td style="text-align:right;font-family:'JetBrains Mono',monospace;font-weight:${isShort ? '800' : '400'};color:${isShort ? 'var(--red)' : 'var(--text3)'};">${isShort ? r.totalShortKg.toFixed(3) : '—'}</td>
          <td style="text-align:right;font-family:'JetBrains Mono',monospace;color:${excess > 0 ? 'var(--green)' : 'var(--text3)'};">${excess > 0 ? excess.toFixed(3) : '—'}</td>
          <td>${isShort ? '<span class="forecast-status-short">⚠ Procurement</span>' : '<span class="forecast-status-ok">✓ In Stock</span>'}</td>
          <td style="font-size:11px">${r.usedIn.slice(0, 2).map(n => `<span style="background:var(--accent-light);color:var(--accent2);border-radius:10px;padding:1px 6px;font-size:10px;">${_esc(n)}</span>`).join(' ')}${r.usedIn.length > 2 ? `<span style="color:var(--text3)"> +${r.usedIn.length - 2}</span>` : ''}</td>
        </tr>`;
            }).join('')}
      </tbody>
    </table></div>
    <div class="forecast-summary-bar" style="margin-top:14px">
      <div class="fsb-item"><div class="fsb-label">Total Materials</div><div class="fsb-value">${allRMs.length}</div></div>
      <div class="fsb-item"><div class="fsb-label">In Stock</div><div class="fsb-value green">${readyRMs.length}</div></div>
      <div class="fsb-item"><div class="fsb-label">Short</div><div class="fsb-value ${shortRMs.length ? 'red' : 'green'}">${shortRMs.length}</div></div>
      <div class="fsb-item"><div class="fsb-label">Total Required</div><div class="fsb-value">${allRMs.reduce((s, r) => s + r.totalReqKg, 0).toFixed(2)} KG</div></div>
      <div class="fsb-item"><div class="fsb-label">Total Shortfall</div><div class="fsb-value ${shortRMs.length ? 'red' : 'green'}">${allRMs.reduce((s, r) => s + r.totalShortKg, 0).toFixed(2)} KG</div></div>
    </div>
  </div>`;
        }

        // ─────────────────────────────────────────────────────────────────────────────
        //  ORDER-WISE VIEW
        // ─────────────────────────────────────────────────────────────────────────────
        function _fcBuildOrdersView(filtered) {
            if (!filtered.length) return `<div class="forecast-empty"><h3>No orders in selected range</h3></div>`;
            return `<div class="card-title" style="margin-bottom:12px">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
    Order-wise Detail (${filtered.length})
  </div>`+ filtered.map(o => _fcOrderCard(o, _fcOrders.indexOf(o))).join('');
        }

        // ─────────────────────────────────────────────────────────────────────────────
        //  Order card (collapsible header)
        // ─────────────────────────────────────────────────────────────────────────────
        function _fcOrderCard(o, idx) {
            const isActive = idx === _fcActiveIdx, isErr = o.status === 'error', fc = o.forecast;
            const shortCnt = fc ? fc.shortItemCount : 0;
            const badge = isErr
                ? `<span class="status-pill status-out">⚠ Error</span>`
                : shortCnt > 0
                    ? `<span class="status-pill status-out">⚠ ${shortCnt} Shortage${shortCnt > 1 ? 's' : ''}</span>`
                    : `<span class="status-pill status-ok">✓ All Clear</span>`;
            const borderColor = isErr ? 'var(--red)' : shortCnt > 0 ? '#fca5a5' : isActive ? 'var(--accent)' : 'var(--border)';
            const scaleStr = (o.formulation && o.formulation.scaleFactor)
                ? `<span style="font-size:10px;color:var(--text3);font-family:'JetBrains Mono',monospace"> ×${o.formulation.scaleFactor.toFixed(3)}</span>` : '';
            return `
  <div class="batch-card" id="fc-card-${idx}" style="border-color:${borderColor};cursor:pointer;margin-bottom:8px" onclick="fcExpandOrder(${idx})">
    <div class="batch-card-top">
      <div>
        <div class="batch-card-title">
          ${_esc(o.batchNo || '—')}
          ${o.refNo ? `<span class="forecast-ref-chip">📋 ${_esc(o.refNo)}</span>` : ''}
        </div>
        <div class="batch-card-code">${_esc(o.productName || (o.formulation && o.formulation.productName) || '—')}${scaleStr}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        ${badge}
        <span style="font-size:22px;color:var(--text3);line-height:1;transition:transform .2s" id="fc-chevron-${idx}">${isActive ? '▲' : '▼'}</span>
      </div>
    </div>
    <div class="batch-card-meta">
      <span>📦 Order: <strong>${o.orderQty} KG</strong></span>
      ${o.formulation ? `<span>🏭 Ref batch: ${o.formulation.origBatchKg.toFixed(2)} KG</span>` : ''}
      ${fc ? `<span>🧪 ${fc.totalMaterials} RMs</span>` : ''}
      ${fc ? `<span>✅ ${fc.availableCount} in stock</span>` : ''}
      ${fc && fc.totalShortKg > 0 ? `<span style="color:var(--red)">⚠ Short: ${fc.totalShortKg.toFixed(2)} KG</span>` : ''}
      <span>📅 ${_fcFmtDate(o.orderDate || o.createdAt) || 'No date'}</span>
      ${isErr ? `<span style="color:var(--red)">❌ ${_esc(o.error)}</span>` : ''}
    </div>
  </div>`;
        }

        // ─────────────────────────────────────────────────────────────────────────────
        //  Expand / collapse order detail
        // ─────────────────────────────────────────────────────────────────────────────
        function fcExpandOrder(idx) {
            // Switch to orders view if not already
            if (_fcViewMode !== 'orders') {
                _fcViewMode = 'orders';
                ['summary', 'consolidated', 'orders'].forEach(m => {
                    const btn = document.getElementById('fc-btn-' + m); if (!btn) return;
                    if (m === 'orders') { btn.style.background = 'var(--accent)'; btn.style.color = '#fff'; btn.style.borderColor = 'var(--accent)'; }
                    else { btn.style.background = 'var(--bg3)'; btn.style.color = 'var(--text2)'; btn.style.borderColor = 'var(--border)'; }
                });
                ['fc-view-summary', 'fc-view-consolidated', 'fc-detail-panel'].forEach(id => { const el = document.getElementById(id); if (el) el.style.display = 'none'; });
                const wrap = document.getElementById('fc-orders-wrap');
                if (wrap) { wrap.style.display = 'block'; wrap.innerHTML = _fcBuildOrdersView(_fcGetFiltered()); }
            }
            if (_fcActiveIdx === idx) {
                _fcActiveIdx = null;
                document.getElementById('fc-detail-panel').style.display = 'none';
                _fcOrders.forEach((_, i) => {
                    const ch = document.getElementById('fc-chevron-' + i); if (ch) ch.textContent = '▼';
                    const cd = document.getElementById('fc-card-' + i);
                    if (cd) cd.style.borderColor = _fcOrders[i].status === 'error' ? 'var(--red)' : _fcOrders[i].forecast && _fcOrders[i].forecast.shortItemCount > 0 ? '#fca5a5' : 'var(--border)';
                });
                return;
            }
            if (_fcActiveIdx !== null) {
                const pc = document.getElementById('fc-chevron-' + _fcActiveIdx); if (pc) pc.textContent = '▼';
                const pd = document.getElementById('fc-card-' + _fcActiveIdx);
                if (pd) pd.style.borderColor = _fcOrders[_fcActiveIdx].status === 'error' ? 'var(--red)' : _fcOrders[_fcActiveIdx].forecast && _fcOrders[_fcActiveIdx].forecast.shortItemCount > 0 ? '#fca5a5' : 'var(--border)';
            }
            _fcActiveIdx = idx;
            const ch = document.getElementById('fc-chevron-' + idx); if (ch) ch.textContent = '▲';
            const cd = document.getElementById('fc-card-' + idx); if (cd) cd.style.borderColor = 'var(--accent)';
            const panel = document.getElementById('fc-detail-panel');
            if (!panel) return;
            panel.style.display = 'block';
            panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            const o = _fcOrders[idx];
            if (o.status === 'error') { panel.innerHTML = `<div class="alert alert-error"><strong>Cannot forecast:</strong> ${_esc(o.error)}</div>`; return; }
            panel.innerHTML = _fcDetailHTML(o, o.forecast, o.formulation);
        }

        // ─────────────────────────────────────────────────────────────────────────────
        //  Detail panel — full RM table for one order
        // ─────────────────────────────────────────────────────────────────────────────
        function _fcDetailHTML(o, fc, fm) {
            const rows = fc.rows || [];
            const tableRows = rows.map(r => {
                const isShort = r.shortQty > 0;
                return `<tr class="${isShort ? 'forecast-short-row' : ''}">
      <td><div class="td-rm">${_esc(r.rmName)}</div><div class="td-rm-code">${_esc(r.rmCode)}${r.category ? ' · ' + r.category : ''}</div></td>
      <td class="td-num">${r.origQty.toFixed(3)} <span style="font-size:10px;color:var(--text3)">${r.origUnit}</span></td>
      <td class="td-num" style="color:var(--accent2);font-weight:700">${r.reqKg.toFixed(3)}</td>
      <td><span style="font-size:10px;font-weight:600;color:var(--text3)">KG</span></td>
      <td class="td-num">${r.available.toFixed(3)}</td>
      <td>${isShort ? `<span class="td-short">${r.shortQty.toFixed(3)}</span>` : '<span class="td-zero">—</span>'}</td>
      <td>${!isShort && r.excessQty > 0 ? `<span class="td-excess">${r.excessQty.toFixed(3)}</span>` : '<span class="td-zero">—</span>'}</td>
      <td>${isShort ? '<span class="forecast-status-short">⚠ Procurement Required</span>' : '<span class="forecast-status-ok">✓ Available</span>'}</td>
    </tr>`;
            }).join('');
            return `<div class="card" style="padding:0;overflow:hidden;margin-bottom:0">
    <div style="background:linear-gradient(135deg,#0f172a,#1e3a5f);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
      <div>
        <div style="font-size:15px;font-weight:800;color:#f1f5f9">
          ${_esc(o.productName || fm.productName)} — Order ${o.orderQty} KG
          ${o.refNo ? `<span style="background:rgba(56,189,248,.15);color:#38bdf8;border:1px solid rgba(56,189,248,.3);border-radius:20px;padding:2px 10px;font-size:11px;margin-left:8px">📋 ${_esc(o.refNo)}</span>` : ''}
        </div>
        <div style="font-size:12px;color:#94a3b8;margin-top:3px">
          Ref batch: ${_esc(fm.batchNo)} (${fm.origBatchKg.toFixed(2)} KG) · Scale: <strong style="color:#38bdf8">×${fm.scaleFactor.toFixed(4)}</strong> · ${rows.length} materials
          ${(o.orderDate || o.createdAt) ? `  ·  📅 <strong style="color:#7dd3fc">${_esc(_fcFmtDate(o.orderDate || o.createdAt))}</strong>` : ''}
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-secondary btn-sm" onclick="fcExportAllExcel()">↓ Full Excel</button>
        <button class="btn btn-secondary btn-sm" onclick="fcExportPDF()">📄 PDF</button>
      </div>
    </div>
    <div class="forecast-table-wrap">
      <table class="forecast-table">
        <thead><tr>
          <th>Raw Material</th>
          <th style="text-align:right">BOM Qty</th>
          <th style="text-align:right">Required (KG)</th>
          <th>Unit</th>
          <th style="text-align:right">In Stock (KG)</th>
          <th style="text-align:right">Short (KG)</th>
          <th style="text-align:right">Excess (KG)</th>
          <th>Status</th>
        </tr></thead>
        <tbody>${tableRows}</tbody>
      </table>
    </div>
    <div class="forecast-summary-bar">
      <div class="fsb-item"><div class="fsb-label">Order Weight</div><div class="fsb-value">${o.orderQty} KG</div></div>
      <div class="fsb-item"><div class="fsb-label">Total RM Required</div><div class="fsb-value">${fc.totalRequiredKg.toFixed(2)} KG</div></div>
      <div class="fsb-item"><div class="fsb-label">Short Items</div><div class="fsb-value ${fc.shortItemCount ? 'red' : 'green'}">${fc.shortItemCount}</div></div>
      <div class="fsb-item"><div class="fsb-label">Total Shortfall</div><div class="fsb-value ${fc.totalShortKg > 0 ? 'red' : 'green'}">${fc.totalShortKg.toFixed(2)} KG</div></div>
      <div class="fsb-item"><div class="fsb-label">Total Excess</div><div class="fsb-value green">${fc.totalExcessKg.toFixed(2)} KG</div></div>
      <div class="fsb-item"><div class="fsb-label">Procurement</div><div class="fsb-value ${fc.procurementRequired ? 'red' : 'green'}">${fc.procurementRequired ? '⚠ ACTION NEEDED' : '✓ ALL CLEAR'}</div></div>
    </div>
  </div>`;
        }

        // ─────────────────────────────────────────────────────────────────────────────
        //  EXCEL EXPORTS
        // ─────────────────────────────────────────────────────────────────────────────

        // 1. Procurement export — only short materials, optimized for placing orders
        function fcExportProcurementExcel() {
            const filtered = _fcGetFiltered();
            const valid = filtered.filter(o => o.status === 'ok' && o.forecast && o.forecast.procurementRequired);
            if (!valid.length) { toast('No procurement needed for selected orders', 'info'); return; }

            const wb = XLSX.utils.book_new();
            const dateLabel = _fcFilterDate && _fcFilterDate !== '_week_' ? _fcFmtDate(_fcFilterDate + ' 00:00').split('  ')[0] : 'All';

            // Sheet 1: Procurement List (consolidated unique RMs)
            const rmShortMap = {};
            valid.forEach(o => {
                (o.forecast.rows || []).filter(r => r.shortQty > 0).forEach(r => {
                    if (!rmShortMap[r.rmId]) rmShortMap[r.rmId] = { rmName: r.rmName, rmCode: r.rmCode, category: r.category || '', totalShort: 0, usedIn: [], orders: [] };
                    rmShortMap[r.rmId].totalShort += r.shortQty;
                    if (!rmShortMap[r.rmId].usedIn.includes(o.productName)) rmShortMap[r.rmId].usedIn.push(o.productName);
                    rmShortMap[r.rmId].orders.push({ product: o.productName, orderQty: o.orderQty, shortQty: r.shortQty });
                });
            });
            const shorts = Object.values(rmShortMap).sort((a, b) => b.totalShort - a.totalShort);

            const procData = [
                ['PROCUREMENT ORDER LIST — Surface Paints Pvt. Ltd.'],
                ['Date: ' + dateLabel + '    Generated: ' + new Date().toLocaleString('en-IN')],
                ['Total items to procure: ' + shorts.length],
                [],
                ['#', 'Raw Material', 'Code', 'Category', 'Qty to Purchase (KG)', 'Used In Products', 'Remarks'],
                ...shorts.map((r, i) => [i + 1, r.rmName, r.rmCode, r.category, r.totalShort.toFixed(3), r.usedIn.join(' / '), '']),
                [],
                ['TOTAL', '', '', '', shorts.reduce((s, r) => s + r.totalShort, 0).toFixed(3), '', ''],
            ];
            const ws1 = XLSX.utils.aoa_to_sheet(procData);
            ws1['!cols'] = [{ wch: 5 }, { wch: 32 }, { wch: 12 }, { wch: 14 }, { wch: 20 }, { wch: 40 }, { wch: 18 }];
            XLSX.utils.book_append_sheet(wb, ws1, 'Procurement List');

            // Sheet 2: Order-wise breakdown
            const orderData = [
                ['ORDER-WISE RM REQUIREMENT'],
                ['Date: ' + dateLabel],
                [],
                ['Order#', 'Product', 'Batch Ref', 'Ref No', 'Order Qty (KG)', 'RM Name', 'RM Code', 'Required (KG)', 'In Stock (KG)', 'Short (KG)', 'Status'],
            ];
            valid.forEach((o, oi) => {
                (o.forecast.rows || []).forEach(r => {
                    orderData.push([oi + 1, o.productName, o.batchNo, o.refNo || '', o.orderQty, r.rmName, r.rmCode, r.reqKg.toFixed(3), r.available.toFixed(3), r.shortQty > 0 ? r.shortQty.toFixed(3) : '0', '', r.shortQty > 0 ? 'SHORT' : 'OK']);
                });
                orderData.push([]);
            });
            const ws2 = XLSX.utils.aoa_to_sheet(orderData);
            ws2['!cols'] = [{ wch: 7 }, { wch: 28 }, { wch: 12 }, { wch: 12 }, { wch: 14 }, { wch: 28 }, { wch: 12 }, { wch: 16 }, { wch: 16 }, { wch: 12 }, { wch: 8 }];
            XLSX.utils.book_append_sheet(wb, ws2, 'Order-wise Breakdown');

            XLSX.writeFile(wb, 'Procurement_' + dateLabel.replace(/\//g, '-') + '_' + new Date().toISOString().slice(0, 10) + '.xlsx');
            toast('Procurement Excel exported ✓', 'success');
        }

        // 2. Consolidated RM export
        function fcExportConsolidatedExcel() {
            const filtered = _fcGetFiltered();
            const valid = filtered.filter(o => o.status === 'ok' && o.forecast);
            if (!valid.length) { toast('No valid orders', 'info'); return; }
            const rmMap = {};
            valid.forEach(o => {
                (o.forecast.rows || []).forEach(r => {
                    if (!rmMap[r.rmId]) rmMap[r.rmId] = { rmName: r.rmName, rmCode: r.rmCode, category: r.category || '', totalReqKg: 0, available: r.available, totalShortKg: 0, usedIn: [] };
                    rmMap[r.rmId].totalReqKg += r.reqKg; rmMap[r.rmId].totalShortKg += r.shortQty;
                    if (!rmMap[r.rmId].usedIn.includes(o.productName)) rmMap[r.rmId].usedIn.push(o.productName);
                });
            });
            const allRMs = Object.values(rmMap).sort((a, b) => b.totalReqKg - a.totalReqKg);
            const ws = XLSX.utils.aoa_to_sheet([
                ['Consolidated RM Requirement — ' + new Date().toLocaleString('en-IN')], ['Orders: ' + valid.length], [''],
                ['#', 'Raw Material', 'Code', 'Category', 'Required (KG)', 'In Stock (KG)', 'Short (KG)', 'Excess (KG)', 'Status', 'Used In'],
                ...allRMs.map((r, i) => { const ex = Math.max(0, r.available - r.totalReqKg); return [i + 1, r.rmName, r.rmCode, r.category, r.totalReqKg.toFixed(3), r.available.toFixed(3), r.totalShortKg > 0 ? r.totalShortKg.toFixed(3) : '', ex > 0 ? ex.toFixed(3) : '', r.totalShortKg > 0 ? 'PROCUREMENT REQUIRED' : 'Available', r.usedIn.join(' / ')]; })
            ]);
            ws['!cols'] = [{ wch: 5 }, { wch: 32 }, { wch: 12 }, { wch: 14 }, { wch: 16 }, { wch: 16 }, { wch: 12 }, { wch: 12 }, { wch: 22 }, { wch: 36 }];
            const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'RM Consolidated');
            XLSX.writeFile(wb, 'RM_Consolidated_' + new Date().toISOString().slice(0, 10) + '.xlsx');
            toast('Consolidated Excel exported ✓', 'success');
        }

        // 3. Full export — all orders, all sheets
        function fcExportAllExcel() {
            const valid = _fcOrders.filter(o => o.status === 'ok' && o.forecast);
            if (!valid.length) { toast('No valid orders to export', 'info'); return; }
            const wb = XLSX.utils.book_new();
            valid.forEach(o => {
                const fc = o.forecast, fm = o.formulation;
                const wsData = [
                    ['Raw Material Forecast — ' + (o.productName || fm.productName)],
                    ['Batch: ' + o.batchNo + '  |  Ref: ' + (o.refNo || '—') + '  |  Order: ' + o.orderQty + ' KG  |  Date: ' + _fcFmtDate(o.orderDate || o.createdAt || '—') + '  |  Scale: ×' + fm.scaleFactor.toFixed(4)],
                    [],
                    ['Raw Material', 'Code', 'Category', 'BOM Qty', 'BOM Unit', 'Required (KG)', 'In Stock (KG)', 'Short (KG)', 'Excess (KG)', 'Status'],
                    ...(fc.rows || []).map(r => [r.rmName, r.rmCode, r.category || '', r.origQty, r.origUnit, r.reqKg.toFixed(3), r.available.toFixed(3), r.shortQty > 0 ? r.shortQty.toFixed(3) : '', r.excessQty > 0 ? r.excessQty.toFixed(3) : '', r.status]),
                    [], ['SUMMARY'],
                    ['Order Weight (KG)', o.orderQty], ['Total Required (KG)', fc.totalRequiredKg.toFixed(3)],
                    ['Short Items', fc.shortItemCount], ['Total Shortfall (KG)', fc.totalShortKg.toFixed(3)],
                    ['Total Excess (KG)', fc.totalExcessKg.toFixed(3)],
                    ['Order Date', _fcFmtDate(o.orderDate || o.createdAt || '—')],
                    ['Procurement Required', fc.procurementRequired ? 'YES' : 'NO'],
                ];
                const ws = XLSX.utils.aoa_to_sheet(wsData);
                ws['!cols'] = [{ wch: 30 }, { wch: 10 }, { wch: 14 }, { wch: 10 }, { wch: 8 }, { wch: 16 }, { wch: 16 }, { wch: 12 }, { wch: 12 }, { wch: 26 }];
                XLSX.utils.book_append_sheet(wb, ws, (o.batchNo || 'Order').replace(/[^a-zA-Z0-9_-]/g, '_').slice(0, 28));
            });
            XLSX.writeFile(wb, 'RM_Forecast_Full_' + new Date().toISOString().slice(0, 10) + '.xlsx');
            toast('Full Excel exported ✓', 'success');
        }

        // 4. PDF — active order
        function fcExportPDF() {
            if (_fcActiveIdx === null) { toast('Click an order card first', 'info'); return; }
            const o = _fcOrders[_fcActiveIdx];
            if (o.status !== 'ok') { toast('Cannot export errored order', 'info'); return; }
            const fc = o.forecast, fm = o.formulation;
            const tableRows = (fc.rows || []).map(r => `
    <tr style="${r.shortQty > 0 ? 'background:#fff5f5' : ''}">
      <td style="padding:7px 10px;border-bottom:1px solid #e5e7eb">${_esc(r.rmName)}<br><span style="font-size:10px;color:#6b7280">${_esc(r.rmCode)}${r.category ? ' · ' + r.category : ''}</span></td>
      <td style="text-align:right;padding:7px 10px;border-bottom:1px solid #e5e7eb">${r.origQty.toFixed(3)} ${r.origUnit}</td>
      <td style="text-align:right;padding:7px 10px;border-bottom:1px solid #e5e7eb;font-weight:700;color:#2563eb">${r.reqKg.toFixed(3)}</td>
      <td style="padding:7px 10px;border-bottom:1px solid #e5e7eb;font-size:10px;color:#6b7280">KG</td>
      <td style="text-align:right;padding:7px 10px;border-bottom:1px solid #e5e7eb">${r.available.toFixed(3)}</td>
      <td style="text-align:right;padding:7px 10px;border-bottom:1px solid #e5e7eb;${r.shortQty > 0 ? 'color:#dc2626;font-weight:800' : ''}">${r.shortQty > 0 ? r.shortQty.toFixed(3) : '—'}</td>
      <td style="text-align:right;padding:7px 10px;border-bottom:1px solid #e5e7eb;${r.excessQty > 0 ? 'color:#16a34a;font-weight:700' : ''}">${r.excessQty > 0 ? r.excessQty.toFixed(3) : '—'}</td>
      <td style="padding:7px 10px;border-bottom:1px solid #e5e7eb">${r.shortQty > 0
                    ? '<span style="background:#fef2f2;color:#dc2626;border:1px solid #fca5a5;border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700">⚠ Procurement</span>'
                    : '<span style="background:#f0fdf4;color:#16a34a;border:1px solid #6ee7b7;border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700">✓ Available</span>'}</td>
    </tr>`).join('');
            const win = window.open('', '_blank', 'width=1050,height=850');
            win.document.write(`<!DOCTYPE html><html><head><title>RM Forecast — ${_esc(o.batchNo)}</title>
  <style>body{font-family:'Segoe UI',Arial,sans-serif;color:#1a1f36;margin:0;padding:24px 32px;font-size:13px}
  .hdr{background:linear-gradient(135deg,#0f172a,#1e3a5f);color:#f1f5f9;border-radius:10px;padding:18px 24px;margin-bottom:16px}
  .hdr h1{margin:0;font-size:17px;font-weight:800}.hdr p{margin:4px 0 0;font-size:12px;color:#94a3b8}

  .mc{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:9px 12px}
  .ml{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#6b7280}
  .mv{font-size:14px;font-weight:800;color:#0f172a;margin-top:2px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{background:#1e293b;color:#94a3b8;padding:7px 10px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
  .sum{background:#0f172a;color:#f1f5f9;border-radius:8px;padding:12px 16px;margin-top:12px;display:flex;gap:20px;flex-wrap:wrap}
  .sl{font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px}.sv{font-size:14px;font-weight:800;color:#f1f5f9;margin-top:2px}
  .sv.red{color:#f87171}.sv.green{color:#34d399}
  .foot{margin-top:16px;font-size:10px;color:#9ca3af;text-align:center;border-top:1px solid #e5e7eb;padding-top:8px}
  @media print{.np{display:none}}</style></head><body>
  <div class="hdr"><h1>Raw Material Forecast${o.refNo ? ' — ' + _esc(o.refNo) : ''}</h1><p>Surface Paints Pvt. Ltd.</p></div>
  <div class="mg">
    <div class="mc"><div class="ml">Product</div><div class="mv">${_esc(o.productName || fm.productName)}</div></div>
    <div class="mc"><div class="ml">Ref Batch</div><div class="mv">${_esc(o.batchNo)}</div></div>
    <div class="mc"><div class="ml">Order Qty</div><div class="mv">${o.orderQty} KG</div></div>
    <div class="mc"><div class="ml">Orig Batch</div><div class="mv">${fm.origBatchKg.toFixed(2)} KG</div></div>
    <div class="mc"><div class="ml">Scale Factor</div><div class="mv" style="color:#2563eb">×${fm.scaleFactor.toFixed(4)}</div></div>
    ${(o.orderDate || o.createdAt) ? `<div class="mc"><div class="ml">Order Date</div><div class="mv">${_esc(_fcFmtDate(o.orderDate || o.createdAt))}</div></div>` : ''}
  </div>
  <table><thead><tr><th>Raw Material</th><th style="text-align:right">BOM Qty</th><th style="text-align:right">Required (KG)</th><th>Unit</th><th style="text-align:right">In Stock (KG)</th><th style="text-align:right">Short (KG)</th><th style="text-align:right">Excess (KG)</th><th>Status</th></tr></thead>
  <tbody>${tableRows}</tbody></table>
  <div class="sum">

        function _esc(s) {
            return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }



        // ════════════════════════════════════════════════════════════════════
        //  BUSINESS INTELLIGENCE & ANALYTICS MODULE  v1.0
        //  Full Power-BI style real-time analytics dashboard
        // ════════════════════════════════════════════════════════════════════

        // ── Core analytics engine ─────────────────────────────────────────
        function buildAnalyticsData(filters) {
            const { fromDate, toDate, partyFilter, productFilter, rmFilter } = filters || {};

            // Filter formulations by date range
            let forms = DB.formulations.filter(f => {
                const d = f.mfgDate || f.createdAt || '';
                if (fromDate && d && d < fromDate) return false;
                if (toDate && d && d > toDate + ' 99') return false;
                if (partyFilter && partyFilter !== '' && f.partyId !== partyFilter && f.partyName !== partyFilter) return false;
                if (productFilter && productFilter !== '' && !f.productName.toLowerCase().includes(productFilter.toLowerCase())) return false;
                return true;
            });

            // ── Product demand (by production count + total KG produced) ─────
            const productMap = {};
            forms.forEach(f => {
                const key = f.productName || 'Unnamed';
                const qty = calcTotalQty(f) * (f.lots || 1);
                const cost = calcBatchCost(f);
                const totalCost = cost.total * (f.lots || 1);
                if (!productMap[key]) productMap[key] = {
                    name: key, code: f.productCode || '', count: 0, totalKg: 0, totalCost: 0,
                    costPerKg: 0, parties: new Set(), batches: [], dates: [], months: {}
                };
                productMap[key].count++;
                productMap[key].totalKg += qty;
                productMap[key].totalCost += totalCost;
                if (f.partyId || f.partyName) productMap[key].parties.add(f.partyName || f.partyId);
                productMap[key].batches.push(f.batchNo || '');
                const dt = (f.mfgDate || f.createdAt || '').slice(0, 7);
                if (dt) {
                    productMap[key].dates.push(dt);
                    productMap[key].months[dt] = (productMap[key].months[dt] || 0) + qty;
                }
            });
            const products = Object.values(productMap).map(p => ({
                ...p, parties: [...p.parties],
                costPerKg: p.totalKg > 0 ? p.totalCost / p.totalKg : 0
            })).sort((a, b) => b.count - a.count);

            // ── Customer/Party analysis ───────────────────────────────────────
            const partyMap = {};
            forms.forEach(f => {
                const key = f.partyName || f.partyId || 'Unknown Customer';
                if (!partyMap[key]) partyMap[key] = { name: key, orders: 0, totalKg: 0, totalCost: 0, products: new Set(), batches: [], lastOrder: '', refs: [] };
                const qty = calcTotalQty(f) * (f.lots || 1);
                const cost = calcBatchCost(f).total * (f.lots || 1);
                partyMap[key].orders++;
                partyMap[key].totalKg += qty;
                partyMap[key].totalCost += cost;
                partyMap[key].products.add(f.productName);
                partyMap[key].batches.push(f.batchNo || '');
                const d = f.mfgDate || f.createdAt || '';
                if (d > partyMap[key].lastOrder) partyMap[key].lastOrder = d;
                if (f.refNo) partyMap[key].refs.push(f.refNo);
            });
            const parties = Object.values(partyMap).map(p => ({
                ...p, products: [...p.products]
            })).sort((a, b) => b.orders - a.orders);

            // ── Raw Material consumption ──────────────────────────────────────
            const rmMap2 = {};
            forms.forEach(f => {
                (f.items || []).forEach(item => {
                    const rm = getRMById(item.rmId); if (!rm) return;
                    if (rmFilter && rmFilter !== '' && String(item.rmId) !== rmFilter) return;
                    const u = (item.unit || rm.unit || 'KG').toUpperCase();
                    const qtyKg = (u === 'G' || u === 'ML') ? item.qty / 1000 : item.qty;
                    const lots = f.lots || 1;
                    const totalKg = qtyKg * lots;
                    const rate = item.rate !== undefined && item.rate !== null ? item.rate : (rm.rate || 0);
                    const cost = totalKg * rate;
                    if (!rmMap2[rm.id]) rmMap2[rm.id] = {
                        id: rm.id, name: rm.name, code: rm.code, unit: rm.unit,
                        category: rm.category || 'Other', rate: rm.rate || 0,
                        totalKgConsumed: 0, totalCost: 0, usedInProducts: new Set(),
                        usedInBatches: 0, minStock: rm.minStock || 0
                    };
                    rmMap2[rm.id].totalKgConsumed += totalKg;
                    rmMap2[rm.id].totalCost += cost;
                    rmMap2[rm.id].usedInProducts.add(f.productName);
                    rmMap2[rm.id].usedInBatches++;
                });
            });
            const rmUsage = Object.values(rmMap2).map(r => ({
                ...r, usedInProducts: [...r.usedInProducts],
                currentStock: (DB.inventory.find(i => i.rmId === r.id) || { quantity: 0 }).quantity,
                stockValue: ((DB.inventory.find(i => i.rmId === r.id) || { quantity: 0 }).quantity) * (r.rate || 0)
            })).sort((a, b) => b.totalKgConsumed - a.totalKgConsumed);

            // ── Monthly trend ─────────────────────────────────────────────────
            const monthMap = {};
            forms.forEach(f => {
                const m = (f.mfgDate || f.createdAt || '').slice(0, 7); if (!m) return;
                if (!monthMap[m]) monthMap[m] = { month: m, batches: 0, totalKg: 0, totalCost: 0, products: new Set(), parties: new Set() };
                monthMap[m].batches++;
                monthMap[m].totalKg += calcTotalQty(f) * (f.lots || 1);
                monthMap[m].totalCost += calcBatchCost(f).total * (f.lots || 1);
                monthMap[m].products.add(f.productName);
                if (f.partyName || f.partyId) monthMap[m].parties.add(f.partyName || f.partyId);
            });
            const monthlyTrend = Object.values(monthMap).map(m => ({
                ...m, products: m.products.size, parties: m.parties.size
            })).sort((a, b) => a.month.localeCompare(b.month));

            // ── ABC Analysis (by production frequency) ───────────────────────
            const totalBatches = products.reduce((s, p) => s + p.count, 0);
            let cumPct = 0;
            const abcProducts = products.map(p => {
                const pct = (p.count / totalBatches) * 100;
                cumPct += pct;
                return {
                    ...p, pct: pct.toFixed(1), cumPct: cumPct.toFixed(1),
                    abc: cumPct <= 80 ? 'A' : cumPct <= 95 ? 'B' : 'C'
                };
            });

            // ── Repeated orders (products made 3+ times for same customer) ───
            const repeatMap = {};
            forms.forEach(f => {
                const key = (f.partyName || f.partyId || 'Unknown') + '||' + f.productName;
                if (!repeatMap[key]) repeatMap[key] = {
                    party: f.partyName || f.partyId || 'Unknown',
                    product: f.productName, count: 0, totalKg: 0, batches: [], dates: []
                };
                repeatMap[key].count++;
                repeatMap[key].totalKg += calcTotalQty(f) * (f.lots || 1);
                repeatMap[key].batches.push(f.batchNo || '');
                repeatMap[key].dates.push((f.mfgDate || f.createdAt || '').slice(0, 10));
            });
            const repeatOrders = Object.values(repeatMap).filter(r => r.count >= 2)
                .sort((a, b) => b.count - a.count);

            // ── Inventory turnover ────────────────────────────────────────────
            const invTurnover = rmUsage.map(r => {
                const avgStock = r.currentStock > 0 ? r.currentStock : 1;
                const turnover = r.totalKgConsumed > 0 ? (r.totalKgConsumed / avgStock) : 0;
                return {
                    ...r, turnover: turnover.toFixed(2),
                    category2: turnover > 2 ? 'Fast Moving' : turnover > 0.5 ? 'Medium' : 'Slow Moving'
                };
            });

            // ── Summary KPIs ─────────────────────────────────────────────────
            const totalKgProduced = forms.reduce((s, f) => s + calcTotalQty(f) * (f.lots || 1), 0);
            const totalCostProduced = forms.reduce((s, f) => s + calcBatchCost(f).total * (f.lots || 1), 0);
            const uniqueProducts = new Set(forms.map(f => f.productName)).size;
            const uniqueParties = new Set(forms.map(f => f.partyName || f.partyId).filter(Boolean)).size;
            const totalInventoryValue = DB.rawMaterials.reduce((s, rm) => {
                const inv = DB.inventory.find(i => i.rmId === rm.id) || { quantity: 0 };
                return s + (inv.quantity * (rm.rate || 0));
            }, 0);
            const lowStockCount = DB.rawMaterials.filter(rm => {
                const inv = DB.inventory.find(i => i.rmId === rm.id) || { quantity: 0 };
                return rm.minStock > 0 && inv.quantity < rm.minStock;
            }).length;

            return {
                products, parties, rmUsage, monthlyTrend, abcProducts, repeatOrders,
                invTurnover, totalBatches: forms.length, totalKgProduced, totalCostProduced,
                uniqueProducts, uniqueParties, totalInventoryValue, lowStockCount, forms
            };
        }

        // ── Mini bar chart SVG ────────────────────────────────────────────
        function miniBar(values, labels, colors, maxVal, height = 60) {
            if (!values || values.length === 0) return '';
            const w = Math.max(400, values.length * 44);
            const m = maxVal || Math.max(...values) || 1;
            const bars = values.map((v, i) => {
                const bh = Math.max(2, Math.round((v / m) * (height - 20)));
                const x = i * 44 + 4; const y = height - bh - 18;
                const col = Array.isArray(colors) ? colors[i % colors.length] : colors;
                const lbl = labels ? labels[i] : '';
                return `<rect x="${x}" y="${y}" width="36" height="${bh}" rx="4" fill="${col}" opacity="0.85"/>
    <text x="${x + 18}" y="${height - 4}" text-anchor="middle" font-size="9" fill="#64748b">${String(lbl).slice(-7)}</text>
    <text x="${x + 18}" y="${y - 3}" text-anchor="middle" font-size="9" font-weight="700" fill="#1e293b">${v > 999 ? (v / 1000).toFixed(1) + 'k' : Number(v).toFixed(v < 10 ? 1 : 0)}</text>`;
            }).join('');
            return `<svg viewBox="0 0 ${w} ${height}" width="100%" style="max-width:${w}px">${bars}</svg>`;
        }

        // ── Sparkline ─────────────────────────────────────────────────────
        function sparkLine(values, color = '#3b82f6') {
            if (!values || values.length < 2) return '';
            const w = 120, h = 32;
            const m = Math.max(...values) || 1;
            const pts = values.map((v, i) => `${Math.round((i / (values.length - 1)) * w)},${Math.round(h - 2 - ((v / m) * (h - 4)))}`)
                .join(' ');
            return `<svg width="${w}" height="${h}" style="display:inline-block;vertical-align:middle"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round"/></svg>`;
        }

        function exportBICustomerDetail() {
            try {
                const d = window._biData;
                if (!d) { toast('Open Analytics tab first and wait for data to load', 'error'); return; }

                // Build per-customer order list
                const custOrders2 = {};
                d.forms.forEach(f => {
                    const key = (f.partyName || f.partyId || '').trim();
                    if (!key) return;
                    if (!custOrders2[key]) custOrders2[key] = [];
                    const qty = calcTotalQty(f) * (f.lots || 1);
                    const cost = calcBatchCost(f);
                    custOrders2[key].push({
                        customer: key,
                        batchNo: f.batchNo || '',
                        productName: f.productName || '',
                        productCode: f.productCode || '',
                        productType: f.productType || '',
                        productFinish: f.productFinish || '',
                        refNo: f.refNo || '',
                        lots: f.lots || 1,
                        qty: qty,
                        rmCost: cost.rmCost * (f.lots || 1),
                        pkgCost: cost.packaging * (f.lots || 1),
                        totalCost: cost.total * (f.lots || 1),
                        costPerKg: qty > 0 ? cost.total / qty : 0,
                        date: (f.mfgDate || f.createdAt || '').slice(0, 10),
                        by: f.byName || f.by || ''
                    });
                });

                if (Object.keys(custOrders2).length === 0) {
                    toast('No customer order data found — add Party Name to formulations', 'error');
                    return;
                }

                const wb = XLSX.utils.book_new();
                const HDR = ['#', 'Customer', 'Product Name', 'Code', 'Type', 'Finish', 'Batch No', 'Ref No', 'Lots', 'Qty (KG)', 'RM Cost (Rs)', 'Pkg Cost (Rs)', 'Total Cost (Rs)', 'Cost per KG (Rs)', 'Date', 'Made By'];
                const masterRows = [HDR];

                // Build each customer sheet + collect into master
                Object.entries(custOrders2).forEach(([cust, orders]) => {
                    const custHdr = ['#', 'Product Name', 'Code', 'Type', 'Finish', 'Batch No', 'Ref No', 'Lots', 'Qty (KG)', 'RM Cost (Rs)', 'Pkg Cost (Rs)', 'Total Cost (Rs)', 'Cost per KG (Rs)', 'Date', 'Made By'];
                    const rows = [custHdr];
                    orders.sort((a, b) => b.date.localeCompare(a.date)).forEach((o, i) => {
                        const r = [i + 1, o.productName, o.productCode, o.productType, o.productFinish,
                        o.batchNo, o.refNo, o.lots,
                        Math.round(o.qty * 1000) / 1000,
                        Math.round(o.rmCost * 100) / 100,
                        Math.round(o.pkgCost * 100) / 100,
                        Math.round(o.totalCost * 100) / 100,
                        Math.round(o.costPerKg * 100) / 100,
                        o.date, o.by];
                        rows.push(r);
                        masterRows.push([i + 1, cust, ...r.slice(1)]);
                    });
                    // Totals row
                    rows.push([
                        'TOTAL', '', '', '', '', '', '', '',
                        Math.round(orders.reduce((s, o) => s + o.qty, 0) * 1000) / 1000,
                        Math.round(orders.reduce((s, o) => s + o.rmCost, 0) * 100) / 100,
                        Math.round(orders.reduce((s, o) => s + o.pkgCost, 0) * 100) / 100,
                        Math.round(orders.reduce((s, o) => s + o.totalCost, 0) * 100) / 100,
                        '', '', ''
                    ]);
                    // Sheet name: strip Excel-illegal chars, max 31 chars
                    const safe = cust.replace(/[/\\:*?[\]]/g, '').trim().slice(0, 31) || 'Customer';
                    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), safe);
                });

                // Prepend master "All Customers" sheet at position 0
                const masterWs = XLSX.utils.aoa_to_sheet(masterRows);
                // Insert at front by rebuilding SheetNames order
                const existingNames = [...wb.SheetNames];
                wb.SheetNames.length = 0;
                wb.SheetNames.push('All Customers');
                existingNames.forEach(n => wb.SheetNames.push(n));
                wb.Sheets['All Customers'] = masterWs;

                const fname = 'Customer_Order_Detail_' + new Date().toISOString().slice(0, 10) + '.xlsx';
                XLSX.writeFile(wb, fname);
                toast('Downloaded — ' + (Object.keys(custOrders2).length + 1) + ' sheets (All Customers + one per customer)', 'success');
            } catch (err) {
                console.error('exportBICustomerDetail error:', err);

        // ── Single sheet export ───────────────────────────────────────────
        function exportBISheet(type) {
            const d = window._biData; if (!d) return;
            const sheetFns = {
                products: () => {
                    const rows = [['Product Name', 'Code', 'ABC', 'Batches', 'Total KG', 'Total Cost', 'Cost/KG', 'Customers', '% Share']];
                    d.abcProducts.forEach(p => rows.push([p.name, p.code || '', p.abc, p.count, p.totalKg.toFixed(2), p.totalCost.toFixed(2), p.costPerKg.toFixed(2), p.parties.length, p.pct]));
                    return [rows, 'Product_Demand'];
                },
                customers: () => {
                    const rows = [['Customer', 'Orders', 'Total KG', 'Total Business', 'Avg KG/Order', 'Products', 'Last Order']];
                    d.parties.filter(p => p.name !== 'Unknown Customer').forEach(p => rows.push([p.name, p.orders, p.totalKg.toFixed(2), p.totalCost.toFixed(2), (p.totalKg / p.orders).toFixed(2), p.products.length, p.lastOrder.slice(0, 10)]));
                    return [rows, 'Customer_Analysis'];
                },
                materials: () => {
                    const rows = [['Material', 'Code', 'Category', 'KG Consumed', 'Cost', 'Batches', 'Products', 'Stock', 'Stock Value', 'Status']];
                    d.rmUsage.forEach(r => { const rm = getRMById(r.id); rows.push([r.name, r.code, r.category || '', r.totalKgConsumed.toFixed(3), r.totalCost.toFixed(2), r.usedInBatches, r.usedInProducts.length, r.currentStock.toFixed(3), r.stockValue.toFixed(2), rm ? getStockStatus(rm).toUpperCase() : '']); });
                    return [rows, 'Material_Consumption'];
                },
                trends: () => {
                    const rows = [['Month', 'Batches', 'KG Produced', 'Total Cost', 'Products', 'Customers']];
                    d.monthlyTrend.forEach(m => rows.push([m.month, m.batches, m.totalKg.toFixed(2), m.totalCost.toFixed(2), m.products, m.parties]));
                    return [rows, 'Monthly_Trend'];
                },
                repeat: () => {
                    const rows = [['Customer', 'Product', 'Count', 'Total KG', 'Batches', 'Dates']];
                    d.repeatOrders.forEach(r => rows.push([r.party, r.product, r.count, r.totalKg.toFixed(2), r.batches.join(', '), r.dates.join(', ')]));
                    return [rows, 'Repeat_Orders'];
                },
                inventory: () => {
                    const rows = [['Material', 'Category', 'Stock', 'Min Stock', 'KG Consumed', 'Turnover', 'Stock Value', 'Movement']];
                    d.invTurnover.forEach(r => rows.push([r.name, r.category || '', r.currentStock.toFixed(3), r.minStock, r.totalKgConsumed.toFixed(3), r.turnover, r.stockValue.toFixed(2), r.category2]));
                    return [rows, 'Inventory_Turnover'];
                },
                costing: () => {
                    const rows = [['Product', 'Code', 'Batches', 'Total KG', 'Total Cost', 'Cost/KG', '% of Total']];
                    const grand = d.products.reduce((s, p) => s + p.totalCost, 0);
                    [...d.products].sort((a, b) => b.totalCost - a.totalCost).forEach(p => rows.push([p.name, p.code || '', p.count, p.totalKg.toFixed(2), p.totalCost.toFixed(2), p.costPerKg.toFixed(2), grand > 0 ? ((p.totalCost / grand) * 100).toFixed(1) : '0']));
                    return [rows, 'Costing_Analysis'];
                }
            };
            const fn = sheetFns[type]; if (!fn) return;
            const [data, name] = fn();
            dlExcel(data, 'BI_' + name);
        }

        // Auto-init when page loads
        setTimeout(() => { if (document.getElementById('bi-panels')) refreshBI(); }, 100);

                    await loadFromGAS();
                    initApp();
                } catch (err) {
                    console.error('Session restoration failed:', err);
                    logout();
                } finally {
                    hideSaving();
                }
            }
        }, 150);


    </script>
</body>

</html>
